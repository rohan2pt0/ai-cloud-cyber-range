# AI model & asset registry — the "model inventory, risk classification, approval gates,
# traceability" artefact (Deloitte/EXL/UAE JDs). Treated as code; changes go through PR +
# the approval_gate below. An AI-SPM tool / CI reads this to enforce that only approved,
# risk-classified models are used. This is the governance spine of ISO/IEC 42001 + NIST AI RMF MAP.
version: 1
owner: securax-maintainers
updated: 2026-10-17

# Risk tiers follow EU AI Act / NIST AI RMF framing.
risk_tiers: [minimal, limited, high, unacceptable]

approval_gate:
  required_for: [high]          # high-risk use-cases need documented sign-off before prod
  approvers: [ciso, model-risk-committee]
  evidence: [threat_model, red_team_scorecard, dpia]   # DPIA for DPDP/GDPR

models:
  - id: bank-assistant-local
    provider: ollama
    model: qwen2.5:1.5b
    served_as: [bank-assistant-local]   # the names callers use at the gateway (RBI MRM draft para 21: nothing in use outside the inventory)
    hosting: on-prem-laptop
    data_residency: local
    use_case: customer banking Q&A
    risk_tier: high                 # handles personal + financial data
    guardrails: [input-rails, output-rails, pii-redaction, llama-guard]
    approved: true
    approved_by: model-risk-committee
    dpia: docs/compliance-matrix.md
    owner: securax-maintainers
    # RBI MRM draft (June 2026): who supplies it, how its outputs are explained, and when it was last independently validated
    third_party: true               # open-weights model from an outside developer, run locally
    explainability: "answers cite the handbook passage they use; no credit or fraud decision is taken by this model"
    validated: 2026-10-10
    validated_by: redteam/run_attacks.py + sandbox journeys (independent of the model's developer)
    validated_model: qwen2.5:1.5b   # para 42: a model changed after validation must be validated again

  - id: bank-assistant-gemini
    provider: gemini
    model: gemini-2.5-flash
    served_as: [bank-assistant]
    hosting: gcp-asia-south1
    data_residency: india
    use_case: burst capacity for banking Q&A
    risk_tier: high
    guardrails: [input-rails, output-rails, pii-redaction, model-armor]
    approved: true
    approved_by: model-risk-committee
    owner: securax-maintainers
    third_party: true               # a cloud provider's model: accountability stays with us (RBI MRM draft)
    explainability: "answers cite the handbook passage they use; no credit or fraud decision is taken by this model"
    validated: 2026-10-10
    validated_by: redteam/run_attacks.py + sandbox journeys
    validated_model: gemini-2.5-flash

  - id: soc-triage-assistant
    provider: ollama
    model: qwen2.5:1.5b
    hosting: on-prem-laptop
    data_residency: local
    use_case: SOC incident summarisation (AI-for-security)
    risk_tier: limited              # internal, no customer data; inputs sanitised
    guardrails: [input-rails, output-rails]
    approved: true
    owner: securax-maintainers
    third_party: true
    validated: 2026-10-10
    validated_by: purple-team loop (redteam/purple.py)
    validated_model: qwen2.5:1.5b

# Retired models stay listed: the RBI MRM draft expects their records to be kept (10 years here; `./securax ai inventory`).
decommissioned: []

# Datasets / knowledge sources governed the same way (data poisoning / supply chain).
datasets:
  - id: bank-kb
    source: internal-CMS
    classification: internal
    pii: false
    integrity_control: rag-chunk-sanitisation + provenance-taint
    approved: true

# Explicitly disallowed (shadow AI) — CI should fail if these appear in config.
disallowed_models:
  - "*:latest"                      # unpinned
  - "huggingface:*-uncensored*"     # ungoverned / unsafe
