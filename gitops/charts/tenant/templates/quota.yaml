{{- $t := include "tenant.tier" . | fromYaml }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: {{ include "tenant.ns" . }}
  labels: {{- include "tenant.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: {{ $t.cpu | quote }}
    requests.memory: {{ $t.mem | quote }}
    limits.cpu: {{ mul (int $t.cpu) 2 | quote }}
    limits.memory: {{ $t.mem | quote }}
    pods: {{ $t.pods | quote }}
    services.loadbalancers: "0"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: {{ include "tenant.ns" . }}
spec:
  limits:
    - type: Container
      default: { cpu: {{ $t.limCpu | quote }}, memory: {{ $t.limMem | quote }} }
      defaultRequest: { cpu: 50m, memory: 96Mi }
