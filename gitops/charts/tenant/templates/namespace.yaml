apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "tenant.ns" . }}
  labels:
    {{- include "tenant.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    securax.io/display-name: {{ .Values.tenant.name | quote }}
