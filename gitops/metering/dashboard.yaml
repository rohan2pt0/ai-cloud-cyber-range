apiVersion: v1
kind: ConfigMap
metadata:
  name: securax-tenant-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  securax-tenants.json: |
    {
      "title": "SecuRAX \u2014 tenant usage & SLA",
      "uid": "securax-tenants",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "tags": [
        "securax",
        "msp"
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requests per second",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "tenant:requests:rate5m",
              "legendFormat": "{{tenant}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Tokens in the last hour (billing basis)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (tenant) (tenant:tokens:increase1h)",
              "legendFormat": "{{tenant}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Blocked-request ratio (attacks / misfiring rails)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "tenant:blocked:ratio10m",
              "legendFormat": "{{tenant}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Upstream error ratio (SLA: < 0.5%)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "datasource": {
            "type": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "tenant:upstream_error:ratio30m",
              "legendFormat": "{{tenant}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Average latency",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "tenant:latency_ms:avg5m",
              "legendFormat": "{{tenant}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
