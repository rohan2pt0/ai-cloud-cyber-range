# GENERATED by lifecycle/render_core.py from local/compose/litellm-config.yaml — do not edit by hand.
# The shared model router every tenant gateway talks to. Provider keys come from the optional Secret `securax-providers`
# (created by `./securax grow canopy` from your local .env); the router key from `router-key`.
apiVersion: v1
kind: Namespace
metadata:
  name: securax-core
  labels:
    pod-security.kubernetes.io/enforce: baseline
    securax.io/core: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: securax-core
data:
  config.yaml: |
    # AUTO-GENERATED from plugins/catalog.json by gen_litellm_config.py — do NOT hand-edit.
    # Re-run `./securax providers` (or this script with --write) after adding/removing a key.
    # The gateway is the SECURITY PEP; this is the FinOps/RESILIENCE PEP (fallback ladders).
    # One deployment per alias (no random shuffle); chains + fallbacks give the degradation ladder.
    model_list:
      # ---- each enabled provider, selectable by its own alias ----
      - model_name: bank-assistant-gemini
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          timeout: 40
          api_key: os.environ/GEMINI_API_KEY
      - model_name: bank-assistant-local
        litellm_params:
          model: ollama/qwen2.5:1.5b
          api_base: http://ollama:11434
          timeout: 300
      # ---- degradation ladders: the first enabled rung answers; the rest are fallbacks ----
      - model_name: bank-assistant
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          timeout: 40
          api_key: os.environ/GEMINI_API_KEY
      - model_name: builder
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          timeout: 40
          api_key: os.environ/GEMINI_API_KEY
      - model_name: twin
        litellm_params:
          model: gemini/gemini-3.5-flash-lite
          timeout: 40
          api_key: os.environ/GEMINI_API_KEY

    litellm_settings:
      num_retries: 1
      request_timeout: 120
      fallbacks: [{"bank-assistant": ["bank-assistant-local"]}, {"builder": ["bank-assistant-local"]}, {"twin": ["bank-assistant-local"]}]
      drop_params: true
      json_logs: true

    router_settings:
      routing_strategy: simple-shuffle
      # a deployment that fails twice is cooled down briefly so requests go straight to the next rung
      allowed_fails: 2
      cooldown_time: 30

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      max_budget: 25
      budget_duration: 30d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: securax-core
spec:
  replicas: 2
  selector:
    matchLabels: { app: litellm }
  template:
    metadata:
      labels: { app: litellm }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.83.14-stable@sha256:c81eb79cd4333c6cfe374c0ec929110fd23f0ee5f7fd198855a6fbddc77b83ba
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports: [{ containerPort: 4000 }]
          envFrom:
            - secretRef: { name: router-key, optional: true }
            - secretRef: { name: securax-providers, optional: true }
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HOME, value: /tmp }
          readinessProbe: { httpGet: { path: /health/readiness, port: 4000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/liveness, port: 4000 }, initialDelaySeconds: 30 }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/litellm }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: litellm-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: securax-core
spec:
  selector: { app: litellm }
  ports: [{ port: 4000, targetPort: 4000 }]
---
# Only tenant gateways may call the router; nothing else in the cluster can.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-from-tenants
  namespace: securax-core
spec:
  podSelector:
    matchLabels: { app: litellm }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions: [{ key: securax.io/tenant, operator: Exists }]
      ports: [{ port: 4000, protocol: TCP }]
---
# Clone the router key into every tenant namespace (Kyverno generate): the tenant chart never holds a secret.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: clone-router-key
spec:
  rules:
    - name: clone-router-key
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchExpressions: [{ key: securax.io/tenant, operator: Exists }]
      generate:
        apiVersion: v1
        kind: Secret
        name: router-key
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        clone:
          namespace: securax-core
          name: router-key
