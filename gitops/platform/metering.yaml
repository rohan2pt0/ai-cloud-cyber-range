# Per-tenant usage, SLA and billing basis: recording rules + a Grafana dashboard (picked up by the Grafana sidecar).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metering
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  project: default
  source:
    repoURL: https://github.com/rohan2pt0/ai-cloud-cyber-range.git
    targetRevision: main
    path: gitops/metering
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [SkipDryRunOnMissingResource=true]
    retry: { limit: 10, backoff: { duration: 30s, factor: 2, maxDuration: 10m } }
