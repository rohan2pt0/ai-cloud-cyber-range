apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securax-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rohan2pt0/ai-cloud-cyber-range.git
    targetRevision: main
    path: gitops/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
