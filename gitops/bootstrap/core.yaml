apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: core
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  project: default
  source:
    repoURL: https://github.com/rohan2pt0/ai-cloud-cyber-range.git
    targetRevision: main
    path: gitops/core
  destination:
    server: https://kubernetes.default.svc
    namespace: securax-core
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
