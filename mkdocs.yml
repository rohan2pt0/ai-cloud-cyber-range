# SecuRAX documentation site (Microsoft-Learn-style: Get started · How-to · Concepts · Apps · Security · Reference).
# Build locally:  pip install -r docs/requirements.txt && python3 docs/gen_cli_reference.py && mkdocs serve
site_name: SecuRAX Docs
site_description: Sovereign AI estate for one person or a family, built to bank-grade security habits.
site_url: !ENV [DOCS_SITE_URL, ""]   # set from brand.env by website/build.sh
repo_url: https://github.com/rohan2pt0/ai-cloud-cyber-range
repo_name: rohan2pt0/ai-cloud-cyber-range
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: |
  *.json
theme:
  name: material
  language: en
  icon: { logo: material/shield-check, repo: fontawesome/brands/github }
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy      # one-tap copy: never paste the ``` fence lines into a terminal
    - content.action.edit
    - toc.follow
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets: { base_path: [".", "docs"], check_paths: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
hooks:
  - docs/hooks/repo_links.py   # links to repository files outside docs/ go to GitHub; included files keep their own links
validation:
  # A link to a page or file that exists nowhere fails the strict build (doc 99). Anchors are checked too.
  links: { not_found: warn, anchors: warn, unrecognized_links: warn }
extra:
  social:
    - { icon: fontawesome/brands/github, link: https://github.com/rohan2pt0/ai-cloud-cyber-range }
copyright: !ENV [DOCS_COPYRIGHT, "SecuRAX · FSL-1.1-MIT (each release becomes MIT after two years) · no personal data in this repository"]
