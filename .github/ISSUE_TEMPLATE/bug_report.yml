name: Bug report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Please do **not** file security vulnerabilities here — see SECURITY.md."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `./securax ...`
        2. ...
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: SecuRAX version
      description: "Output of `cat VERSION` or the gateway /version endpoint."
    validations: { required: true }
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [gateway, estate-sync, guiding-map PWA, web-research agent, MCP, routines, design, CI/IaC, docs, other]
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: OS / environment
      placeholder: "Windows 11 + Docker Desktop (WSL2) / macOS / Linux"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs/output. Redact any secrets or PII first.
      render: shell
