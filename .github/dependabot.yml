# Keep dependencies patched automatically. https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/apps/llm-gateway", "/apps/estate-sync", "/agents/web_research", "/design"]
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message: { prefix: "deps" }
  - package-ecosystem: "npm"
    directory: "/guiding-map"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message: { prefix: "deps" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "ci"]
    commit-message: { prefix: "ci" }
  - package-ecosystem: "docker"
    directories: ["/apps/llm-gateway", "/apps/estate-sync"]
    schedule: { interval: "weekly" }
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "deps" }
  # Container images pinned in Dockerfiles and the compose files (third-party images are the biggest patching surface).
  - package-ecosystem: "docker"
    directories: ["/apps/llm-gateway", "/apps/estate-sync"]
    schedule: { interval: "weekly" }
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "deps" }
  - package-ecosystem: "docker-compose"
    directories: ["/local/compose"]
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["dependencies", "docker"]
    commit-message: { prefix: "deps" }
  # Terraform providers/modules of the cloud genomes (dormant by default, but they must not rot).
  - package-ecosystem: "terraform"
    directories: ["/infra/terraform/lifecycle/aws", "/infra/terraform/lifecycle/gcp", "/infra/terraform/lifecycle/azure"]
    schedule: { interval: "monthly" }
    labels: ["dependencies", "terraform"]
    commit-message: { prefix: "deps" }
