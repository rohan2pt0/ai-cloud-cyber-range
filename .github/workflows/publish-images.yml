# Publish the guardrail gateway image so tenant cells in a cluster (gitops/charts/tenant) can pull it.
# Runs only on a version tag (v*). NOT exercised by CI on pull requests: first use is your first tagged release.
name: publish-images
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write      # keyless signing of the build provenance (SLSA)
  attestations: write

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/securax-llm-gateway
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: apps/llm-gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # SLSA build provenance: a signed statement of which commit/workflow built this exact digest.
      # Verify with:  gh attestation verify oci://ghcr.io/<owner>/securax-llm-gateway:<tag> --owner <owner>
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/securax-llm-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
