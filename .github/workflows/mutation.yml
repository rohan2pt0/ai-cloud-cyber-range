# Weekly mutation testing of the safety-rail code (tools/mutate.py): would the tests notice if a rail were quietly weakened?
# Fails only on a NEW surviving mutant (the known ones are listed, each with a reason, in tools/mutate-baseline.json).
name: mutation
on:
  schedule:
    - cron: "17 3 * * 1"          # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: "Install gateway and test dependencies"
        run: pip install -r apps/llm-gateway/requirements-dev.txt pyyaml
      - name: "Mutate the rail code and fail on a new survivor"
        run: python tools/mutate.py --all --max 40 --check --out mutation-report.json
      - name: "Upload the mutation report"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: mutation-report.json
          if-no-files-found: warn
