# DevSecOps pipeline: SAST + secrets + deps + container + IaC + AI red-team, all free,
# all on GitHub-hosted runners. This IS the CI/CD evidence for the interview.
name: devsecops
on:
  push: { branches: ["**"] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab
  id-token: write          # OIDC to cloud (keyless), used only on main

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install gateway + test deps
        run: pip install -r apps/llm-gateway/requirements-dev.txt pyyaml
      - name: Unit tests (gateway + AI-SOC + personal-rnd)
        run: python -m pytest -q
      - name: AI red-team scorecard (gate at 90% defence, 0 false positives)
        run: python redteam/run_attacks.py --out redteam/results.json --fail-under 0.9
      - name: AI-SPM posture scan
        run: python redteam/aispm_scan.py --root . --out docs/aispm-report.json
      - name: Board risk brief
        run: python redteam/board_report.py --redteam redteam/results.json --aispm docs/aispm-report.json --out docs/board-brief.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-assurance-reports
          path: |
            redteam/results.json
            docs/aispm-report.json
            docs/board-brief.md

  guiding-map:
    # The life-OS cockpit: verify the single-file build is in sync with its source,
    # then run the jsdom behaviour suite (boot, every tab renders, XSS-escaping,
    # no NaN/Infinity, undo, habit EMA, drift alarms, dynamic playbook).
    # (PII/secret gating of these files runs in the python `app-tests` job.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install jsdom
        working-directory: guiding-map
        run: npm ci || npm install
      - name: Build drift guard (index.html must equal `node build.js`)
        working-directory: guiding-map
        run: |
          node build.js
          git diff --exit-code index.html \
            || { echo "::error::index.html is out of sync with ops.js — run 'node build.js' and commit"; exit 1; }
      - name: Behaviour suite (jsdom)
        working-directory: guiding-map
        run: |
          for t in test test2 test11 test12 test13; do
            echo "== $t =="
            node tests/$t.js
          done

  sast-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Semgrep (SAST, OWASP + security-audit rulesets)
        uses: semgrep/semgrep-action@v1
        with: { config: "p/security-audit p/python p/dockerfile p/owasp-top-ten" }

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config validation (catches deploy-blocking errors before anyone runs it)
        working-directory: local/compose
        run: |
          cp -n .env.example .env 2>/dev/null || true
          docker compose --profile ai config -q && echo "compose config valid"
      - name: Trivy IaC/misconfig scan (Terraform + K8s + Dockerfile)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (SHA-pinned; CVE-2026-33634 tag hijack)
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-config.sarif }
      - name: Conftest (OPA policy gate on Terraform)
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
          # A full plan needs cloud creds; here we lint the HCL and run policy unit smoke.
          conftest verify --policy policies/opa || true

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t vulnbank/llm-gateway:ci apps/llm-gateway
      - name: Build estate-sync image (sovereign cross-device state store)
        run: docker build -t securax/estate-sync:ci apps/estate-sync
      - name: Trivy image scan (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 (SHA-pinned; CVE-2026-33634 tag hijack)
        with:
          image-ref: vulnbank/llm-gateway:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-image.sarif }
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: vulnbank/llm-gateway:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
