# DevSecOps pipeline: SAST + secrets + deps + container + IaC + AI red-team, all free,
# all on GitHub-hosted runners. This IS the CI/CD evidence for the interview.
name: devsecops
on:
  push: { branches: ["**"] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to the Security tab
  id-token: write          # OIDC to cloud (keyless), used only on main

jobs:
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install gateway + test deps
        run: pip install -r apps/llm-gateway/requirements-dev.txt
      - name: Unit tests (guardrails)
        run: cd apps/llm-gateway && python -m pytest -q
      - name: AI red-team scorecard (gate at 90% defence, 0 false positives)
        run: python redteam/run_attacks.py --out redteam/results.json --fail-under 0.9
      - name: AI-SPM posture scan
        run: python redteam/aispm_scan.py --root . --out docs/aispm-report.json
      - name: Board risk brief
        run: python redteam/board_report.py --redteam redteam/results.json --aispm docs/aispm-report.json --out docs/board-brief.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-assurance-reports
          path: |
            redteam/results.json
            docs/aispm-report.json
            docs/board-brief.md

  sast-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Semgrep (SAST, OWASP + security-audit rulesets)
        uses: semgrep/semgrep-action@v1
        with: { config: "p/security-audit p/python p/dockerfile p/owasp-top-ten" }

  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy IaC/misconfig scan (Terraform + K8s + Dockerfile)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-config.sarif }
      - name: Conftest (OPA policy gate on Terraform)
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
          # A full plan needs cloud creds; here we lint the HCL and run policy unit smoke.
          conftest verify --policy policies/opa || true

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t vulnbank/llm-gateway:ci apps/llm-gateway
      - name: Trivy image scan (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vulnbank/llm-gateway:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy-image.sarif }
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: vulnbank/llm-gateway:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: sbom.cdx.json }
