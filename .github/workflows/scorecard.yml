# OpenSSF Scorecard: an outside-in score of our supply-chain hygiene (pinned deps, branch protection,
# token permissions, signed releases...). Weekly (and on demand). Process signal, not a security guarantee:
# read it as a to-do list. Results appear in Security > Code scanning; the badge needs a public repo.
name: scorecard
on:
  schedule: [{ cron: "23 4 * * 1" }]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results (public repos)
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@v2.4.4   # v2.4.1+ pulls the action image from ghcr.io; v2.4.0 pulled gcr.io, whose OpenSSF project is billing-denied (every run died at the image pull)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@v7
        with: { name: scorecard-sarif, path: results.sarif, retention-days: 30 }
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: results.sarif }
