# OpenSSF Scorecard: an outside-in score of our supply-chain hygiene (pinned deps, branch protection,
# token permissions, signed releases...). Weekly (and on demand). Process signal, not a security guarantee:
# read it as a to-do list. Results appear in Security > Code scanning; the badge needs a public repo.
name: scorecard
on:
  schedule: [{ cron: "23 4 * * 1" }]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results (public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4 (v2.4.1+ pulls the action image from ghcr.io; v2.4.0 pulled gcr.io, whose OpenSSF project is billing-denied (every run died at the image pull))
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with: { name: scorecard-sarif, path: results.sarif, retention-days: 30 }
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934  # v4
        with: { sarif_file: results.sarif }
