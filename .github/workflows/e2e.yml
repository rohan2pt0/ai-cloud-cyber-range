# End-to-end sandbox: run the REAL product (real compose stack, real images, real ./securax CLI, a real
# browser) and test it the way a user experiences it. This is the gate that answers "does the thing we
# are about to ship actually WORK?" — unit tests cannot (they never saw the env-wiring bug, the
# fail-closed detector outage, or the startup race). Cloud providers are faked at the network level so
# no keys or spend are needed. See sandbox/README.md.
name: e2e-sandbox
#
# Tiers, so the gate keeps up as changes get smaller and more frequent (doc 68):
#   pull request  -> only the journeys that guard what the PR touches (lifecycle/impact.json); a newer push cancels the old run
#   push to main  -> every journey (catches anything the map narrowed away, within one merge)
#   nightly       -> every journey on main, before the laptops' 3:15 am safe update
on:
  pull_request:
  push: { branches: [main] }
  schedule: [{ cron: "30 20 * * *" }]     # 02:00 IST
  workflow_dispatch:
    inputs:
      journeys:
        description: "Journeys to run, comma-separated (empty = all). A single journey proves a fix in minutes, not 40."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the journey suite takes ~35-40 min; 45 left no headroom (run 154 was cut off mid-journey)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # the stale-update journey needs history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pick the journeys this change needs
        id: pick
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            J="$(python3 lifecycle/impact.py --base "origin/${{ github.base_ref }}" --journeys)"
          elif [ -n "${{ github.event.inputs.journeys }}" ]; then J="${{ github.event.inputs.journeys }}"
          else J=ALL; fi
          echo "journeys=$J" >> "$GITHUB_OUTPUT"
          echo "Journeys: ${J:-none (no journey guards these files; unit tests and fitness still ran)}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.pick.outputs.journeys != ''
        uses: hashicorp/setup-terraform@v3          # the lifecycle_cloud_is_safe journey exercises the engine -> terraform wiring (plans only)
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - name: Install sandbox deps (PyYAML + Playwright/Chromium)
        if: steps.pick.outputs.journeys != ''
        run: |
          pip install pyyaml playwright pytest
          playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends libnss3-tools   # certutil: the phone journey trusts the estate CA as a person does
      # The pulled models (about 1.5 GB) are kept between runs: a slow registry once took 950 s instead of 42 s and pushed the
      # suite past its 60-minute limit. The key follows the image and model pins, so a changed model is pulled fresh.
      - name: Restore the pulled local models
        id: models
        if: steps.pick.outputs.journeys != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/securax-model-cache
          key: ollama-${{ hashFiles('local/compose/docker-compose.yml', 'sandbox/harness.py', 'securax') }}
          restore-keys: ollama-
      - name: Run the user journeys against the real stack
        if: steps.pick.outputs.journeys != ''
        run: |
          export SECURAX_SANDBOX_MODEL_CACHE="$HOME/securax-model-cache"
          J="${{ steps.pick.outputs.journeys }}"
          if [ "$J" = ALL ]; then python3 -u sandbox/run.py; else python3 -u sandbox/run.py -j "$J"; fi   # -u: each journey shows as it finishes
      - name: Save the pulled local models for the next run
        if: always() && steps.pick.outputs.journeys != '' && steps.models.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" ~/securax-model-cache 2>/dev/null || true   # the container wrote them as root
      - if: always() && steps.pick.outputs.journeys != '' && steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/securax-model-cache
          key: ollama-${{ hashFiles('local/compose/docker-compose.yml', 'sandbox/harness.py', 'securax') }}
      - name: Upload screenshots + results (so a failure can be SEEN)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-report
          path: |
            sandbox/out/results.json
            sandbox/out/shots/
          if-no-files-found: ignore
      - name: Dump container logs on failure
        if: failure()
        run: |
          cd /tmp/securax-sandbox/clone/local/compose 2>/dev/null && docker compose --profile ai logs --no-color --tail 80 || true

  # The estate's own alarm (doc 92): when the NIGHTLY run on main goes red, one issue says which journeys failed, with the
  # run's link; a later red night adds a comment to the same issue instead of a new one; a green night closes it.
  nightly-alarm:
    needs: sandbox
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: "Open, update or close the nightly-red issue"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.sandbox.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          T="Nightly sandbox is red"
          N="$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$T\" in:title" --json number -q '.[0].number' || true)"
          if [ "$RESULT" = success ]; then
            [ -z "$N" ] || gh issue close "$N" -R "$GITHUB_REPOSITORY" -c "Green again: $RUN"
            exit 0
          fi
          B="The nightly run of every journey on main ended: $RESULT. Run and screenshots: $RUN (artifact sandbox-report). Find the root cause, add a lesson, fix and prove it with the journey."
          if [ -n "$N" ]; then gh issue comment "$N" -R "$GITHUB_REPOSITORY" -b "Still red: $RUN"
          else gh issue create -R "$GITHUB_REPOSITORY" -t "$T" -b "$B"; fi
