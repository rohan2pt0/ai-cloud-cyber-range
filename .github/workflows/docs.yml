# Product site (website/) with the documentation at /docs/ (MkDocs Material), built by website/build.sh.
# Every PR: strict build, so a broken nav or page fails here, not on the live site.
# main: also publish to GitHub Pages once the owner has (1) Settings → Pages → Source: GitHub Actions and (2) set the
# repository variable SITE_PAGES=true (Settings → Secrets and variables → Actions → Variables; DOCS_PAGES=true also works).
# The domain is a variable, never code: SITE_DOMAIN in brand.env, or the repository variable SITE_DOMAIN, which wins.
# Links use the domain only once SITE_LIVE=yes (./securax site live checks it); until then the GitHub Pages address (doc 99).
# Every build checks that each internal link and image exists; a weekly run also checks the links to other sites.
# A daily run republishes the site so the Life OS's threats in the news (intel/threatwatch.py) are never more than a day old.
# Moving to another domain or host (Cloudflare Pages, Netlify, S3) changes that one value; the build is the same.
name: docs
on:
  pull_request:
    paths: ["docs/**", "website/**", "brand.env", "mkdocs.yml", "CHANGELOG.md", "README.md", "securax", "governance/config.py", "tools/linkcheck.py", "tools/pwa_publish.py", "guiding-map/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "website/**", "brand.env", "mkdocs.yml", "CHANGELOG.md", "README.md", "securax", "governance/config.py", "tools/linkcheck.py", "tools/pwa_publish.py", "guiding-map/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays: links to other sites go stale on their own
    - cron: "43 0 * * *"   # daily: the Life OS's threats in the news (intel/threatwatch.py) stay fresh
permissions:
  contents: read
# A newer push to the same pull request replaces its older run; a deploy from main is never cancelled.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    # pages: write lets the "Enable GitHub Pages" step turn Pages on via the API; the top-level default
    # is contents: read, which is all the rest of this job needs.
    permissions: { contents: read, pages: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the product site and the docs (strict)
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_LIVE: ${{ vars.SITE_LIVE }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          # Live headlines only where the site is published (main, or the daily run); a PR build packs the drills alone.
          THREAT_FETCH: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: |
          [ -n "$SITE_DOMAIN" ] || unset SITE_DOMAIN          # an empty variable means: use brand.env
          [ -n "$SITE_LIVE" ] || unset SITE_LIVE
          [ -n "$CONTACT_EMAIL" ] || unset CONTACT_EMAIL
          bash website/build.sh
      - name: "Links to other sites (weekly report, never blocks)"
        if: github.event.schedule == '17 3 * * 1' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python3 tools/linkcheck.py website --external
      # Enable Pages from the workflow itself, so a deploy never 404s because the Settings -> Pages
      # source was not set (that regressed once: the site built but actions/deploy-pages got a 404
      # "Ensure GitHub Pages has been enabled"). enablement: true is idempotent when it is already on.
      - name: Enable GitHub Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (vars.SITE_PAGES == 'true' || vars.DOCS_PAGES == 'true')
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - name: Keep the built site for publishing
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (vars.SITE_PAGES == 'true' || vars.DOCS_PAGES == 'true')
        uses: actions/upload-pages-artifact@v5
        with: { path: website }
      # Second static host (queue second-static-host): the SAME built website/ folder also goes to Cloudflare Pages, so
      # GitHub Pages is not the only place the site lives. Without both secrets it logs one line and succeeds; a failure
      # here never fails the docs job (continue-on-error). Needs CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
      # and CLOUDFLARE_ACCOUNT_ID.
      - name: Second host (Cloudflare Pages), check the secrets
        id: cf
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "go=yes" >> "$GITHUB_OUTPUT"
          else
            echo "no Cloudflare token: second host skipped"
            echo "go=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Second host (Cloudflare Pages), make the project once
        if: steps.cf.outputs.go == 'yes'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create securax --production-branch main || true
      - name: Second host (Cloudflare Pages), deploy the built site
        if: steps.cf.outputs.go == 'yes'
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name securax --branch main
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && (vars.SITE_PAGES == 'true' || vars.DOCS_PAGES == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
