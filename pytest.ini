[pytest]
# Monorepo: importlib mode + explicit pythonpath avoids the duplicate "app"/"tests"
# package-name clashes between apps/llm-gateway and ai-soc without sys.path hacks.
addopts = --import-mode=importlib
pythonpath = apps/llm-gateway apps/estate-sync ai-soc personal-rnd
testpaths = governance/tests apps ai-soc redteam/tests personal-rnd mcp learning assistant intel agents finance routines design guiding-map/tests local/compose/tests lifecycle/tests knowledge/tests
python_files = test_*.py
