[pytest]
# Monorepo: importlib mode + explicit pythonpath avoids the duplicate "app"/"tests"
# package-name clashes between apps/llm-gateway and ai-soc without sys.path hacks.
addopts = --import-mode=importlib
pythonpath = apps/llm-gateway ai-soc personal-rnd
testpaths = apps ai-soc personal-rnd mcp learning assistant intel
python_files = test_*.py
