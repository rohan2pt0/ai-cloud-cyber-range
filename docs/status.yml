securax/84-CROWN-JEWELS-CONTINUITY-AND-FOUNDATION.md: [amber, "Built and tested: crown jewels ranked from live checks, the continuity plan with measured RPO and timed drills, the nightly code bundle and mirror (GitHub-down drill proven), nightly backups with the CA, the password manager (Vaultwarden 1.37.4, started and answering), cloud sign-in and names in one step, the Life OS Inbox with reviews that become actions and Google Keep import, SEO basics on the site. The identity broker, CRM, marketing, analytics and telephony are decided and dated, not built."]
securax/85-USE-SECURAX-ANYWHERE.md: [amber, "Built and tested here: the one-command Cloudflare setup (against a stand-in Cloudflare, re-runs repair), the sync service checking Access sign-ins (forged, expired, foreign and unsigned tokens refused; through the real nginx and container), the Life OS pairing itself on sign-in, the Command Center installable, the server installer on a fresh Ubuntu 24.04 (packages, Docker repository, user, clone, keys). Not yet run against a real Cloudflare account, a real VPS or a real Google sign-in: the first real setup is the proof."]
securax/86-MANY-NODES-AND-THE-ROAD-TO-SCALE.md: [amber, "Built and tested: the same Life OS data on every node (two real containers: replicated, a stopped node caught up, clashing edits converged), pull-only beta nodes, a second machine serving the same addresses (join tested), stable and beta channels through the safe update (an older release changes nothing; a failing new one rolls back), signed-in people reaching the AI gateway as themselves with no key of their own. Chat history and Chat users' allowances are still per node; open sign-up, payments and the cluster stage are dated."]
securax/87-SECURITY-REVIEW-BEFORE-FREEZE.md: [amber, "Internet-facing images are pinned by digest and checked weekly. Sync tokens are rate-limited per node and repeated refused sign-ins raise an alert. Eight findings fixed and proved (SSH keys-only on the VPS, cross-site writes refused by the gateway, a stored XSS in Inbox ids, security headers, encrypted server backups, the scanner no longer holding the Docker socket, no :latest image, no public router key). Accepted risks are listed with reasons. The deeper audit of logs and image hardening is dated."]
securax/88-RANSOMWARE-AND-DISASTER-RECOVERY-PROVEN.md: [green, "Built and proved on three levels (unit tests, the real CLI, the real containers in CI): encrypted data is caught before it can replace a clean backup, retention keeps weeks and months, restore latest and the drill take the newest clean copy, the restore twin opens it as working data, a drill with nothing to restore fails, and three tabletop exercises check what the machine can prove. Sync history and a write-once off-site bucket are dated."]
securax/89-ACCURATE-ANSWERS-WITHOUT-PROMPT-ENGINEERING.md: [amber, "Careful mode (draft, check each claim, rewrite) is built and tested, and questions about things that change say how to get the live figure. Built and tested: every chat question reaches the model with today's date and the answer rules (proved on the real stack, Gemini and OpenAI shapes alike); exact-format callers and chat housekeeping are untouched; an answer from the small offline model says so; ./securax ai honesty scores eight probes weekly, and the cockpit shows the score and any drop since the last run. Not yet scored against your own models: run ./securax ai honesty once keys are in. A careful self-check mode and automatic web search for changing facts are dated."]
securax/90-WORKS-ON-WHATEVER-IS-ON.md: [green, "Built and proved on the real containers (journey machine_alone): with a model machine, two VPS peers and an off-site folder configured but switched off and no cloud key, up succeeds and says so, the router leaves the model machine out (no 5-minute waits), chat answers here, the Life OS saves and reads, nodes names the unreachable peers, a backup is taken and the home screen serves. The model machine is added back by itself within 5 minutes of answering."]
securax/91-ANY-MACHINE-CAN-CARRY-THE-ESTATE.md: [amber, "Built and tested: every machine shares a capability card through sync (no secrets); ./securax resilience checks every combination of machines being off, names each single point of failure with its fix, and messages you when a new one appears; every feature declares how it survives a machine being off (fitness continuity-declared); reminders go out from one machine at a time; a peer that suddenly misses sync rounds is flagged early. Not yet run on a real multi-machine estate. Encrypted vault copies between machines, shared chat history and a password-server standby are dated."]
securax/92-THE-AUTOPILOT.md: [amber, "The gateway keeps a per-caller baseline and flags a stolen key by how it behaves. Built and tested: hourly, a newly failing routine gets a postmortem draft and an alert, a recurring one is escalated with the fix command, a recovery is announced; nightly, the 2 drills that most need it run and a slower recovery is flagged; hourly, disk, backup headroom, the AI allowance and latency are forecast with a robust trend and warned 7 days ahead; CI opens an issue when the nightly sandbox is red. The forecasts start after 2 days of readings on your machine."]
securax/93-PROGRESS-YOU-CAN-SEE.md: [amber, "Built and tested: the north star is AGENTS.md section 0 for every builder; every feature names its outcome and where it shows (fitness outcomes-declared); ./securax progress shows your Life OS rhythm, what made the estate stronger and the one next step, and the progress routine sends it every Sunday; each Command Center card shows its outcome and where you see it. Not yet seen on your own estate: it fills in as you use the Life OS."]
securax/94-GOVERN.md: [amber, "Built and tested: a tiered catalog across governance, people, process and technology; ./securax govern scores where you stand, the minimum basic and the highest possible, ranks the gaps with their 5W1H and an indicative India budget, sizes the team with roles, skills and certifications, writes the one-page Board report, and fills a template pack (policies, SOPs, registers, vision, executive deck, Board table). The Govern panel in the cockpit shows the capability stack and the organogram as pictures, with no command to run; every box opens a ready-reckoner page (vendors, indicative Indian cost, RFP pack, placement; a job description for each role), from research with sources dated October 2026. Budget bands are indicative and need quotes; the capability marks are yours to fill."]
securax/95-OS-KIT-VANTAGE.md: [amber, "Built and tested: the OS kit (twelve reusable modules) and Vantage, the CISO's operating system, at /vantage/: next step, leadership rituals, the review rhythm, top risks, decisions, exceptions, tools, stakeholders, team, lessons, KPIs and KRIs, playbooks, progress and the Govern feed; offline, own storage names, estate sync, backup and undo. A new app is one JSON file (./securax os new). Core principles come from one shared file and reach every app at its next build; kit news shows on each app's Today. Reminders, Ask and shared registers wait, with dates."]
securax/96-ONE-PLATFORM-MANY-PRODUCTS.md: [amber, "Built and tested: ./securax venture computes break-even, payback and unit economics with your time counted, logs hours, spend and revenue privately, and writes a stress-test prompt. The strategy (one platform, many products, dual use, free to Pro to Concierge, stage gates) is written down; prices are hypotheses to test, and licence keys and payments wait, with dates."]
securax/97-BUILT-FOR-ONE-READY-FOR-MANY.md: [amber, "Built and tested: governance/suite.json declares every component's edition and the shared platform services it uses; ./securax suite shows how ready each edition is to sell and the gaps that unlock the most; suite sheet writes an honest datasheet; fitness enterprise-declared fails an undeclared feature, a built claim without its files, or a broken open core. Community is ready; the paid editions wait on audit, roles, tenancy, licensing, hosting and support, each dated."]
