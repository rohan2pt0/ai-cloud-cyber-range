securax/101-A-SANDBOX-THAT-PROVES-MORE.md: [amber, "Built and tested: ./securax proofs ranks the claims a journey could prove next; any journey runs on demand in CI; every PowerShell script is parsed, linted and (where safe) run on a real Windows machine; chaos experiments on the everyday estate (seeded, always reverted) run nightly, and the watchdog now heals the Command Center and sync too. Mutation testing of the rails runs weekly with a ratchet. Two live nodes and a phone as a second device are built as journeys and wait for their first proof on CI."]
