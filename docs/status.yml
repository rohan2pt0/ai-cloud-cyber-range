securax/103-NOTHING-ASKED-IS-LOST.md: [amber, "Built and tested: ./securax backlog lists every unfinished item from six places (deferred asks, dated promises, open pull requests, branches with no PR, unpushed work, agents' scratch copies); a daily workflow keeps it in one GitHub issue with no session needed; the Command Center shows the count; every agent must write down what it did not finish. The Dependabot backlog is queued for 2026-10-26."]
securax/104-LIFE-PAPERS-READ-FOR-YOU.md: [amber, "Built and tested on fake data: the life workbooks and private documents are read on your machine, each open issue becomes a dated Life OS action with the vital fifth first and calendar alarms, secrets are never copied and numbers are masked. The private RAG hand-off, ticking items in the Life OS, and a weekly re-read are dated."]
securax/105-LLM-REFERENCE-ARCHITECTURES-GAP-CHECK.md: [amber, "Checked against the code: every layer of the end-to-end LLM diagram and eleven frameworks (OWASP LLM and Agentic, NIST AI RMF and 600-1, ATLAS, SAIF, DASF, MAESTRO, ISO 42001, EU AI Act, RBI FREE-AI, MeitY). Two gateway holes found and closed (multi-part prompts, the system context). Fourteen smaller gaps dated in the queue; training layers out of scope by design."]
securax/106-WHO-SECURAX-IS-FOR.md: [amber, "Decided from an audit of the code, sourced market research and the owner's call: SecuRAX is for any organisation that handles other people's data; industry pages are ways in, NBFCs the first. Built and tested: ./securax readiness for any mapped regulation, the homepage's two pillars and the NBFC page. Not yet proven: that any segment will pay; the 30-day plan tests every segment in parallel."]
securax/107-THE-CONGLOMERATE-PLAYBOOK.md: [amber, "Ten mechanisms from Berkshire, Constellation, Danaher, Amazon, Jio, Tata, Microsoft, Alphabet, Haier and Tencent, mapped to SecuRAX. Built: every product is a core line or a bet with a dated stop test, enforced by CI; the operating system, dual use, free core and trust rules. Next: per-product revenue in venture, the estate bundle, a partner programme."]
securax/108-HOW-GIANTS-ROSE-AND-FELL.md: [green, "Built and tested: ./securax venture guards checks runway, burn multiple, product and customer concentration, revenue proof, the independent review, unprovable claims, stop tests and platform shifts every month, from sourced case studies of NVIDIA, Microsoft, Google, Meta, Anthropic, IBM, Tesla, RIM, Nokia, Kodak, Byju's, Unacademy, Dunzo, GoMechanic, Builder.ai, Paytm Payments Bank and others; its first run caught and removed an unprovable claim from the site."]
securax/109-FOUNDERS-WHO-ROSE-AND-FELL.md: [green, "Built and tested: three more monthly guards from founders' successes and failures in India and on every continent: no debt to run the business, no undisclosed related-party payment, a current key-person handover note; plus eight owner habits. Legal status of every person stated exactly."]
securax/110-WHEN-EVERYTHING-GOES-WRONG.md: [green, "Built and tested: four more monthly guards (name cleared and filed, domain paid ahead, liability cover, bundled licences reviewed), a stricter claims list, a licence register every compose image must appear in, a trade mark policy, and an everything-at-once tabletop; from Satyam, Fair & Lovely, Maggi, Vimal, CCI and Reliance ADA cases."]
securax/112-SET-AND-FORGET.md: [green, "Built and tested: ./securax environment gives a catalogue of set-and-forget changes mapped to the Wheel of Life (twelve struggles across health, finances, career, relationships, environment, recovery and personal growth), each reversed into one best change with its one-time device/account steps, an if-then implementation-intention plan and a start-small floor — the elite-sport levers made structural; filter by struggle or by a weak Wheel spoke. Four core principles (best-default, shape-environment, worst-day, aim-at-success) propagate to every app. The one-tap Life OS screen, process-based scoring and the marginal-gains view are queued."]
securax/113-THE-ESTATE-MAP.md: [green, "Built and tested: ./securax map generates an interactive, self-contained HTML picture of the whole estate from features.json and governance/suite.json — 43 components coloured by area around the 16 shared platform services they use, with hover, click-for-detail, filter and search; works offline in light or dark. Tested by tools/tests/test_estate_map.py (every component a node, every 'uses' an edge, no external resource). A Command Center link and resilience/compliance overlays are queued."]
securax/114-GO-LIVE-TODAY.md: [amber, "Every piece this go-live runbook uses is built and tested: ./securax go/up/ready/doctor, the Life OS and its phone sync, the open-model build loop (autobuild then ship watch --fix --merge, doc 83) and 26 self-maintenance routines already running (daily backup, offsite mirror, safe nightly self-update with automatic rollback, the autopilot learn/drill/forecast loop). Not yet proven: a full week run by the owner, and one real change shipped end-to-end on the open models with no Claude. Proving those two flips this green."]
securax/115-ONE-IDEA-A-WEEK.md: [green, "Built and tested: ./securax insight serves one durable idea a week from a bounded, curated, on-device library (decision-making and leadership, security and AI-risk craft, mental models, money and financial independence), aimed by your OKRs first and then your weakest Wheel area, with a per-machine seen ledger so it never repeats until a theme is exhausted (falling back to a weekly rotation when the ledger can't be written). The weekly insight routine sends it on Wednesdays. governance/tests/test_insight.py covers the aiming order, the never-repeat guarantee and the honest fallbacks. A one-tap Life OS surface and letting you add your own ideas are queued."]
securax/117-SELFTEST.md: [green, "Built and a CI gate: ./securax selftest proves every command the CLI advertises is wired (no 'unknown command'), that every Python module behind it loads (a syntax error, bad import or missing file is caught), and that the read-only commands (status/check/--json/list/help) actually run without throwing — all with no side effects (nothing that changes state is executed; a missing service dependency is reported, not failed). test_selftest.py runs it on every change, so a command that stops loading fails the build. Extending the probes to subcommands and a weekly report are queued (selftest-subcommands)."]
securax/118-BUILD-WITH-YOUR-MODELS.md: [green, "An SOP for finishing work on the estate with SecuRAX's own open models (autobuild/opencode on the OpenCode Go and local Ollama ladder) instead of spending Claude: the universal route -> brief -> autobuild -> verify -> ship loop, ready-to-paste commands per task, and the rule to reserve Claude for the strong-tier 20% and its review. The same gates (verify, fitness, selftest, suite check, ui_audit) make it safe to let the open models drive. Grounded in the choose-your-customer and least-effort principles."]
securax/116-CHOOSE-YOUR-CUSTOMER.md: [green, "Built and propagating: choose-your-customer is a core principle in governance/principles.json, so every app from the OS kit and every future product carries it (os check and kit1.js enforce that the core principles reach each app). This playbook is the rubric — the Price Club / Costco lesson read correctly (serve one chosen customer completely; honest self-selection, not a dark pattern; the free safety core stays free), the barbell margin model, the market-sequencing score, the ICP template and the reusable prompt-engineered directive. A fitness/suite guard that makes every product declare its chosen customer and self-selection mechanic is queued (icp-declared)."]
