securax/99-NAMES-NOT-PORTS-AND-LINKS-THAT-NEVER-BREAK.md: [amber, "Built and tested: docs links to repository files go to GitHub and the strict build fails on any broken link or anchor; tools/linkcheck.py checks every page of the built site (0 broken of about 19,800) and, weekly, the links to other sites; the site and README use your domain only after ./securax site live proves it serves the site; ./securax names is asked once with a one-click move of the Life OS data; fitness no-raw-addresses keeps localhost:PORT away from people; the cockpit's Names and site panel diagnoses names, certificate, resolution and the site. DNS-issued certificates for a private sub-domain are dated."]
