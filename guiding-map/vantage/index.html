<script>window.OSK_EDITION = {"id":"vantage","name":"Vantage","short_name":"Vantage","mark":"V","tagline":"The CISO's operating system: see far, decide well, lead calmly","description":"A personal operating system for a CISO or security executive: daily rituals, the review rhythm, top risks, decisions, exceptions, stakeholders, team, KPIs and KRIs, playbooks and visible progress. Offline first.","audience":"A CISO, a deputy, or any executive who owns security risk","north_star":"Risks really reduced, decisions made on time, a team that grows, and a leader who keeps their energy. Not paperwork.","welcome":"Vantage guides your week as a security leader: what needs you today, the reviews that keep the programme honest, and the progress you can show. Everything stays on this device unless you pair it with your estate.","theme":{"bg":"#18181b"},"nav_main":4,"nav_short":{"registers:risks":"Risks","goals":"OKRs","scorecard":"KPIs","registers:decisions":"Decisions","registers:tools":"Tools"},"nav":["today","registers:risks","cadence","goals","inbox","scorecard","registers:decisions","registers:exceptions","registers:tools","registers:stakeholders","registers:team","registers:lessons","wheel","rituals","playbooks","feeds","progress","settings"],"terms":{"today":"Today","inbox":"Inbox","goals":"Security OKRs","rituals":"Leadership rituals","wheel":"Programme wheel","cadence":"Rhythm","playbooks":"Playbooks","scorecard":"KPIs and KRIs","progress":"Progress","resilience":"Resilience index","feeds":"Govern","settings":"Settings"},"principles":[{"id":"ikigai","name":"Ikigai","core":true,"text":"Lead where your strengths meet what the organisation needs; it keeps you going for years, not quarters."},{"id":"antifragility","name":"Antifragility","core":true,"text":"Every incident and near miss leaves a lesson, a change and a drill. The programme gets stronger from stress."},{"id":"amoeba","name":"Start as an amoeba, carry the DNA","core":true,"text":"Ship the simplest living thing that helps today — one person, no server, offline — but carry the full blueprint inside it, and build the dormant seam (the rail) that lets each part grow into its enterprise form. Nature is the architect: a cell becomes an organism only as conditions call for it. So the estate senses its own conditions — favourable (more nodes, more teams, traffic north-south and east-west, spare resources) and unfavourable (load, failure, a lost node) — and grows the next form when they warrant it: the safe, in-box steps by itself, the ones that provision or cost or touch endpoints behind a human's approval. Never build the organism before the amoeba is alive and used; never ship an amoeba with no DNA to become the organism."},{"id":"one-door","name":"One door, no passwords","core":true,"text":"Sign in once, with an account you already have (a passkey, Microsoft or Google), and that is the only door. Everything else a person reaches, a cloud, a mailbox, a drive, a new app, comes through that one sign-in, asks for a permission only at the moment it is needed, takes the smallest one, and is taken away in one place. Everything works as a guest first, with nothing to sign in to for the basics; signing in adds sync, an allowance and services. A feature never builds its own login screen or keeps a password: it declares what it needs in governance/identity.json and the one door does the rest."},{"id":"enterprise-grade","name":"Built for the largest organisations","core":true,"text":"Every component is designed as if for the largest organisations from its first line. Before and after every change, look for what stops if one machine, host, account, key or person is gone; any login or step a person must repeat; anything that looks or works badly in either theme, on a phone, offline or by keyboard; any gap in security and privacy; and anything that cannot be seen, recovered or taken away. Fix the cheap findings now, date the rest in the queue, and say plainly what was not tested."},{"id":"threat-model","name":"Think like the attacker first","core":true,"text":"Before you build anything that crosses a trust boundary, model it as the attacker would: its parts, its data flows and where trust changes, and what could go wrong for each part in all six STRIDE ways (spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege). Each threat is mitigated with proof, accepted with a reason and a review date, or ruled out with a reason. Draw it in any tool you like (the Microsoft Threat Modeling Tool, OWASP Threat Dragon, a whiteboard); the repository keeps it as plain text in governance/threat-models.json, and the checks hold it to account."},{"id":"small-wins","name":"Small wins, shown","core":true,"text":"Progress people can see keeps them, and you, going."},{"id":"least-effort","name":"Least effort for you","core":true,"text":"The app does the remembering, the checking and the reminding; you do the one next step."},{"id":"calm","name":"Calm by default","core":true,"text":"When all is well the screen is quiet. Only what needs you lights up, with why it matters and the one thing to do; everything else waits one tap away."},{"id":"obvious","name":"No manual needed","core":true,"text":"Anyone can use it the first time, on a phone or a laptop, by keyboard or screen reader, in light or dark. If it needs explaining, it is not finished."},{"id":"human-first","name":"Built for a human mind","core":true,"text":"People judge it in seconds by how it looks, and stay for how it feels to use: fast, few steps, nothing to learn, nothing that nags. Invite, never command, because pressure makes people push back; make the right choice the easy default; end every visit on a small win. Never trick anyone."},{"id":"whole-view","name":"See the whole","core":true,"text":"Start from what the person needs, not from what exists. Question every requirement, delete before adding, simplify, then speed up and automate. Weigh look, feel, engineering, safety and cost together, and finish the parts no one sees as carefully as the parts everyone does."},{"id":"in-the-calendar","name":"A system lives in the calendar","core":true,"text":"Every step that repeats goes into your own calendar in one tap, with what to do written inside, so the system runs without you remembering it. Each event keeps its identity for ever: a newer version updates it in place, and a step that ends is ended cleanly, so no change ever clashes with what you already have."},{"id":"global-ready","name":"Built for the world, at home in one place","core":true,"text":"Every word a person reads comes from a catalog, every number, date and currency is formatted for their region, and every layout also works right to left. One tap chooses Local (one country's rules, money and language) or Global (content that assumes no country, in the person's own language); content that is true in one country only is tagged, and never shown in Global. A language stays beta until a native speaker has reviewed it, and nothing private ever goes to a translator."},{"id":"one-open-action","name":"One open action","core":true,"text":"When many things compete, work on one at a time, and let the system choose it by risk: the lowest unfinished layer first, then risk times reach divided by effort. Show that one plainly, with its one button; fold everything else under Later until it is done, and offer the vital few when a list is long. Focus is the method; the next one moves up by itself."},{"id":"build-the-system","name":"Build the system, not the goal","core":true,"text":"Results come from systems, not willpower. For every outcome, build the loop that makes it happen by itself: a cue at the right moment, the smallest step that still counts, a reward you can see, a calendar that remembers for you, and a regular review that improves the loop. Find the one constraint that limits the whole loop and remove it first."},{"id":"best-default","name":"Best choice, pre-made","core":true,"text":"Offer the fewest, best options and pre-select the best one. Never a blank field or a wall of equal choices; the right path is the obvious, already-made choice, one tap away."},{"id":"shape-environment","name":"Shape the environment, not the person","core":true,"text":"Change the setting, not the willpower. Make the good path automatic and the harmful path effortful, with a one-time set-up the environment then enforces — never a rule the person must remember to follow."},{"id":"worst-day","name":"Built for the worst day","core":true,"text":"Assume the person is distracted, overwhelmed, out of willpower and short on skill, and still make success the default. Build for them and it works for everyone."},{"id":"aim-at-success","name":"Aim at success, not only safety","core":true,"text":"Design for the win the person wants, not only the disaster to avoid. Every safeguard also moves them forward; a control that prevents harm but advances nothing is not finished."},{"id":"choose-your-customer","name":"Choose who you serve","core":true,"text":"Design each product for one clearly-named best-fit person and serve them completely, with an honest self-selection mechanic — a fair price, a fit signal — that draws them in and gently turns the wrong fit away; never chase volume that dilutes the fit. Run a barbell: a high margin from a chosen few funds a low-friction, low-cost-to-serve many, markets taken in order of who pays most for the least cost to serve — while the free safety core stays free for everyone and the mechanic is never a dark pattern or a denial of safety."},{"id":"pareto","name":"Pareto","core":false,"text":"A few risks carry most of the exposure. Fix those first, and the basics before anything advanced."},{"id":"inversion","name":"Inversion","core":false,"text":"Ask what could end the organisation, and remove that downside before chasing upside."},{"id":"control-inputs","name":"Control the inputs","core":false,"text":"You cannot control attackers. You control decisions, rhythm and follow-through."},{"id":"compounding","name":"Compounding","core":false,"text":"A weekly review kept for a year beats a perfect plan kept for a month."},{"id":"flywheel","name":"Flywheel","core":false,"text":"Visibility earns trust, trust earns budget, budget builds capability, capability earns more trust."}],"modules":{"today":{},"inbox":{},"feeds":{"items":[{"id":"govern","kind":"govern","url":"../portal/govern-state.json","title":"Where we stand (Govern)","today":true,"top":3}]},"progress":{"lessons":"lessons","lessons_done":["Changed","Drilled"],"risks":"risks","risks_closed":["Closed"],"risk_high":12},"settings":{},"goals":{"max":3,"idle_days":42,"intro":"At most three goals a quarter. Each moves a number from where you are to where you need to be, by a date.","placeholder":"e.g. Prove we can recover from ransomware","starter":[{"o":"Close the riskiest gaps first","area":"Risk and compliance","krs":[{"t":"Critical and high findings past SLA","b":40,"g":0,"u":"findings"},{"t":"Privileged accounts with MFA","b":50,"g":100,"u":"%"}]},{"o":"Prove we can recover from ransomware","area":"Resilience and recovery","krs":[{"t":"Critical systems restored from the offline copy in a drill","b":0,"g":5,"u":"systems"},{"t":"Critical data covered by offline, tested backups","b":60,"g":100,"u":"%"}]},{"o":"Get full value from the tools we already pay for","area":"Technology and architecture","krs":[{"t":"Licensed key features switched on and watched","b":50,"g":95,"u":"%"},{"t":"Yearly spend on unused licences","b":30,"g":0,"u":"Rs lakh"}]},{"o":"Make security visible and trusted at the top","area":"Stakeholders and Board","krs":[{"t":"Board or committee reports with the 40,000-ft table","b":0,"g":2,"u":"reports"},{"t":"Business heads met one-to-one this quarter","b":0,"g":8,"u":"people"}]},{"o":"Build a team that does not depend on one person","area":"People and skills","krs":[{"t":"Key roles filled","b":0,"g":3,"u":"roles"},{"t":"Team members with a growth plan","b":0,"g":100,"u":"%"}]}]},"rituals":{"intro":"Six small habits that carry the job. Each has a trigger and a two-minute floor: on a bad day, the floor counts.","items":[{"id":"brief","name":"Threat and alert brief","anchor":"IF I open the laptop THEN I read the overnight SOC summary before email","min":"Read the one-line summary of the top three alerts.","why":"You hear about trouble from your team first, not from the news."},{"id":"decide","name":"One risk decision","anchor":"IF a risk or exception waits on me THEN I decide, delegate or date it today","min":"Write down who owns it and by when.","why":"Undecided risk is accepted risk that nobody signed for."},{"id":"stake","name":"One stakeholder touch","anchor":"IF I have a gap between meetings THEN I ask one business leader what worries them","min":"Send one message: what worries you this month?","why":"Security that business leaders call early is security that works."},{"id":"team","name":"Unblock one person","anchor":"IF I see my team in the morning THEN I ask one person what is blocking them","min":"One question, then listen.","why":"Your team's speed is your speed."},{"id":"think","name":"Think and learn","anchor":"IF it is after lunch THEN 20 minutes of reading or thinking, phone face down","min":"Read one page or one advisory.","why":"Strategy needs quiet time; the urgent never leaves any."},{"id":"close","name":"Shut down","anchor":"IF I close the laptop THEN I write tomorrow's top three","min":"One line: the one thing that must happen tomorrow.","why":"A clear stop protects your evening and your judgement."}]},"wheel":{"intro":"Score each area honestly once a quarter: 10 is leading practice, 5 is 'it works on a good day', 1 is missing. Put the next goal in the lowest area.","dims":[{"id":"gov","label":"Governance and strategy","short":"Governance","hint":"Policy current, strategy approved, roles clear, the Board engaged.","lever":"Write the strategy on one page and get it approved."},{"id":"risk","label":"Risk and compliance","short":"Risk","hint":"Top risks known, owned and dated; obligations mapped; audit points closing.","lever":"Give every high risk an owner and a treatment date this week."},{"id":"people","label":"People and skills","short":"People","hint":"Enough people, the right skills, a deputy for every key role, including you.","lever":"Size the team with ./securax govern team and fill the basics first."},{"id":"process","label":"Process and operations","short":"Process","hint":"Vulnerability SLAs, change, exceptions and access reviews run without you.","lever":"Start with the vulnerability SLA and the exception register."},{"id":"tech","label":"Technology and architecture","short":"Technology","hint":"The basics deployed and used: EDR, MFA, patching, logging. Tools tuned, not shelfware.","lever":"Run the tool value check: switch on what you already pay for."},{"id":"detect","label":"Detection and response","short":"Detect","hint":"Alerts watched round the clock, playbooks tested, time to respond falling.","lever":"Run one tabletop this quarter and fix what it finds."},{"id":"resil","label":"Resilience and recovery","short":"Recover","hint":"Offline backups restored in a drill; BCP and DR tested; the crisis team rehearsed.","lever":"Restore one critical system from the offline copy, and time it."},{"id":"stake","label":"Stakeholders and Board","short":"Board","hint":"Business leaders call security early; the Board gets a clear, honest picture.","lever":"Meet two business heads this month and ask what worries them."},{"id":"self","label":"You: energy and growth","short":"You","hint":"Sleep, focus, learning, time away. A tired CISO makes slow decisions.","lever":"Protect one morning a week for thinking."}]},"cadence":{"intro":"The reviews that keep a programme honest. Anything due or late rises to Today by itself.","items":[{"id":"w-risk","name":"Monday risk and priority review","every":"week","first":1,"weight":5,"why":"Thirty minutes that stop surprises.","cmd":"./securax cockpit","checklist":["Top risks: did any move? Is any high risk without an owner or a date?","Critical and high findings past SLA: who closes which this week?","Exceptions expiring in the next 30 days","Last week's incidents and near misses: one lesson each","Set the week's three priorities"]},{"id":"w-wins","name":"Friday wins and lessons","every":"week","first":5,"why":"Wins collected weekly make the monthly update write itself.","checklist":["Write the week's three wins","One lesson, and what we change","Thank one person by name","Empty the inbox: decide every item"]},{"id":"f-team","name":"One-to-ones with direct reports","every":"fortnight","first":7,"why":"People stay for a leader who knows what blocks them.","checklist":["Their goals and blockers","One skill to grow: a course, a certification or a range exercise","Recognise something specific"]},{"id":"m-exco","name":"Management security update","every":"month","first":10,"weight":4,"why":"One page a month keeps management with you.","cmd":"./securax govern board --out board.md","checklist":["KPIs and KRIs updated","Top five risks, each with owner and date","What was done and what it bought: risk reduced, money saved","The one ask of management","Send it as one page"]},{"id":"m-tools","name":"Tool value check","every":"month","first":14,"why":"Paid features left switched off are money spent on no protection.","checklist":["For each major tool: is every licensed feature that matters switched on?","Are its alerts watched by someone, and tuned?","What share of assets does it really cover?","Did the vendor meet its SLA and support terms?","Anything paid for and unused goes on the renewal list"]},{"id":"m-vuln","name":"Vulnerability and patch SLA review","every":"month","first":12,"why":"Old criticals on internet-facing systems are how most breaches start.","checklist":["SLA compliance by severity","The oldest open criticals, with owners","Internet-facing assets first","Repeat findings: fix the root cause, not the instance"]},{"id":"m-access","name":"Privileged access sample review","every":"month","first":20,"why":"Admin rights outlive the people who needed them.","checklist":["Sample admin accounts: is each still needed?","Leavers removed within a working day?","Shared or generic accounts: owner named, password vaulted"]},{"id":"q-board","name":"Board or committee report","every":"quarter","first":30,"weight":4,"why":"The Board funds what it understands.","cmd":"./securax govern board --out board.md","checklist":["Fill the 40,000-ft table (Govern template 12)","Maturity and the plan from ./securax govern","Anything outside the risk appetite?","Decisions and support needed from the Board","Record the decisions in the decision log"]},{"id":"q-okr","name":"Quarter reset: goals and wheel","every":"quarter","first":3,"why":"Honest grading beats optimistic plans.","checklist":["Grade last quarter's goals honestly","Re-score the programme wheel","Set at most three goals, starting with the lowest area"]},{"id":"q-drill","name":"Drill or tabletop exercise","every":"quarter","first":45,"why":"A plan never rehearsed fails when it is needed.","cmd":"./securax continuity tabletop","checklist":["Pick a scenario: ransomware, DDoS, insider, vendor breach","Run it with the crisis team (60 to 90 minutes)","Check the reporting clocks with ./securax incident","Log each lesson with an owner and a date"]},{"id":"q-tprm","name":"Third-party risk refresh","every":"quarter","first":40,"why":"Many breaches arrive through a supplier.","checklist":["Re-tier the critical vendors","Chase overdue assessments","Contracts: right to audit, breach notice, data location"]},{"id":"q-budget","name":"Budget against plan","every":"quarter","first":50,"why":"Show savings before you ask for more.","checklist":["Spend against plan","Savings from tools retired or right-sized","Next asks with their 5W1H and cost band (./securax govern)"]},{"id":"h-restore","name":"Restore test of critical backups","every":"half","first":30,"why":"A backup is only real once it has been restored.","cmd":"./securax continuity","checklist":["Restore one critical system from the offline copy","Time it against the recovery time objective","Keep the result as audit evidence"]},{"id":"y-policy","name":"Policy review and approval","every":"year","first":60,"why":"Policies drift from practice and from regulation.","checklist":["Review the information security and cyber policies (Govern templates 01-08)","Check them against current regulations and standards","Approval by the Board or its committee recorded","Users re-acknowledge the acceptable use policy"]},{"id":"y-strategy","name":"Strategy and budget refresh","every":"year","first":75,"why":"Land the plan before the budget cycle closes.","checklist":["Re-run ./securax govern and refresh the one-page strategy (template 10)","Prepare the asks before the budget cycle opens","Agree the scorecard targets for the year"]},{"id":"y-bcp","name":"Full BCP and DR test","every":"year","first":90,"why":"Proves the organisation, not only IT, can keep going.","checklist":["Business-led scenario with real switchover where safe","Measure recovery times against targets","Fix the gaps; update the plan"]},{"id":"y-audit","name":"Certification and regulatory self-assessment","every":"year","first":100,"why":"Evidence gathered all year makes audit week calm.","cmd":"./securax comply","checklist":["Obligations mapped to controls","Evidence current for each control","Last audit's points closed or dated"]},{"id":"y-insure","name":"Cyber insurance review","every":"year","first":120,"why":"Know what is covered before you need it.","checklist":["Cover against the top risks","Exclusions and the insurer's panel for incident response","Controls the insurer requires are really in place"]},{"id":"y-train","name":"Awareness and skills plan","every":"year","first":110,"why":"People are the first line; skills are the second.","checklist":["Awareness topics and phishing simulations for the year","Each team member's certification or course","Range exercises for the response team (./securax exercise)"]}]},"registers":[{"id":"risks","label":"Top risks","item":"risk","title":"risk","intro":"The few risks that could really hurt, scored likelihood times impact (1-25). High risks without a date rise to Today.","score":["likelihood","impact"],"bands":[[15,"high"],[8,"medium"],[0,"low"]],"due":"due","status":{"field":"status","closed":["Closed"]},"list":["owner","treatment","area"],"weight":5,"next_verb":"Treat","fields":[{"id":"risk","label":"The risk, in business words","type":"text","required":true,"placeholder":"e.g. Ransomware stops core systems for three days"},{"id":"area","label":"Area","type":"select","options":["Governance and strategy","Risk and compliance","People and skills","Process and operations","Technology and architecture","Detection and response","Resilience and recovery","Stakeholders and Board"]},{"id":"likelihood","label":"Likelihood","type":"scale","max":5,"default":3,"hint":"1 rare, 3 possible, 5 almost certain this year"},{"id":"impact","label":"Impact","type":"scale","max":5,"default":3,"hint":"1 minor, 3 serious, 5 could end the organisation"},{"id":"owner","label":"Owner (a business role, not security)","type":"text"},{"id":"treatment","label":"Treatment","type":"select","options":["Reduce","Transfer","Avoid","Accept"]},{"id":"due","label":"Treatment due","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Open","In progress","Accepted","Closed"]},{"id":"notes","label":"Notes","type":"long"}],"guide":["Write each risk as cause, event and business effect.","The owner is the business head who loses if it happens.","Accepted risks keep a review date and a named approver.","Keep the list short: the top ten to twenty, not everything."]},{"id":"decisions","label":"Decision log","item":"decision","title":"decision","intro":"Write down every decision that matters: what, why, who decided and when to look again. It protects you and it teaches the team.","due":"review","status":{"field":"status","closed":["Reviewed"]},"list":["decider","date"],"fields":[{"id":"decision","label":"Decision","type":"text","required":true},{"id":"context","label":"Context and options considered","type":"long"},{"id":"decider","label":"Who decides (the D in RAPID)","type":"text"},{"id":"date","label":"Decided on","type":"date","default":"today"},{"id":"review","label":"Look at it again on","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Proposed","Decided","Reviewed"]}]},{"id":"exceptions","label":"Exceptions","item":"exception","title":"what","intro":"Every exception owned, justified, compensated and dated. Each rises to Today 30 days before it expires.","expiry":{"field":"expiry","warn":30},"status":{"field":"status","closed":["Closed"]},"list":["owner","control"],"next_verb":"Renew or close","fields":[{"id":"what","label":"What is excepted","type":"text","required":true},{"id":"reason","label":"Why","type":"long"},{"id":"control","label":"Compensating control","type":"text"},{"id":"owner","label":"Risk owner","type":"text"},{"id":"approver","label":"Approved by","type":"text"},{"id":"expiry","label":"Expires on","type":"date","required":true},{"id":"status","label":"Status","type":"select","required":true,"options":["Active","Renewed","Closed"]}]},{"id":"tools","label":"Tools and value","item":"tool","title":"tool","intro":"What each security tool costs, what it covers and whether its key features are really on. It rises to Today 60 days before renewal.","expiry":{"field":"renewal","warn":60},"status":{"field":"status","closed":["Retired"]},"list":["features","owner"],"next_verb":"Fix, keep or retire before renewal","fields":[{"id":"tool","label":"Tool","type":"text","required":true,"placeholder":"e.g. EDR, SIEM, email security"},{"id":"owner","label":"Owner","type":"text"},{"id":"cost","label":"Cost a year (Rs lakh)","type":"number"},{"id":"coverage","label":"Assets covered (%)","type":"number"},{"id":"features","label":"Key features","type":"select","options":["All key features on","Some switched off","Mostly unused"]},{"id":"watched","label":"Alerts watched and tuned","type":"select","options":["Yes","Partly","No"]},{"id":"renewal","label":"Renewal date","type":"date"},{"id":"status","label":"Decision","type":"select","required":true,"options":["Keep","Fix","Retire","Retired"]}]},{"id":"stakeholders","label":"Stakeholders","item":"stakeholder","title":"who","intro":"The people whose trust the programme needs. Each one rises to Today when the touch is due.","touch":{"last":"last","every":"every","default":30},"list":["cares"],"next_verb":"Touch base with","fields":[{"id":"who","label":"Who (a role is enough)","type":"text","required":true,"placeholder":"e.g. Head of retail business"},{"id":"cares","label":"What they care about","type":"text"},{"id":"health","label":"Relationship","type":"scale","max":5,"default":3,"hint":"1 cold, 5 they call you first"},{"id":"last","label":"Last real conversation","type":"date"},{"id":"every","label":"Touch every (days)","type":"number","default":30}]},{"id":"team","label":"Team","item":"person","title":"who","intro":"Your direct reports and key people: their growth goal and when you last had a real one-to-one.","touch":{"last":"last","every":"every","default":14},"list":["goal","gap"],"next_verb":"One-to-one with","fields":[{"id":"who","label":"Who (initials or role)","type":"text","required":true},{"id":"goal","label":"Growth goal this year","type":"text"},{"id":"gap","label":"Skill to build","type":"text"},{"id":"last","label":"Last one-to-one","type":"date"},{"id":"every","label":"Every (days)","type":"number","default":14}]},{"id":"lessons","label":"Lessons","item":"lesson","title":"what","intro":"Antifragility in practice: every incident, near miss or audit point leaves a lesson, a change and a drill.","due":"due","status":{"field":"status","closed":["Drilled"]},"list":["owner","status"],"next_verb":"Act on the lesson","fields":[{"id":"what","label":"What happened","type":"text","required":true},{"id":"learned","label":"What we learned","type":"long"},{"id":"change","label":"What we change","type":"long"},{"id":"owner","label":"Owner","type":"text"},{"id":"due","label":"Change due","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Open","Changed","Drilled"]}]}],"scorecard":{"intro":"Log a number when you have it; progress counts from your first value. KRIs warn early; KPIs show the programme working.","metrics":[{"id":"crit_sla","kind":"KRI","name":"Critical and high findings past SLA","unit":"findings","base":40,"goal":0,"every":31,"why":"The single best early warning of a breach."},{"id":"exc_expired","kind":"KRI","name":"Exceptions past their expiry","unit":"","base":10,"goal":0,"every":31},{"id":"phish","kind":"KRI","name":"Phishing simulation click rate","unit":"%","base":20,"goal":3,"every":92},{"id":"vend","kind":"KRI","name":"Critical vendors not assessed this year","unit":"","base":10,"goal":0,"every":92},{"id":"patch","kind":"KPI","name":"Critical patches within SLA","unit":"%","base":60,"goal":95,"every":31},{"id":"mfa","kind":"KPI","name":"Privileged accounts with MFA","unit":"%","base":50,"goal":100,"every":31},{"id":"edr","kind":"KPI","name":"Endpoints and servers with EDR","unit":"%","base":70,"goal":99,"every":31},{"id":"logs","kind":"KPI","name":"Critical systems sending logs to the SIEM","unit":"%","base":50,"goal":100,"every":31},{"id":"mttr","kind":"KPI","name":"Mean time to respond to a confirmed incident","unit":"hours","base":48,"goal":4,"every":31},{"id":"restore","kind":"KPI","name":"Critical systems restored in a drill (12 months)","unit":"%","base":0,"goal":100,"every":92},{"id":"aware","kind":"KPI","name":"Staff who completed awareness training","unit":"%","base":60,"goal":95,"every":92},{"id":"toolval","kind":"KPI","name":"Licensed key features switched on and watched","unit":"%","base":50,"goal":95,"every":92}]},"playbooks":{"intro":"Proven sequences for the moments that matter. Tick as you go; a half-done one reminds you after two weeks.","items":[{"id":"first90","title":"The first 90 days (or a fresh start)","when":"New in the role, or resetting a programme.","steps":["Weeks 1-2: meet every business head; ask what worries them and what security has cost them","Read the last audit reports, regulator observations and incident reports","Inventory assets, data, applications, vendors and tools (Govern template asset-inventory.csv)","Name the crown jewels: the few systems and data whose loss would hurt most","Score where you stand with ./securax govern: minimum basic against highest possible","List quick wins: high risk, low effort (MFA on admins, offline backups, internet-facing patching)","Check every paid tool: switched on, watched, covering what it should","Map the team: skills, gaps, single points of failure","Agree the risk appetite with senior management","Write the one-page strategy and 12-month roadmap (Govern template 10)","Present the 40,000-ft table to the Board (Govern template 12)","Set the rhythm: weekly risk review, monthly update, quarterly Board report"]},{"id":"board","title":"Reporting to the Board","when":"Before every Board or committee meeting.","cmd":"./securax govern board --out board.md","template":"templates/govern/12-board-progress-table.md","steps":["One page, no jargon, trends rather than snapshots","Start with the three risks that matter, in business terms","What changed since last time: risks closed, maturity, incidents handled","The value: risk reduced, money saved, audit points closed","Be honest about what is not done yet, with dates","End with the decisions and the support you need","Record the Board's decisions in the decision log"]},{"id":"incident","title":"Leading a major incident: the first hours","when":"A serious incident is suspected or confirmed.","cmd":"./securax incident","steps":["Declare it, open the crisis team and name an incident lead (often not you)","Start the regulator reporting clocks: ./securax incident lists each deadline","Contain first, investigate second: isolate, and preserve evidence","Log every decision with the time and who decided","One voice outside: agree holding statements with communications and legal","Brief management on a fixed rhythm, for example every two to four hours","Decide early on outside help: forensics, the insurer's panel","Afterwards: an after-action review within two weeks; every lesson gets an owner and a drill"]},{"id":"budget","title":"Building the budget and the business case","when":"Before the budget cycle, or for any large ask.","cmd":"./securax govern","steps":["Start from the gaps: ./securax govern ranks them with their 5W1H and a cost band","Basics before advanced: never fund a showpiece while a basic is missing","For each ask: the risk it reduces, in money and in plain words","Count people and running costs, not only licences","Show savings first: tools retired, licences right-sized, overlaps removed","Get three quotes; check data location and support terms","Phase it: 0-3, 3-12 and 12-36 months","Agree the success measures (the scorecard) up front"]},{"id":"tools","title":"Getting value from the tools you already pay for","when":"Monthly, and before every renewal.","steps":["List every security tool with owner, cost and renewal date (Tools register)","For each: which key features are switched off, and why?","Is anyone watching its alerts? Is it tuned against false positives?","What share of assets does it actually cover?","Did the vendor meet its SLA and deliver the training it promised?","Fix, keep or retire before renewal, and record the saving","Raise vendor performance at the quarterly review"]},{"id":"vapt","title":"Making VAPT and application findings close","when":"When findings pile up or keep coming back.","template":"templates/govern/06-vulnerability-management-sop.md","steps":["One register for all findings, with closure SLAs by severity (Govern template 06)","Retest before closing; never close on a vendor's word alone","API security: use the checklist (Govern template 13) at design and before go-live","Fix the root cause of repeat findings with secure build standards","Report ageing and SLA compliance every month","Agree scope and rules of engagement before every test"]},{"id":"exceptions","title":"Exceptions without regret","when":"Whenever someone asks to skip a control.","template":"templates/govern/08-change-and-exception-sop.md","steps":["Every exception has an owner, a reason, a compensating control and an expiry","The risk owner approves it, not security alone","Review 30 days before expiry: renew with a reason, or close","Report the count and the expired ones every month"]},{"id":"audit","title":"Audit and regulator readiness","when":"All year, and a month before any audit.","cmd":"./securax comply","steps":["Map obligations to controls with ./securax comply","Collect evidence as you go, not the week before","Give each point from the last audit an owner and a date","Rehearse the walkthrough of your ten most important controls"]},{"id":"team","title":"Building the team","when":"When the work outgrows the people.","cmd":"./securax govern team","steps":["Size it with ./securax govern team","Hire for the basics first: governance and risk, vulnerability management, SOC oversight","Consultants lead in year one and train; your own team leads in year two","Every person has a growth goal and a skill to build (Team register)","Practise on the cyber range: ./securax exercise","Name a deputy: no single point of failure, including you"]},{"id":"self","title":"Looking after yourself","when":"Always; read it when the job feels heavy.","steps":["Protect one morning a week for thinking","Delegate decisions that do not need you; keep the decision log","Know your crisis handover: who leads when you are away","Ta     var u = K.get("~undo", []), e = u.pop();

          return '<button data-a="setLang" data-x="' + K.esc(k) + '" aria-pressed="' + on + '" lang="' + K.esc(k) + '"' + (on ? ' class="primary"' : "") + ">" + K.esc(L[k].name || k)
            + (L[k].status === "beta" ? " · " + K.esc(K.t("lang.beta", "beta")) : "") + "</button>"; }).join("") + "</div>");
      h += K.card(K.esc(K.t("settings.you", "You")), '<label for="pfName">' + K.esc(K.t("settings.first_name", "First name")) + '</label><input id="pfName" value="' + K.esc(p.name || "") + '"><label for="pfOrg">' + K.esc(K.t("settings.org", "Organisation")) + '</label><input id="pfOrg" value="' + K.esc(p.org || "") + '"><button data-a="profileSave">' + K.esc(K.t("settings.save", "Save")) + '</button>');
      h += K.card(K.esc(K.t("settings.backup", "Backup")), '<p>' + K.esc(K.t("settings.backup_note", "Your data stays on this device. A backup is one file you can keep anywhere.")) + '</p><div class="btns"><button class="primary" data-a="exportNow">' + K.esc(K.t("settings.export", "Export a backup")) + '</button>'
        + '<label class="file">' + K.esc(K.t("settings.import", "Import a backup")) + '<input type="file" id="impFile" accept="application/json" data-c="importFile"></label></div>'
        + (K.get("lastExport", null) ? '<p class="muted">' + K.esc(K.t("settings.last_export", "Last export {d}", { d: K.get("lastExport") })) + "</p>" : ""));
      h += K.card(K.esc(K.t("settings.sync", "Sync")), syncBlock());
      h += K.card(K.esc(K.t("settings.look_undo", "Look and undo")), '<div class="btns"><button data-a="theme">' + K.esc(K.t("settings.theme", "Light or dark")) + '</button><button data-a="undo">' + K.esc(K.t("settings.undo", "Undo the last change")) + '</button></div>');
      return h;
    },
    next: function () {
      if (K.syncCfg()) return null;
      var le = K.get("lastExport", null), st = K.get("started", K.ymd());
      if ((le && K.days(le) > 30) || (!le && K.days(st) > 7 && K.keys().length > 5)) return { score: 28, text: K.t("settings.next_backup", "Export a backup (one tap)"), why: le ? K.t("settings.next_backup_why_recent", "Last backup {d}.", { d: le }) : K.t("settings.next_backup_why_none", "Nothing is synced and there is no backup yet."), go: "settings" };
      return null;
    },
    acts: {
      setLang: function (l) { K.setLang(l); },
      exportNow: function () {
        K.set("lastExport", K.ymd(), { noUndo: true });
        var blob = new Blob([JSON.stringify(K.dump(), null, 1)], { type: "application/json" });
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (K.ed.id || "app") + "-backup-" + K.ymd() + ".json";
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        K.toast(K.t("settings.toast_exported", "Backup saved to your downloads."));
      },
      importFile: function (_x, el) {
        var f = el.files && el.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function () { try { K.load(JSON.parse(r.result)); K.render(); K.toast(K.t("settings.toast_restored", "Backup restored.")); } catch (e) { K.toast(K.t("settings.toast_not_restored", "Not restored: {e}", { e: e.message })); } };
        r.readAsText(f);
      },
      syncSave: function () {
        var u = K.val("syU"), n = K.val("syN"), k = K.val("syK");
        if (!u || !n || !k) { K.toast(K.t("settings.toast_need_all", "All three are needed: address, user name and key.")); return; }
        K.set("~sync", { url: u, user: n, key: k }); K.pull().then(function () { K.render(); }); K.toast(K.t("settings.toast_paired", "Paired. Syncing now."));
      },
      syncForget: function () { K.set("~sync", null); K.render(); },
      syncNow: function () { K.pull().then(function () { K.render(); K.toast(K.get("~syncFails", 0) ? K.t("settings.toast_unreachable", "Could not reach the estate. Your data is safe here.") : K.t("settings.toast_synced", "Synced.")); }); }
    }
  });
})();
OSK.start();
</script>
