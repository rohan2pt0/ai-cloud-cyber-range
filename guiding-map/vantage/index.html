<header class="sx-sky"><div class="mark sx-crest" aria-hidden="true">V</div><h1>Vantage<small>The CISO&#x27;s operating system: see far, decide well, lead calmly</small></h1><span id="oskWho" class="muted"></span><button data-a="theme" aria-label="Switch light or dark">Theme</button></header>
<main id="oskMain"><noscript>This app needs JavaScript switched on.</noscript></main>
<div id="oskMore"></div>
<nav id="oskNav" aria-label="Main"></nav>
<div id="oskToast" role="status" aria-live="polite"></div>
<script>window.OSK_EDITION = {"id":"vantage","name":"Vantage","short_name":"Vantage","mark":"V","tagline":"The CISO's operating system: see far, decide well, lead calmly","description":"A personal operating system for a CISO or security executive: daily rituals, the review rhythm, top risks, decisions, exceptions, stakeholders, team, KPIs and KRIs, playbooks and visible progress. Offline first.","audience":"A CISO, a deputy, or any executive who owns security risk","north_star":"Risks really reduced, decisions made on time, a team that grows, and a leader who keeps their energy. Not paperwork.","welcome":"Vantage guides your week as a security leader: what needs you today, the reviews that keep the programme honest, and the progress you can show. Everything stays on this device unless you pair it with your estate.","theme":{"bg":"#18181b"},"nav_main":4,"nav_short":{"registers:risks":"Risks","goals":"OKRs","scorecard":"KPIs","registers:decisions":"Decisions","registers:tools":"Tools"},"nav":["today","registers:risks","cadence","goals","inbox","scorecard","registers:decisions","registers:exceptions","registers:tools","registers:stakeholders","registers:team","registers:lessons","wheel","rituals","playbooks","feeds","progress","settings"],"terms":{"today":"Today","inbox":"Inbox","goals":"Security OKRs","rituals":"Leadership rituals","wheel":"Programme wheel","cadence":"Rhythm","playbooks":"Playbooks","scorecard":"KPIs and KRIs","progress":"Progress","resilience":"Resilience index","feeds":"Govern","settings":"Settings"},"principles":[{"id":"ikigai","name":"Ikigai","core":true,"text":"Lead where your strengths meet what the organisation needs; it keeps you going for years, not quarters."},{"id":"antifragility","name":"Antifragility","core":true,"text":"Every incident and near miss leaves a lesson, a change and a drill. The programme gets stronger from stress."},{"id":"amoeba","name":"Start as an amoeba, carry the DNA","core":true,"text":"Ship the simplest living thing that helps today — one person, no server, offline — but carry the full blueprint inside it, and build the dormant seam (the rail) that lets each part grow into its enterprise form. Nature is the architect: a cell becomes an organism only as conditions call for it. So the estate senses its own conditions — favourable (more nodes, more teams, traffic north-south and east-west, spare resources) and unfavourable (load, failure, a lost node) — and grows the next form when they warrant it: the safe, in-box steps by itself, the ones that provision or cost or touch endpoints behind a human's approval. Never build the organism before the amoeba is alive and used; never ship an amoeba with no DNA to become the organism."},{"id":"one-door","name":"One door, no passwords","core":true,"text":"Sign in once, with an account you already have (a passkey, Microsoft or Google), and that is the only door. Everything else a person reaches, a cloud, a mailbox, a drive, a new app, comes through that one sign-in, asks for a permission only at the moment it is needed, takes the smallest one, and is taken away in one place. Everything works as a guest first, with nothing to sign in to for the basics; signing in adds sync, an allowance and services. A feature never builds its own login screen or keeps a password: it declares what it needs in governance/identity.json and the one door does the rest."},{"id":"enterprise-grade","name":"Built for the largest organisations","core":true,"text":"Every component is designed as if for the largest organisations from its first line. Before and after every change, look for what stops if one machine, host, account, key or person is gone; any login or step a person must repeat; anything that looks or works badly in either theme, on a phone, offline or by keyboard; any gap in security and privacy; and anything that cannot be seen, recovered or taken away. Fix the cheap findings now, date the rest in the queue, and say plainly what was not tested."},{"id":"threat-model","name":"Think like the attacker first","core":true,"text":"Before you build anything that crosses a trust boundary, model it as the attacker would: its parts, its data flows and where trust changes, and what could go wrong for each part in all six STRIDE ways (spoofing, tampering, repudiation, information disclosure, denial of service, elevation of privilege). Each threat is mitigated with proof, accepted with a reason and a review date, or ruled out with a reason. Draw it in any tool you like (the Microsoft Threat Modeling Tool, OWASP Threat Dragon, a whiteboard); the repository keeps it as plain text in governance/threat-models.json, and the checks hold it to account."},{"id":"small-wins","name":"Small wins, shown","core":true,"text":"Progress people can see keeps them, and you, going."},{"id":"least-effort","name":"Least effort for you","core":true,"text":"The app does the remembering, the checking and the reminding; you do the one next step."},{"id":"calm","name":"Calm by default","core":true,"text":"When all is well the screen is quiet. Only what needs you lights up, with why it matters and the one thing to do; everything else waits one tap away."},{"id":"obvious","name":"No manual needed","core":true,"text":"Anyone can use it the first time, on a phone or a laptop, by keyboard or screen reader, in light or dark. If it needs explaining, it is not finished."},{"id":"human-first","name":"Built for a human mind","core":true,"text":"People judge it in seconds by how it looks, and stay for how it feels to use: fast, few steps, nothing to learn, nothing that nags. Invite, never command, because pressure makes people push back; make the right choice the easy default; end every visit on a small win. Never trick anyone."},{"id":"whole-view","name":"See the whole","core":true,"text":"Start from what the person needs, not from what exists. Question every requirement, delete before adding, simplify, then speed up and automate. Weigh look, feel, engineering, safety and cost together, and finish the parts no one sees as carefully as the parts everyone does."},{"id":"in-the-calendar","name":"A system lives in the calendar","core":true,"text":"Every step that repeats goes into your own calendar in one tap, with what to do written inside, so the system runs without you remembering it. Each event keeps its identity for ever: a newer version updates it in place, and a step that ends is ended cleanly, so no change ever clashes with what you already have."},{"id":"global-ready","name":"Built for the world, at home in one place","core":true,"text":"Every word a person reads comes from a catalog, every number, date and currency is formatted for their region, and every layout also works right to left. One tap chooses Local (one country's rules, money and language) or Global (content that assumes no country, in the person's own language); content that is true in one country only is tagged, and never shown in Global. A language stays beta until a native speaker has reviewed it, and nothing private ever goes to a translator."},{"id":"para","name":"One shelf, one loop","core":true,"text":"Everything a person keeps sits on one of four shelves, the same in every app: Projects (an outcome with an end date), Areas (a standard kept for good), Resources (reference), Archive (done or paused), with the Inbox in front. Every item moves through one loop: capture in one tap, clarify once, organise to a shelf, review on a rhythm in the calendar, act on the one open action, and distil what was learned into a playbook or a lesson. A method appears only where its decision is made; a new screen or method retires or folds an old one."},{"id":"friction-by-consequence","name":"Friction by consequence","core":true,"text":"Place every action by what it costs to get wrong, then by how often it is used. The safe, frequent, healthy choice (save a backup, tick a habit) is one tap, in plain sight, and the default. Rare choices fold under one line. A choice that loses data, money or trust (erase, overwrite, share a readable copy) is deliberately hard: away from the daily path and from the safe buttons, never styled as a primary, it says plainly what will be lost, offers the safe step first, and asks for a typed confirmation, not a single tap. The 80/20: make the right thing effortless and the irreversible thing deliberate."},{"id":"ask-by-frequency","name":"Ask once, show by how often it changes","core":true,"text":"Every fact is asked once, in one place, and every screen reads it from there; a screen never asks again for what the person already gave. Place each field by how often it really changes: fixed facts (name, birth date, family, country) are asked at first set-up, then tucked away under one line that shows them; facts that change (investments, savings, spending, a loan balance) stay one tap away where they are used, show when they were last updated, and are invited back on their own rhythm. Derive what can be derived (an age from a birth date) instead of asking. Every friction a person meets is written down with its fix, and the count of open ones only goes down."},{"id":"one-open-action","name":"One open action","core":true,"text":"When many things compete, work on one at a time, and let the system choose it by risk: the lowest unfinished layer first, then risk times reach divided by effort. Show that one plainly, with its one button; fold everything else under Later until it is done, and offer the vital few when a list is long. Focus is the method; the next one moves up by itself."},{"id":"build-the-system","name":"Build the system, not the goal","core":true,"text":"Results come from systems, not willpower. For every outcome, build the loop that makes it happen by itself: a cue at the right moment, the smallest step that still counts, a reward you can see, a calendar that remembers for you, and a regular review that improves the loop. Find the one constraint that limits the whole loop and remove it first."},{"id":"best-default","name":"Best choice, pre-made","core":true,"text":"Offer the fewest, best options and pre-select the best one. Never a blank field or a wall of equal choices; the right path is the obvious, already-made choice, one tap away."},{"id":"shape-environment","name":"Shape the environment, not the person","core":true,"text":"Change the setting, not the willpower. Make the good path automatic and the harmful path effortful, with a one-time set-up the environment then enforces — never a rule the person must remember to follow."},{"id":"worst-day","name":"Built for the worst day","core":true,"text":"Assume the person is distracted, overwhelmed, out of willpower and short on skill, and still make success the default. Build for them and it works for everyone."},{"id":"aim-at-success","name":"Aim at success, not only safety","core":true,"text":"Design for the win the person wants, not only the disaster to avoid. Every safeguard also moves them forward; a control that prevents harm but advances nothing is not finished."},{"id":"choose-your-customer","name":"Choose who you serve","core":true,"text":"Design each product for one clearly-named best-fit person and serve them completely, with an honest self-selection mechanic — a fair price, a fit signal — that draws them in and gently turns the wrong fit away; never chase volume that dilutes the fit. Run a barbell: a high margin from a chosen few funds a low-friction, low-cost-to-serve many, markets taken in order of who pays most for the least cost to serve — while the free safety core stays free for everyone and the mechanic is never a dark pattern or a denial of safety."},{"id":"reuse-first","name":"Build once, reuse everywhere","core":true,"text":"Every SecuRAX app shares one craft and one set of proven parts. A shared primitive (the look in guiding-map/shared/lux.css, the lock, plain English, one open action, the threat-news engine) is built once and every app uses it, each in its own context; an app never keeps a private copy, so an improvement made once reaches every app."},{"id":"every-device","name":"Stunning on every screen, made for humans","core":true,"text":"How it looks and feels is the most important feature, because the person is human. Every element must look stunning and work well on every device people really hold: Android and iPhone, small and large, iPad upright and sideways, laptops and large monitors. It adapts to each display, not merely shrinks: its size and shape, pixel density, the notch and home bar, orientation, touch or pointer, motion and theme settings. It never breaks its form: no sideways scrolling, no cut-off word, nothing under the notch, a finger-sized target for every control, and the main action always on screen. guiding-map/tests/device_audit.py proves it on real device profiles before a change ships."},{"id":"signature-perfect","name":"Signature features, perfected","core":true,"text":"The distinctive features (the three rings, the night-sky lock, the seal, the lit materials, the keycaps, and each new one) are what people remember and come back for, so each is perfected in every aspect, not just made to work: its meaning is clear at a glance and one tap explains it; its material is true to nature; its motion follows physics and settles; every device, theme and state (empty, partial, complete) is finished; it is accessible; it is light on the device; and a test holds it. They are listed in governance/signatures.json with the bar they must meet."},{"id":"natures-design","name":"Designed with nature","core":true,"text":"People have always revered nature: sunrise and sunset, water and rain, rainbows and the northern lights, fire, emeralds and rare metals, snow, the symmetry of a flower, a peacock's feather, the colours of rare birds, the diversity of living things in one cohesive whole. SecuRAX borrows from them so that using it feels priceless, calm and soothing: palettes taken from nature, geometry from nature (symmetry, the golden ratio, spirals), motion from physics (springs, orbits, damping, light that follows the hand), materials rendered from real optics rather than imitated. Sparingly: one natural element per surface, chosen for its meaning; never kitsch, never noise, never at the cost of reading or speed. With the least friction and the 80/20 rule everywhere: the beauty serves the person's purpose, and it rests when they do."},{"id":"zero-setup","name":"Nothing to install, nothing to configure","core":true,"text":"A person never installs a second app, edits a file, copies a token or types an address to get value; that is our work, not theirs. Every capability arrives through what they already have and already trust: the app itself (web push, the share sheet, files), the one door (one consent tap on an account they already use), or the estate doing it on its own. The order of choice: it just works; one tap to allow; one scan to pair; never a manual. Set-up that needs a terminal, an .env line or a third-party app is a fallback for the owner-engineer only, folded away, and counts as a friction in governance/frictions.json until a zero-setup path replaces it. Secrets are the estate's job, never the person's: a token, key or credential is made by the estate, kept in one place (the estate's secret store) and handed to a device by the pairing scan or the one-door sign-in; a person is never asked to copy, paste or retype one, and the same secret is never entered in two places. Before shipping, count the steps a newcomer takes from nothing to the first win: one is the bar, more needs a dated fix."},{"id":"immersive-real","name":"Immersive and real","core":true,"text":"Make every surface feel like a living world that is true to life, the way the best open-world game studios build theirs: the person’s own data is the world (their home, money, health and people, never a generic example once they have started); actions have visible consequences that ripple across screens (pay off a loan and the buffer, net worth and the year ahead all move); time passes (the day, the season, a bill coming due, a lease ending); and a drill or scenario plays out with real stakes, real timing and an after-action review, like the cyber range and the crisis wargame. Realism means faithful to how the real system works (real rules, real thresholds, real lead times), never invented drama. It serves the person: calm by default, every motion respects reduced motion, nothing addictive, no fake urgency, no dark pattern, and no copying of any game’s names, art or story. Judge a change by one question: does it make the person feel their real life, and the result of their choices, more clearly?"},{"id":"trust-is-the-product","name":"Trust is the product, sovereign by design","core":true,"text":"People want a personal AI that runs their life, but trust, not intelligence, is what they are waiting for. So the system is 80% boring, auditable code and 20% AI: code decides, AI only proposes, and no AI sits in the authorisation path. Every AI output passes a deterministic rejection pipeline (schema, types, policy, idempotency, audit) before it touches the person’s data, and the rejection rate is measured. Oversight is risk-adaptive: reversible, internal, low-stakes actions run on their own with an undo; anything irreversible, external or sensitive asks first; anything ambiguous does nothing and asks with a recommended default. Memory is the product and it is the person’s: local-first, partitioned, readable by an AI only through a scoped, expiring consent token, and fully exportable. Every feature passes the continuity test: it keeps working if our servers vanish, the person can take everything with them, every part can be replaced (no lock-in to one model, cloud or device), and its privacy can be explained in one breath to the person across the table. Models are swappable; the orchestration, consent and evaluation layer is the asset. Build first for the privacy-literate person who will check these promises, and the rest will follow."},{"id":"pareto","name":"Pareto","core":false,"text":"A few risks carry most of the exposure. Fix those first, and the basics before anything advanced."},{"id":"inversion","name":"Inversion","core":false,"text":"Ask what could end the organisation, and remove that downside before chasing upside."},{"id":"control-inputs","name":"Control the inputs","core":false,"text":"You cannot control attackers. You control decisions, rhythm and follow-through."},{"id":"compounding","name":"Compounding","core":false,"text":"A weekly review kept for a year beats a perfect plan kept for a month."},{"id":"flywheel","name":"Flywheel","core":false,"text":"Visibility earns trust, trust earns budget, budget builds capability, capability earns more trust."}],"modules":{"today":{},"inbox":{},"feeds":{"items":[{"id":"govern","kind":"govern","url":"../portal/govern-state.json","title":"Where we stand (Govern)","today":true,"top":3}]},"progress":{"lessons":"lessons","lessons_done":["Changed","Drilled"],"risks":"risks","risks_closed":["Closed"],"risk_high":12},"settings":{},"goals":{"max":3,"idle_days":42,"intro":"At most three goals a quarter. Each moves a number from where you are to where you need to be, by a date.","placeholder":"e.g. Prove we can recover from ransomware","starter":[{"o":"Close the riskiest gaps first","area":"Risk and compliance","krs":[{"t":"Critical and high findings past SLA","b":40,"g":0,"u":"findings"},{"t":"Privileged accounts with MFA","b":50,"g":100,"u":"%"}]},{"o":"Prove we can recover from ransomware","area":"Resilience and recovery","krs":[{"t":"Critical systems restored from the offline copy in a drill","b":0,"g":5,"u":"systems"},{"t":"Critical data covered by offline, tested backups","b":60,"g":100,"u":"%"}]},{"o":"Get full value from the tools we already pay for","area":"Technology and architecture","krs":[{"t":"Licensed key features switched on and watched","b":50,"g":95,"u":"%"},{"t":"Yearly spend on unused licences","b":30,"g":0,"u":"Rs lakh"}]},{"o":"Make security visible and trusted at the top","area":"Stakeholders and Board","krs":[{"t":"Board or committee reports with the 40,000-ft table","b":0,"g":2,"u":"reports"},{"t":"Business heads met one-to-one this quarter","b":0,"g":8,"u":"people"}]},{"o":"Build a team that does not depend on one person","area":"People and skills","krs":[{"t":"Key roles filled","b":0,"g":3,"u":"roles"},{"t":"Team members with a growth plan","b":0,"g":100,"u":"%"}]}]},"rituals":{"intro":"Six small habits that carry the job. Each has a trigger and a two-minute floor: on a bad day, the floor counts.","items":[{"id":"brief","name":"Threat and alert brief","anchor":"IF I open the laptop THEN I read the overnight SOC summary before email","min":"Read the one-line summary of the top three alerts.","why":"You hear about trouble from your team first, not from the news."},{"id":"decide","name":"One risk decision","anchor":"IF a risk or exception waits on me THEN I decide, delegate or date it today","min":"Write down who owns it and by when.","why":"Undecided risk is accepted risk that nobody signed for."},{"id":"stake","name":"One stakeholder touch","anchor":"IF I have a gap between meetings THEN I ask one business leader what worries them","min":"Send one message: what worries you this month?","why":"Security that business leaders call early is security that works."},{"id":"team","name":"Unblock one person","anchor":"IF I see my team in the morning THEN I ask one person what is blocking them","min":"One question, then listen.","why":"Your team's speed is your speed."},{"id":"think","name":"Think and learn","anchor":"IF it is after lunch THEN 20 minutes of reading or thinking, phone face down","min":"Read one page or one advisory.","why":"Strategy needs quiet time; the urgent never leaves any."},{"id":"close","name":"Shut down","anchor":"IF I close the laptop THEN I write tomorrow's top three","min":"One line: the one thing that must happen tomorrow.","why":"A clear stop protects your evening and your judgement."}]},"wheel":{"intro":"Score each area honestly once a quarter: 10 is leading practice, 5 is 'it works on a good day', 1 is missing. Put the next goal in the lowest area.","dims":[{"id":"gov","label":"Governance and strategy","short":"Governance","hint":"Policy current, strategy approved, roles clear, the Board engaged.","lever":"Write the strategy on one page and get it approved."},{"id":"risk","label":"Risk and compliance","short":"Risk","hint":"Top risks known, owned and dated; obligations mapped; audit points closing.","lever":"Give every high risk an owner and a treatment date this week."},{"id":"people","label":"People and skills","short":"People","hint":"Enough people, the right skills, a deputy for every key role, including you.","lever":"Size the team with ./securax govern team and fill the basics first."},{"id":"process","label":"Process and operations","short":"Process","hint":"Vulnerability SLAs, change, exceptions and access reviews run without you.","lever":"Start with the vulnerability SLA and the exception register."},{"id":"tech","label":"Technology and architecture","short":"Technology","hint":"The basics deployed and used: EDR, MFA, patching, logging. Tools tuned, not shelfware.","lever":"Run the tool value check: switch on what you already pay for."},{"id":"detect","label":"Detection and response","short":"Detect","hint":"Alerts watched round the clock, playbooks tested, time to respond falling.","lever":"Run one tabletop this quarter and fix what it finds."},{"id":"resil","label":"Resilience and recovery","short":"Recover","hint":"Offline backups restored in a drill; BCP and DR tested; the crisis team rehearsed.","lever":"Restore one critical system from the offline copy, and time it."},{"id":"stake","label":"Stakeholders and Board","short":"Board","hint":"Business leaders call security early; the Board gets a clear, honest picture.","lever":"Meet two business heads this month and ask what worries them."},{"id":"self","label":"You: energy and growth","short":"You","hint":"Sleep, focus, learning, time away. A tired CISO makes slow decisions.","lever":"Protect one morning a week for thinking."}]},"cadence":{"intro":"The reviews that keep a programme honest. Anything due or late rises to Today by itself.","items":[{"id":"w-risk","name":"Monday risk and priority review","every":"week","first":1,"weight":5,"why":"Thirty minutes that stop surprises.","cmd":"./securax cockpit","checklist":["Top risks: did any move? Is any high risk without an owner or a date?","Critical and high findings past SLA: who closes which this week?","Exceptions expiring in the next 30 days","Last week's incidents and near misses: one lesson each","Set the week's three priorities"]},{"id":"w-wins","name":"Friday wins and lessons","every":"week","first":5,"why":"Wins collected weekly make the monthly update write itself.","checklist":["Write the week's three wins","One lesson, and what we change","Thank one person by name","Empty the inbox: decide every item"]},{"id":"f-team","name":"One-to-ones with direct reports","every":"fortnight","first":7,"why":"People stay for a leader who knows what blocks them.","checklist":["Their goals and blockers","One skill to grow: a course, a certification or a range exercise","Recognise something specific"]},{"id":"m-exco","name":"Management security update","every":"month","first":10,"weight":4,"why":"One page a month keeps management with you.","cmd":"./securax govern board --out board.md","checklist":["KPIs and KRIs updated","Top five risks, each with owner and date","What was done and what it bought: risk reduced, money saved","The one ask of management","Send it as one page"]},{"id":"m-tools","name":"Tool value check","every":"month","first":14,"why":"Paid features left switched off are money spent on no protection.","checklist":["For each major tool: is every licensed feature that matters switched on?","Are its alerts watched by someone, and tuned?","What share of assets does it really cover?","Did the vendor meet its SLA and support terms?","Anything paid for and unused goes on the renewal list"]},{"id":"m-vuln","name":"Vulnerability and patch SLA review","every":"month","first":12,"why":"Old criticals on internet-facing systems are how most breaches start.","checklist":["SLA compliance by severity","The oldest open criticals, with owners","Internet-facing assets first","Repeat findings: fix the root cause, not the instance"]},{"id":"m-access","name":"Privileged access sample review","every":"month","first":20,"why":"Admin rights outlive the people who needed them.","checklist":["Sample admin accounts: is each still needed?","Leavers removed within a working day?","Shared or generic accounts: owner named, password vaulted"]},{"id":"q-board","name":"Board or committee report","every":"quarter","first":30,"weight":4,"why":"The Board funds what it understands.","cmd":"./securax govern board --out board.md","checklist":["Fill the 40,000-ft table (Govern template 12)","Maturity and the plan from ./securax govern","Anything outside the risk appetite?","Decisions and support needed from the Board","Record the decisions in the decision log"]},{"id":"q-okr","name":"Quarter reset: goals and wheel","every":"quarter","first":3,"why":"Honest grading beats optimistic plans.","checklist":["Grade last quarter's goals honestly","Re-score the programme wheel","Set at most three goals, starting with the lowest area"]},{"id":"q-drill","name":"Drill or tabletop exercise","every":"quarter","first":45,"why":"A plan never rehearsed fails when it is needed.","cmd":"./securax continuity tabletop","checklist":["Pick a scenario: ransomware, DDoS, insider, vendor breach","Run it with the crisis team (60 to 90 minutes)","Check the reporting clocks with ./securax incident","Log each lesson with an owner and a date"]},{"id":"q-tprm","name":"Third-party risk refresh","every":"quarter","first":40,"why":"Many breaches arrive through a supplier.","checklist":["Re-tier the critical vendors","Chase overdue assessments","Contracts: right to audit, breach notice, data location"]},{"id":"q-budget","name":"Budget against plan","every":"quarter","first":50,"why":"Show savings before you ask for more.","checklist":["Spend against plan","Savings from tools retired or right-sized","Next asks with their 5W1H and cost band (./securax govern)"]},{"id":"h-restore","name":"Restore test of critical backups","every":"half","first":30,"why":"A backup is only real once it has been restored.","cmd":"./securax continuity","checklist":["Restore one critical system from the offline copy","Time it against the recovery time objective","Keep the result as audit evidence"]},{"id":"y-policy","name":"Policy review and approval","every":"year","first":60,"why":"Policies drift from practice and from regulation.","checklist":["Review the information security and cyber policies (Govern templates 01-08)","Check them against current regulations and standards","Approval by the Board or its committee recorded","Users re-acknowledge the acceptable use policy"]},{"id":"y-strategy","name":"Strategy and budget refresh","every":"year","first":75,"why":"Land the plan before the budget cycle closes.","checklist":["Re-run ./securax govern and refresh the one-page strategy (template 10)","Prepare the asks before the budget cycle opens","Agree the scorecard targets for the year"]},{"id":"y-bcp","name":"Full BCP and DR test","every":"year","first":90,"why":"Proves the organisation, not only IT, can keep going.","checklist":["Business-led scenario with real switchover where safe","Measure recovery times against targets","Fix the gaps; update the plan"]},{"id":"y-audit","name":"Certification and regulatory self-assessment","every":"year","first":100,"why":"Evidence gathered all year makes audit week calm.","cmd":"./securax comply","checklist":["Obligations mapped to controls","Evidence current for each control","Last audit's points closed or dated"]},{"id":"y-insure","name":"Cyber insurance review","every":"year","first":120,"why":"Know what is covered before you need it.","checklist":["Cover against the top risks","Exclusions and the insurer's panel for incident response","Controls the insurer requires are really in place"]},{"id":"y-train","name":"Awareness and skills plan","every":"year","first":110,"why":"People are the first line; skills are the second.","checklist":["Awareness topics and phishing simulations for the year","Each team member's certification or course","Range exercises for the response team (./securax exercise)"]}]},"registers":[{"id":"risks","label":"Top risks","item":"risk","title":"risk","intro":"The few risks that could really hurt, scored likelihood times impact (1-25). High risks without a date rise to Today.","score":["likelihood","impact"],"bands":[[15,"high"],[8,"medium"],[0,"low"]],"due":"due","status":{"field":"status","closed":["Closed"]},"list":["owner","treatment","area"],"weight":5,"next_verb":"Treat","fields":[{"id":"risk","label":"The risk, in business words","type":"text","required":true,"placeholder":"e.g. Ransomware stops core systems for three days"},{"id":"area","label":"Area","type":"select","options":["Governance and strategy","Risk and compliance","People and skills","Process and operations","Technology and architecture","Detection and response","Resilience and recovery","Stakeholders and Board"]},{"id":"likelihood","label":"Likelihood","type":"scale","max":5,"default":3,"hint":"1 rare, 3 possible, 5 almost certain this year"},{"id":"impact","label":"Impact","type":"scale","max":5,"default":3,"hint":"1 minor, 3 serious, 5 could end the organisation"},{"id":"owner","label":"Owner (a business role, not security)","type":"text"},{"id":"treatment","label":"Treatment","type":"select","options":["Reduce","Transfer","Avoid","Accept"]},{"id":"due","label":"Treatment due","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Open","In progress","Accepted","Closed"]},{"id":"notes","label":"Notes","type":"long"}],"guide":["Write each risk as cause, event and business effect.","The owner is the business head who loses if it happens.","Accepted risks keep a review date and a named approver.","Keep the list short: the top ten to twenty, not everything."]},{"id":"decisions","label":"Decision log","item":"decision","title":"decision","intro":"Write down every decision that matters: what, why, who decided and when to look again. It protects you and it teaches the team.","due":"review","status":{"field":"status","closed":["Reviewed"]},"list":["decider","date"],"fields":[{"id":"decision","label":"Decision","type":"text","required":true},{"id":"context","label":"Context and options considered","type":"long"},{"id":"decider","label":"Who decides (the D in RAPID)","type":"text"},{"id":"date","label":"Decided on","type":"date","default":"today"},{"id":"review","label":"Look at it again on","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Proposed","Decided","Reviewed"]}]},{"id":"exceptions","label":"Exceptions","item":"exception","title":"what","intro":"Every exception owned, justified, compensated and dated. Each rises to Today 30 days before it expires.","expiry":{"field":"expiry","warn":30},"status":{"field":"status","closed":["Closed"]},"list":["owner","control"],"next_verb":"Renew or close","fields":[{"id":"what","label":"What is excepted","type":"text","required":true},{"id":"reason","label":"Why","type":"long"},{"id":"control","label":"Compensating control","type":"text"},{"id":"owner","label":"Risk owner","type":"text"},{"id":"approver","label":"Approved by","type":"text"},{"id":"expiry","label":"Expires on","type":"date","required":true},{"id":"status","label":"Status","type":"select","required":true,"options":["Active","Renewed","Closed"]}]},{"id":"tools","label":"Tools and value","item":"tool","title":"tool","intro":"What each security tool costs, what it covers and whether its key features are really on. It rises to Today 60 days before renewal.","expiry":{"field":"renewal","warn":60},"status":{"field":"status","closed":["Retired"]},"list":["features","owner"],"next_verb":"Fix, keep or retire before renewal","fields":[{"id":"tool","label":"Tool","type":"text","required":true,"placeholder":"e.g. EDR, SIEM, email security"},{"id":"owner","label":"Owner","type":"text"},{"id":"cost","label":"Cost a year (Rs lakh)","type":"number"},{"id":"coverage","label":"Assets covered (%)","type":"number"},{"id":"features","label":"Key features","type":"select","options":["All key features on","Some switched off","Mostly unused"]},{"id":"watched","label":"Alerts watched and tuned","type":"select","options":["Yes","Partly","No"]},{"id":"renewal","label":"Renewal date","type":"date"},{"id":"status","label":"Decision","type":"select","required":true,"options":["Keep","Fix","Retire","Retired"]}]},{"id":"stakeholders","label":"Stakeholders","item":"stakeholder","title":"who","intro":"The people whose trust the programme needs. Each one rises to Today when the touch is due.","touch":{"last":"last","every":"every","default":30},"list":["cares"],"next_verb":"Touch base with","fields":[{"id":"who","label":"Who (a role is enough)","type":"text","required":true,"placeholder":"e.g. Head of retail business"},{"id":"cares","label":"What they care about","type":"text"},{"id":"health","label":"Relationship","type":"scale","max":5,"default":3,"hint":"1 cold, 5 they call you first"},{"id":"last","label":"Last real conversation","type":"date"},{"id":"every","label":"Touch every (days)","type":"number","default":30}]},{"id":"team","label":"Team","item":"person","title":"who","intro":"Your direct reports and key people: their growth goal and when you last had a real one-to-one.","touch":{"last":"last","every":"every","default":14},"list":["goal","gap"],"next_verb":"One-to-one with","fields":[{"id":"who","label":"Who (initials or role)","type":"text","required":true},{"id":"goal","label":"Growth goal this year","type":"text"},{"id":"gap","label":"Skill to build","type":"text"},{"id":"last","label":"Last one-to-one","type":"date"},{"id":"every","label":"Every (days)","type":"number","default":14}]},{"id":"lessons","label":"Lessons","item":"lesson","title":"what","intro":"Antifragility in practice: every incident, near miss or audit point leaves a lesson, a change and a drill.","due":"due","status":{"field":"status","closed":["Drilled"]},"list":["owner","status"],"next_verb":"Act on the lesson","fields":[{"id":"what","label":"What happened","type":"text","required":true},{"id":"learned","label":"What we learned","type":"long"},{"id":"change","label":"What we change","type":"long"},{"id":"owner","label":"Owner","type":"text"},{"id":"due","label":"Change due","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Open","Changed","Drilled"]}]}],"scorecard":{"intro":"Log a number when you have it; progress counts from your first value. KRIs warn early; KPIs show the programme working.","metrics":[{"id":"crit_sla","kind":"KRI","name":"Critical and high findings past SLA","unit":"findings","base":40,"goal":0,"every":31,"why":"The single best early warning of a breach."},{"id":"exc_expired","kind":"KRI","name":"Exceptions past their expiry","unit":"","base":10,"goal":0,"every":31},{"id":"phish","kind":"KRI","name":"Phishing simulation click rate","unit":"%","base":20,"goal":3,"every":92},{"id":"vend","kind":"KRI","name":"Critical vendors not assessed this year","unit":"","base":10,"goal":0,"every":92},{"id":"patch","kind":"KPI","name":"Critical patches within SLA","unit":"%","base":60,"goal":95,"every":31},{"id":"mfa","kind":"KPI","name":"Privileged accounts with MFA","unit":"%","base":50,"goal":100,"every":31},{"id":"edr","kind":"KPI","name":"Endpoints and servers with EDR","unit":"%","base":70,"goal":99,"every":31},{"id":"logs","kind":"KPI","name":"Critical systems sending logs to the SIEM","unit":"%","base":50,"goal":100,"every":31},{"id":"mttr","kind":"KPI","name":"Mean time to respond to a confirmed incident","unit":"hours","base":48,"goal":4,"every":31},{"id":"restore","kind":"KPI","name":"Critical systems restored in a drill (12 months)","unit":"%","base":0,"goal":100,"every":92},{"id":"aware","kind":"KPI","name":"Staff who completed awareness training","unit":"%","base":60,"goal":95,"every":92},{"id":"toolval","kind":"KPI","name":"Licensed key features switched on and watched","unit":"%","base":50,"goal":95,"every":92}]},"playbooks":{"intro":"Proven sequences for the moments that matter. Tick as you go; a half-done one reminds you after two weeks.","items":[{"id":"first90","title":"The first 90 days (or a fresh start)","when":"New in the role, or resetting a programme.","steps":["Weeks 1-2: meet every business head; ask what worries them and what security has cost them","Read the last audit reports, regulator observations and incident reports","Inventory assets, data, applications, vendors and tools (Govern template asset-inventory.csv)","Name the crown jewels: the few systems and data whose loss would hurt most","Score where you stand with ./securax govern: minimum basic against highest possible","List quick wins: high risk, low effort (MFA on admins, offline backups, internet-facing patching)","Check every paid tool: switched on, watched, covering what it should","Map the team: skills, gaps, single points of failure","Agree the risk appetite with senior management","Write the one-page strategy and 12-month roadmap (Govern template 10)","Present the 40,000-ft table to the Board (Govern template 12)","Set the rhythm: weekly risk review, monthly update, quarterly Board report"]},{"id":"board","title":"Reporting to the Board","when":"Before every Board or committee meeting.","cmd":"./securax govern board --out board.md","template":"templates/govern/12-board-progress-table.md","steps":["One page, no jargon, trends rather than snapshots","Start with the three risks that matter, in business terms","What changed since last time: risks closed, maturity, incidents handled","The value: risk reduced, money saved, audit points closed","Be honest about what is not done yet, with dates","End with the decisions and the support you need","Record the Board's decisions in the decision log"]},{"id":"incident","title":"Leading a major incident: the first hours","when":"A serious incident is suspected or confirmed.","cmd":"./securax incident","steps":["Declare it, open the crisis team and name an incident lead (often not you)","Start the regulator reporting clocks: ./securax incident lists each deadline","Contain first, investigate second: isolate, and preserve evidence","Log every decision with the time and who decided","One voice outside: agree holding statements with communications and legal","Brief management on a fixed rhythm, for example every two to four hours","Decide early on outside help: forensics, the insurer's panel","Afterwards: an after-action review within two weeks; every lesson gets an owner and a drill"]},{"id":"budget","title":"Building the budget and the business case","when":"Before the budget cycle, or for any large ask.","cmd":"./securax govern","steps":["Start from the gaps: ./securax govern ranks them with their 5W1H and a cost band","Basics before advanced: never fund a showpiece while a basic is missing","For each ask: the risk it reduces, in money and in plain words","Count people and running costs, not only licences","Show savings first: tools retired, licences right-sized, overlaps removed","Get three quotes; check data location and support terms","Phase it: 0-3, 3-12 and 12-36 months","Agree the success measures (the scorecard) up front"]},{"id":"tools","title":"Getting value from the tools you already pay for","when":"Monthly, and before every renewal.","steps":["List every security tool with owner, cost and renewal date (Tools register)","For each: which key features are switched off, and why?","Is anyone watching its alerts? Is it tuned against false positives?","What share of assets does it actually cover?","Did the vendor meet its SLA and deliver the training it promised?","Fix, keep or retire before renewal, and record the saving","Raise vendor performance at the quarterly review"]},{"id":"vapt","title":"Making VAPT and application findings close","when":"When findings pile up or keep coming back.","template":"templates/govern/06-vulnerability-management-sop.md","steps":["One register for all findings, with closure SLAs by severity (Govern template 06)","Retest before closing; never close on a vendor's word alone","API security: use the checklist (Govern template 13) at design and before go-live","Fix the root cause of repeat findings with secure build standards","Report ageing and SLA compliance every month","Agree scope and rules of engagement before every test"]},{"id":"exceptions","title":"Exceptions without regret","when":"Whenever someone asks to skip a control.","template":"templates/govern/08-change-and-exception-sop.md","steps":["Every exception has an owner, a reason, a compensating control and an expiry","The risk owner approves it, not security alone","Review 30 days before expiry: renew with a reason, or close","Report the count and the expired ones every month"]},{"id":"audit","title":"Audit and regulator readiness","when":"All year, and a month before any audit.","cmd":"./securax comply","steps":["Map obligations to controls with ./securax comply","Collect evidence as you go, not the week before","Give each point from the last audit an owner and a date","Rehearse the walkthrough of your ten most important controls"]},{"id":"team","title":"Building the team","when":"When the work outgrows the people.","cmd":"./securax govern team","steps":["Size it with ./securax govern team","Hire for the basics first: governance and risk, vulnerability management, SOC oversight","Consultants lead in year one and train; your own team leads in year two","Every person has a growth goal and a skill to build (Team register)","Practise on the cyber range: ./securax exercise","Name a deputy: no single point of failure, including you"]},{"id":"self","title":"Looking after yourself","when":"Always; read it when the job feels heavy.","steps":["Protect one morning a week for thinking","Delegate decisions that do not need you; keep the decision log","Know your crisis handover: who leads when you are away","Take leave fully: the rhythm keeps running without you","Keep learning: one course or certification a year"]}]}},"whatsnew":[{"date":"2026-11-14","text":"Real materials: gold and platinum are lit like metal and move their reflections as you tilt the phone; the lock's diamond is a true brilliant that sparkles; the seal is blue enamel over an engraved sunray dial; the menu is velvet; keys travel and tick under your finger."},{"date":"2026-11-14","text":"A finer finish: titles in an editorial serif and text in a Paris-house sans; the lock is frosted glass with a gold and platinum bezel and a small diamond; gold catches the light as you tilt the phone; every key springs back with a ripple of light."},{"date":"2026-11-14","text":"The lock screen is a real night sky: twinkling stars, the Milky Way, a distant galaxy, meteors and now and then a comet, behind a polished gold seal. Gold buttons now look like real polished metal."},{"date":"2026-11-14","text":"The More menu now rises on glass: in dark mode a midnight sky with twinkling stars and gold-edged keys that catch the light; in light mode pearl and gold."},{"date":"2026-11-13","text":"A calmer, richer look shared with the Life OS: a night-sky header with a gold crest, a gold main action, and the Programme wheel scored by tapping keys (your choice shows in jade) instead of a list."},{"date":"2026-11-10","text":"Languages: the app follows your device in हिंदी or मराठी (beta), or choose one in Settings. More screens are being translated."},{"date":"2026-11-10","text":"One open action: Today shows the one next step chosen by risk; everything else waits under Later. Rhythm folds reviews that are not due yet, and a long register can show only the vital few (80/20)."},{"date":"2026-11-10","editions":["vantage"],"text":"Your review rhythm can live in your calendar: Rhythm > Add the rhythm to my calendar adds each review as a repeating event, with its checklist inside. A newer file updates those events, it never doubles them."},{"date":"2026-10-21","editions":["vantage"],"text":"Vantage is here: your next step, leadership rituals, the review rhythm, top risks, decisions, exceptions, tools, KPIs and KRIs, playbooks and progress."},{"date":"2026-10-21","text":"Principles now come from the estate's one shared list: when one improves, every app gets it at its next update. See them in Settings."}],"i18n":{"hi":{"_meta":{"name":"हिंदी","locale":"hi-IN","status":"beta","note":"Machine-drafted, waiting for a native speaker's review. Money and legal terms with no common Hindi word keep the English term."},"strings":{"core.nothing_undo":"पूर्ववत करने के लिए कुछ नहीं।","core.undone":"पूर्ववत किया","core.failed":"यह काम नहीं कर पाया: ","core.undo":"पूर्ववत करें","core.more":"और","core.problem":"इस स्क्रीन में दिक्कत आई","core.problem_note":"आपका डेटा सुरक्षित है। कोई दूसरी स्क्रीन खोलें, या आख़िरी बदलाव पूर्ववत करें।","core.no_modules":"इस संस्करण में कोई मॉड्यूल चालू नहीं है।","core.skip":"सामग्री पर जाएँ","core.theme":"थीम","core.theme_label":"हल्का या गहरा बदलें","today.title":"आज","today.next":"आपका अगला कदम","today.do":"अभी करें","today.later":"बाद में ({n})","today.later_note":"जोखिम के हिसाब से चुना गया। पहला काम पूरा करें; अगला अपने आप ऊपर आ जाएगा।","today.clear":"सब ठीक है। कुछ भी देर से नहीं है और कुछ भी आपका इंतज़ार नहीं कर रहा।","inbox.next_prefix":"अगला: ","inbox.by":" · {d} तक","inbox.late":"देर","inbox.note_kept":"नोट, {d} को रखा","inbox.decide":"तय करें","inbox.done":"हो गया","inbox.delete":"हटाएँ","inbox.next_step_label":"अगला ठोस कदम","inbox.next_step_ph    - the light on polished metal follows the device: tilt the phone (or move the pointer on a laptop) and the horizon in
     gold and platinum, and the highlight on the seal, move with it. A damped spring smooths the motion, as a real
     reflection would move, and it settles back to rest when the hand is still.

        var body = (p.when ? '<p class="muted">' + K.esc(K.t("playbooks.when", "When: {n}", { n: p.when })) + "</p>" : "") + K.bar(n ? done / n * 100 : 0);
        if (isOpen) {
          body += "<ol class='list'>" + p.steps.map(function (s, i) {
            var on = (t[p.id] || []).indexOf(i) >= 0;
            return '<li class="row tick' + (on ? " done" : "") + '"><button class="check sx-check" data-a="pbTick" data-x="' + K.esc(p.id + "|" + i) + '" aria-pressed="' + on + '" aria-label="' + K.esc(K.t("playbooks.step", "Step {n}", { n: i + 1 })) + '">' + (on ? "✓" : "") + '</button><div class="grow">' + K.esc(s) + "</div></li>";
          }).join("") + "</ol>";
          if (p.cmd) body += '<p class="muted">' + K.esc(K.t("playbooks.on_estate", "On the estate: ")) + '<code>' + K.esc(p.cmd) + "</code></p>";
          if (p.template) body += '<p class="muted">' + K.esc(K.t("playbooks.template", "Template: ")) + '<code>' + K.esc(p.template) + "</code></p>";
          body += '<div class="btns"><button data-a="pbOpen" data-x="">' + K.esc(K.t("playbooks.close", "Close")) + '</button>' + (done ? '<button class="ghost" data-a="pbReset" data-x="' + K.esc(p.id) + '">' + K.esc(K.t("playbooks.reset", "Reset")) + '</button>' : "") + "</div>";
        } else body += '<button data-a="pbOpen" data-x="' + K.esc(p.id) + '">' + K.esc(done ? K.t("playbooks.continue_n", "Continue ({d}/{n})", { d: done, n: n }) : K.t("playbooks.open", "Open")) + "</button>";
        h += K.card(K.esc(p.title), body);
      });
      return h;
    },
    // a playbook started and left half-done for two weeks deserves a nudge
    next: function () {
      var t = ticks(), at = K.get("pbAt", {}), out = [];
      list().forEach(function (p) { var d = (t[p.id] || []).length; if (d && d < p.steps.length && at[p.id] && K.days(at[p.id]) >= 14) out.push({ score: 22, text: K.t("playbooks.next_continue", "Continue the playbook “{t}” ({d}/{n})", { t: p.title, d: d, n: p.steps.length }), why: K.t("playbooks.next_half_done", "Half-done for {n} days.", { n: K.days(at[p.id]) }), go: "playbooks" }); });

    },
    week: function (from) { var at = K.get("pbAt", {}), n = Object.keys(at).filter(function (k) { return at[k] >= from; }).length; return n ? [{ n: n, what: K.t("playbooks.week", "playbook(s) worked on") }] : []; },
    acts: {
      pbOpen: function (id) { K._pb = id || null; K.render(); },
      pbTick: function (x) {
        var p = String(x).split("|"), t = ticks(), a = t[p[0]] || (t[p[0]] = []), i = +p[1], j = a.indexOf(i);
        if (j >= 0) a.splice(j, 1); else a.push(i);
        var at = K.get("pbAt", {}); at[p[0]] = K.ymd();
        K.set("pb", t, { what: "step" }); K.set("pbAt", at, { noUndo: true }); K.render();
      },
      pbReset: function (id) { var t = ticks(); delete t[id]; K.set("pb", t, { what: "reset playbook" }); K.render(); }
    }
  });
})();
/* Progress: the north star made visible. What got better this week (from every module's own count), the streak of
   weeks with a win, and a resilience index that only rises with real practice: rhythm kept, numbers on target,
   lessons turned into changes, and the riskiest items owned and dated. Every part says where it comes from. */
(function () {
  var K = window.OSK;
  function weekStart() { var d = new Date(), wd = (d.getDay() + 6) % 7; return K.addDays(K.ymd(), -wd); }   // Monday
  K.weekWins = function (from) {
    var out = [];
    Object.keys(K.mods).forEach(function (id) { var m = K.mods[id]; if (m.week && K.cfg(id)) { try { out = out.concat(m.week(from) || []); } catch (e) {} } });
    return out;
  };
  // 0-100, from parts the person can see and change; a part with no data yet is left out, never counted as zero or full.
  K.resilience = function () {
    var parts = [], c = K.cfg("progress") || {};
    if (K.mods.cadence && K.cfg("cadence")) { var t = K.mods.cadence.onTime(); if (t != null) parts.push({ n: K.t("progress.rhythm", "Rhythm kept (90 days)"), v: t }); }
    if (K.mods.scorecard && K.cfg("scorecard")) { var s = K.mods.scorecard.onTarget(); if (s != null) parts.push({ n: K.t("progress.numbers_on_target", "Numbers on target"), v: s }); }
    if (c.lessons && K.mods.registers) {
      var ok = c.lessons_done || ["Changed"], L = K.get("reg." + c.lessons, []), done = L.filter(function (x) { return ok.indexOf(x.status) >= 0; }).length;
      if (L.length) parts.push({ n: K.t("progress.lessons_changed", "Lessons turned into a change"), v: done / L.length });
    }
    if (c.risks && K.mods.registers) {
      var R = (K.get("reg." + c.risks, []) || []).filter(function (x) { return (c.risks_closed || ["Closed"]).indexOf(x.status) < 0; });
      var rc = (K.cfg("registers") || []).filter(function (r) { return r.id === c.risks; })[0] || {};
      var hi = R.filter(function (x) { return K.regScore(rc, x) >= (c.risk_high || 12); });
      if (hi.length) parts.push({ n: K.t("progress.risks_owned", "Top risks owned and dated"), v: hi.filter(function (x) { return x.owner && x.due; }).length / hi.length });
    }
    var score = parts.length ? Math.round(parts.reduce(function (a, p) { return a + p.v; }, 0) / parts.length * 100) : null;
    return { score: score, parts: parts };
  };
  function sum(a) { return a.reduce(function (x, w) { return x + w.n; }, 0); }
  // the counters look forward from a date, so one week's wins are "since its Monday" less "since the next Monday"
  function inWeek(w) { return sum(K.weekWins(w)) - sum(K.weekWins(K.addDays(w, 7))); }
  function streak() {
    var n = 0, w = weekStart();
    if (inWeek(w) <= 0) w = K.addDays(w, -7);   // this week may not have its first win yet
    for (var i = 0; i < 52 && inWeek(w) > 0; i++) { n++; w = K.addDays(w, -7); }
    return n;
  }
  K.module({
    id: "progress", label: function () { return K.term("progress", "Progress"); },
    weekCard: function () {
      var W = K.weekWins(weekStart()), R = K.resilience();
      var h = W.length ? "<ul class='wins'>" + W.map(function (w) { return "<li><b>" + w.n + "</b> " + K.esc(w.what) + "</li>"; }).join("") + "</ul>" : "<p>" + K.esc(K.t("progress.no_wins", "No wins logged this week yet. One ritual or one decision is enough to start.")) + "</p>";
      if (R.score != null) h += '<p class="muted">' + K.esc(K.term("resilience", "Resilience index")) + ": <b>" + R.score + "</b>/100 · " + '<a href="#" data-a="go" data-x="progress">' + K.esc(K.t("progress.why", "why")) + "</a></p>";
      return K.card(K.esc(K.t("progress.this_week", "This week")), h);
    },
    render: function () {
      var R = K.resilience(), s = streak(), h = "<h2>" + K.esc(K.term("progress", "Progress")) + "</h2>";
      if (K.ed.north_star) h += '<p class="north">' + K.esc(K.ed.north_star) + "</p>";
      h += this.weekCard();
      h += K.card(K.esc(K.t("progress.weeks_with_win", "Weeks in a row with a win")), '<p class="big">' + s + "</p>");
      h += K.card(K.esc(K.term("resilience", "Resilience index")), R.score == null ? "<p>" + K.esc(K.t("progress.empty_index", "It appears once there is something to measure: a review done, a number logged, a lesson recorded.")) + "</p>"
        : '<p class="big">' + R.score + "/100</p><ul class='list'>" + R.parts.map(function (p) { return "<li>" + K.esc(p.n) + ": " + Math.round(p.v * 100) + "%" + K.bar(p.v * 100) + "</li>"; }).join("") + "</ul><p class='muted'>" + K.esc(K.t("progress.only_practice", "Only practice moves it. It falls when the rhythm slips, so it cannot be gamed by typing.")) + "</p>");
      h += K.card(K.esc(K.t("progress.last_week", "Last week")), "<p>" + K.esc(K.t("progress.last_week_done", "{n} thing(s) done last week.", { n: inWeek(K.addDays(weekStart(), -7)) })) + "</p>");
      return h;
    }
  });
})();
/* Feeds: read-only numbers the estate already knows, shown where the person looks every day.
   Each feed is a same-address JSON file the estate writes (for example ./securax govern writes portal/govern-state.json).
   No feed file, no card: the app never depends on it, and never calls another site. */
(function () {
  var K = window.OSK;
  var cache = {};
  function feeds() { return (K.cfg("feeds") || {}).items || []; }
  function fetchAll() {
    if (!window.fetch || location.protocol.indexOf("http") !== 0) return;
    feeds().forEach(function (f) {
      if (!/^(\.\.\/|\/)?[a-z0-9_\-\/]+\.json$/i.test(f.url)) return;   // same address only
      fetch(f.url, { cache: "no-cache", credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j) { cache[f.id] = j; K.set("~feed." + f.id, j); K.render(); } })
        .catch(function () {});
    });
  }
  // A view per feed kind; a kind the kit does not know is skipped.
  var VIEWS = {
    govern: function (j, f) {
      var tiers = j.coverage || {}, recs = (j.top || []).slice(0, f.top || 3);
      var h = '<p><b>' + K.esc(K.t("feeds.maturity", "Maturity {n}/5", { n: j.maturity })) + "</b> · " + Object.keys(tiers).map(function (t) { return K.esc(t) + " " + K.esc(tiers[t]) + "%"; }).join(" · ") + "</p>";
      if (j.budget) h += '<p class="muted">' + K.esc(K.t("feeds.close_gaps", "To close the gaps: ")) + K.esc(j.budget) + "</p>";
      if (recs.length) h += "<ol class='list'>" + recs.map(function (r) { return "<li><b>" + K.esc(r.what) + '</b><div class="muted">' + K.esc([r.who, r.when, r.how_much].filter(Boolean).join(" · ")) + "</div></li>"; }).join("") + "</ol>";
      h += '<p class="muted">' + K.esc(K.t("feeds.from", "From ")) + '<code>./securax govern</code>' + (j.at ? ", " + K.esc(j.at) : "") + ".</p>";
      return h;
    }
  };
  function view(f) {
    var j = cache[f.id] || K.get("~feed." + f.id, null), v = VIEWS[f.kind];
    if (!j || !v) return "";
    try { return K.card(K.esc(f.title || f.id), v(j, f)); } catch (e) { return ""; }
  }
  K.module({
    id: "feeds", label: function () { return K.term("feeds", "From the estate"); },
    todayCard: function () { return feeds().filter(function (f) { return f.today; }).map(view).join(""); },
    render: function () {
      var h = feeds().map(view).join("");
      return "<h2>" + K.esc(K.term("feeds", "From the estate")) + "</h2>" + (h || "<p>" + K.esc(K.t("feeds.empty_pre", "Nothing from the estate yet. On the estate machine run")) + " <code>./securax govern</code> " + K.esc(K.t("feeds.empty_post", "once; this screen then fills itself.")) + "</p>");
    }
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fetchAll); else setTimeout(fetchAll, 0);
})();
/* Settings: who it is for, the principles behind it, backup (export and import), sync with your own estate, theme, Undo.
   Backup is a plain JSON file: it always works, with or without the estate. */
(function () {
  var K = window.OSK;
  function syncBlock() {
    var c = K.syncCfg(), own = K.get("~sync", null), f = K.get("~syncFails", 0), last = K.get("~synced", null), note = K.get("~syncNote", null);
    var h = c ? "<p>" + K.esc(K.t("settings.synced", "Synced with your estate")) + (last ? K.esc(K.t("settings.synced_last", ", last at {d}", { d: last })) : "") + (own ? "" : K.esc(K.t("settings.pairing_note", " (using the Life OS pairing on this address)"))) + ".</p>" + (f > 2 ? '<p class="tag late">' + K.esc(K.t("settings.sync_fails", "The last {n} tries failed. Your data is safe here; it will catch up.", { n: f })) + "</p>" : "")
      : "<p>" + K.esc(K.t("settings.not_synced", "Not synced: your data lives on this device only. Export a backup now and then, or pair with your estate below.")) + "</p>";
    if (note) h += '<p class="muted">' + K.esc(note) + "</p>";
    h += '<details><summary>' + K.esc(K.t("settings.pair_self", "Pair this app by itself")) + '</summary><label for="syU">' + K.esc(K.t("settings.sync_address", "Sync address (in a phone app from a store, your estate's full address ending in /sync)")) + '</label><input id="syU" placeholder="/sync" value="' + K.esc((own && own.url) || "") + '">'
      + '<label for="syN">' + K.esc(K.t("settings.username", "Your user name on the estate")) + '</label><input id="syN" value="' + K.esc((own && own.user) || "") + '">'
      + '<label for="syK">' + K.esc(K.t("settings.device_key", "Device key")) + '</label><input id="syK" type="password" autocomplete="off">'
      + '<div class="btns"><button data-a="syncSave">' + K.esc(K.t("settings.pair", "Pair")) + '</button>' + (own ? '<button class="ghost" data-a="syncForget">' + K.esc(K.t("settings.forget", "Forget this pairing")) + '</button>' : "") + "</div></details>";
    return h + (c ? '<button data-a="syncNow">' + K.esc(K.t("settings.sync_now", "Sync now")) + '</button>' : "");
  }
  K.module({
    id: "settings", label: function () { return K.term("settings", "Settings"); },
    render: function () {
      var p = K.get("profile", {}), ed = K.ed, h = "<h2>" + K.esc(K.term("settings", "Settings")) + "</h2>";
      h += K.lockCard();
      h += K.card(K.esc(K.t("settings.about", "About {n}", { n: ed.name })), "<p>" + K.esc(ed.tagline || "") + "</p>" + (ed.audience ? '<p class="muted">' + K.esc(K.t("settings.for", "For: ")) + K.esc(ed.audience) + "</p>" : "")
        + ((ed.principles || []).length ? "<ul class='list'>" + ed.principles.map(function (x) { return "<li><b>" + K.esc(x.name) + "</b>" + (x.core ? ' <span class="tag">' + K.esc(K.t("settings.core", "core")) + '</span>' : "") + ": " + K.esc(x.text) + "</li>"; }).join("") + "</ul>"
          + '<p class="muted">' + K.esc(K.t("settings.principles_note", "Core principles come from the estate's one shared list, so every app carries them and gets their improvements.")) + '</p>' : ""));
      if ((ed.whatsnew || []).length) h += K.card(K.esc(K.t("settings.whats_new", "What's new")), "<ul class='list'>" + ed.whatsnew.slice().reverse().map(function (n) { return "<li>" + K.esc(n.text) + ' <span class="muted">' + K.esc(n.date) + "</span></li>"; }).join("") + "</ul>");
      var L = K.langs();
      h += K.card(K.esc(K.t("settings.language", "Language")), "<p class='muted'>" + K.esc(K.t("settings.language_note", "Your choice is remembered on this device. Anything not translated yet shows in English.")) + "</p><div class='btns'>"
        + Object.keys(L).map(function (k) { var on = k === K.lang;
          return '<button data-a="setLang" data-x="' + K.esc(k) + '" aria-pressed="' + on + '" lang="' + K.esc(k) + '"' + (on ? ' class="primary"' : "") + ">" + K.esc(L[k].name || k)
            + (L[k].status === "beta" ? " · " + K.esc(K.t("lang.beta", "beta")) : "") + "</button>"; }).join("") + "</div>");
      h += K.card(K.esc(K.t("settings.you", "You")), '<label for="pfName">' + K.esc(K.t("settings.first_name", "First name")) + '</label><input id="pfName" value="' + K.esc(p.name || "") + '"><label for="pfOrg">' + K.esc(K.t("settings.org", "Organisation")) + '</label><input id="pfOrg" value="' + K.esc(p.org || "") + '"><button data-a="profileSave">' + K.esc(K.t("settings.save", "Save")) + '</button>');
      h += K.card(K.esc(K.t("settings.backup", "Backup")), '<p>' + K.esc(K.t("settings.backup_note", "Your data stays on this device. A backup is one file you can keep anywhere.")) + '</p><div class="btns"><button class="primary" data-a="exportNow">' + K.esc(K.t("settings.export", "Export a backup")) + '</button>'
        + '<label class="file">' + K.esc(K.t("settings.import", "Import a backup")) + '<input type="file" id="impFile" accept="application/json" data-c="importFile"></label></div>'
        + (K.get("lastExport", null) ? '<p class="muted">' + K.esc(K.t("settings.last_export", "Last export {d}", { d: K.get("lastExport") })) + "</p>" : ""));
      h += K.card(K.esc(K.t("settings.sync", "Sync")), syncBlock());
      h += K.card(K.esc(K.t("settings.look_undo", "Look and undo")), '<div class="btns"><button data-a="theme">' + K.esc(K.t("settings.theme", "Light or dark")) + '</button><button data-a="undo">' + K.esc(K.t("settings.undo", "Undo the last change")) + '</button></div>');
      return h;
    },
    next: function () {
      if (K.syncCfg()) return null;
      var le = K.get("lastExport", null), st = K.get("started", K.ymd());
      if ((le && K.days(le) > 30) || (!le && K.days(st) > 7 && K.keys().length > 5)) return { score: 28, text: K.t("settings.next_backup", "Export a backup (one tap)"), why: le ? K.t("settings.next_backup_why_recent", "Last backup {d}.", { d: le }) : K.t("settings.next_backup_why_none", "Nothing is synced and there is no backup yet."), go: "settings" };
      return null;
    },
    acts: {
      lockOn: function () { K.lockStart(); },
      lockSaved: function () { K._phrase = null; K.render(); },
      lockNowBtn: function () { K.lockNow(); },
      lockOff: function () { K.lockDisable().then(function () { K.toast(K.t("lock.off_done", "The lock is off.")); }).catch(function (e) { K.toast(e.message); }); },
      lockIdleSet: function (x) { K.lockIdle(parseInt(x, 10) || 300); K.render(); },
      setLang: function (l) { K.setLang(l); },
      exportNow: function () {
        K.set("lastExport", K.ymd(), { noUndo: true });
        var blob = new Blob([JSON.stringify(K.dump(), null, 1)], { type: "application/json" });
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (K.ed.id || "app") + "-backup-" + K.ymd() + ".json";
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);

      },
      importFile: function (_x, el) {

        var r = new FileReader();

        r.readAsText(f);

        var u = K.val("syU"), n = K.val("syN"), k = K.val("syK");
        if (!u || !n || !k) { K.toast(K.t("settings.toast_need_all", "All three are needed: address, user name and key.")); return; }
        K.set("~sync", { url: u, user: n, key: k }); K.pull().then(function () { K.render(); }); K.toast(K.t("settings.toast_paired", "Paired. Syncing now."));
      },
      syncForget: function () { K.set("~sync", null); K.render(); },
      syncNow: function () { K.pull().then(function () { K.render(); K.toast(K.get("~syncFails", 0) ? K.t("settings.toast_unreachable", "Could not reach the estate. Your data is safe here.") : K.t("settings.toast_synced", "Synced.")); }); }
    }
  });
})();
OSK.start();
