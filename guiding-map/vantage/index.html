<script>window.OSK_EDITION = {"id":"vantage","name":"Vantage","short_name":"Vantage","mark":"V","tagline":"The CISO's operating system: see far, decide well, lead calmly","description":"A personal operating system for a CISO or security executive: daily rituals, the review rhythm, top risks, decisions, exceptions, stakeholders, team, KPIs and KRIs, playbooks and visible progress. Offline first.","audience":"A CISO, a deputy, or any executive who owns security risk","north_star":"Risks really reduced, decisions made on time, a team that grows, and a leader who keeps their energy. Not paperwork.","welcome":"Vantage guides your week as a security leader: what needs you today, the reviews that keep the programme honest, and the progress you can show. Everything stays on this device unless you pair it with your estate.","theme":{"bg":"#0d1f35"},"nav_main":4,"nav_short":{"registers:risks":"Risks","goals":"OKRs","scorecard":"KPIs","registers:decisions":"Decisions","registers:tools":"Tools"},"nav":["today","registers:risks","cadence","goals","inbox","scorecard","registers:decisions","registers:exceptions","registers:tools","registers:stakeholders","registers:team","registers:lessons","wheel","rituals","playbooks","feeds","progress","settings"],"terms":{"today":"Today","inbox":"Inbox","goals":"Security OKRs","rituals":"Leadership rituals","wheel":"Programme wheel","cadence":"Rhythm","playbooks":"Playbooks","scorecard":"KPIs and KRIs","progress":"Progress","resilience":"Resilience index","feeds":"Govern","settings":"Settings"},"principles":[{"id":"ikigai","name":"Ikigai","core":true,"text":"Lead where your strengths meet what the organisation needs; it keeps you going for years, not quarters."},{"id":"antifragility","name":"Antifragility","core":true,"text":"Every incident and near miss leaves a lesson, a change and a drill. The programme gets stronger from stress."},{"id":"small-wins","name":"Small wins, shown","core":true,"text":"Progress people can see keeps them, and you, going."},{"id":"least-effort","name":"Least effort for you","core":true,"text":"The app does the remembering, the checking and the reminding; you do the one next step."},{"id":"calm","name":"Calm by default","core":true,"text":"When all is well the screen is quiet. Only what needs you lights up, with why it matters and the one thing to do; everything else waits one tap away."},{"id":"obvious","name":"No manual needed","core":true,"text":"Anyone can use it the first time, on a phone or a laptop, by keyboard or screen reader, in light or dark. If it needs explaining, it is not finished."},{"id":"best-default","name":"Best choice, pre-made","core":true,"text":"Offer the fewest, best options and pre-select the best one. Never a blank field or a wall of equal choices; the right path is the obvious, already-made choice, one tap away."},{"id":"shape-environment","name":"Shape the environment, not the person","core":true,"text":"Change the setting, not the willpower. Make the good path automatic and the harmful path effortful, with a one-time set-up the environment then enforces — never a rule the person must remember to follow."},{"id":"worst-day","name":"Built for the worst day","core":true,"text":"Assume the person is distracted, overwhelmed, out of willpower and short on skill, and still make success the default. Build for them and it works for everyone."},{"id":"aim-at-success","name":"Aim at success, not only safety","core":true,"text":"Design for the win the person wants, not only the disaster to avoid. Every safeguard also moves them forward; a control that prevents harm but advances nothing is not finished."},{"id":"pareto","name":"Pareto","core":false,"text":"A few risks carry most of the exposure. Fix those first, and the basics before anything advanced."},{"id":"inversion","name":"Inversion","core":false,"text":"Ask what could end the organisation, and remove that downside before chasing upside."},{"id":"control-inputs","name":"Control the inputs","core":false,"text":"You cannot control attackers. You control decisions, rhythm and follow-through."},{"id":"compounding","name":"Compounding","core":false,"text":"A weekly review kept for a year beats a perfect plan kept for a month."},{"id":"flywheel","name":"Flywheel","core":false,"text":"Visibility earns trust, trust earns budget, budget builds capability, capability earns more trust."}],"modules":{"today":{},"inbox":{},"feeds":{"items":[{"id":"govern","kind":"govern","url":"../portal/govern-state.json","title":"Where we stand (Govern)","today":true,"top":3}]},"progress":{"lessons":"lessons","lessons_done":["Changed","Drilled"],"risks":"risks","risks_closed":["Closed"],"risk_high":12},"settings":{},"goals":{"max":3,"idle_days":42,"intro":"At most three goals a quarter. Each moves a number from where you are to where you need to be, by a date.","placeholder":"e.g. Prove we can recover from ransomware","starter":[{"o":"Close the riskiest gaps first","area":"Risk and compliance","krs":[{"t":"Critical and high findings past SLA","b":40,"g":0,"u":"findings"},{"t":"Privileged accounts with MFA","b":50,"g":100,"u":"%"}]},{"o":"Prove we can recover from ransomware","area":"Resilience and recovery","krs":[{"t":"Critical systems restored from the offline copy in a drill","b":0,"g":5,"u":"systems"},{"t":"Critical data covered by offline, tested backups","b":60,"g":100,"u":"%"}]},{"o":"Get full value from the tools we already pay for","area":"Technology and architecture","krs":[{"t":"Licensed key features switched on and watched","b":50,"g":95,"u":"%"},{"t":"Yearly spend on unused licences","b":30,"g":0,"u":"Rs lakh"}]},{"o":"Make security visible and trusted at the top","area":"Stakeholders and Board","krs":[{"t":"Board or committee reports with the 40,000-ft table","b":0,"g":2,"u":"reports"},{"t":"Business heads met one-to-one this quarter","b":0,"g":8,"u":"people"}]},{"o":"Build a team that does not depend on one person","area":"People and skills","krs":[{"t":"Key roles filled","b":0,"g":3,"u":"roles"},{"t":"Team members with a growth plan","b":0,"g":100,"u":"%"}]}]},"rituals":{"intro":"Six small habits that carry the job. Each has a trigger and a two-minute floor: on a bad day, the floor counts.","items":[{"id":"brief","name":"Threat and alert brief","anchor":"IF I open the laptop THEN I read the overnight SOC summary before email","min":"Read the one-line summary of the top three alerts.","why":"You hear about trouble from your team first, not from the news."},{"id":"decide","name":"One risk decision","anchor":"IF a risk or exception waits on me THEN I decide, delegate or date it today","min":"Write down who owns it and by when.","why":"Undecided risk is accepted risk that nobody signed for."},{"id":"stake","name":"One stakeholder touch","anchor":"IF I have a gap between meetings THEN I ask one business leader what worries them","min":"Send one message: what worries you this month?","why":"Security that business leaders call early is security that works."},{"id":"team","name":"Unblock one person","anchor":"IF I see my team in the morning THEN I ask one person what is blocking them","min":"One question, then listen.","why":"Your team's speed is your speed."},{"id":"think","name":"Think and learn","anchor":"IF it is after lunch THEN 20 minutes of reading or thinking, phone face down","min":"Read one page or one advisory.","why":"Strategy needs quiet time; the urgent never leaves any."},{"id":"close","name":"Shut down","anchor":"IF I close the laptop THEN I write tomorrow's top three","min":"One line: the one thing that must happen tomorrow.","why":"A clear stop protects your evening and your judgement."}]},"wheel":{"intro":"Score each area honestly once a quarter: 10 is leading practice, 5 is 'it works on a good day', 1 is missing. Put the next goal in the lowest area.","dims":[{"id":"gov","label":"Governance and strategy","short":"Governance","hint":"Policy current, strategy approved, roles clear, the Board engaged.","lever":"Write the strategy on one page and get it approved."},{"id":"risk","label":"Risk and compliance","short":"Risk","hint":"Top risks known, owned and dated; obligations mapped; audit points closing.","lever":"Give every high risk an owner and a treatment date this week."},{"id":"people","label":"People and skills","short":"People","hint":"Enough people, the right skills, a deputy for every key role, including you.","lever":"Size the team with ./securax govern team and fill the basics first."},{"id":"process","label":"Process and operations","short":"Process","hint":"Vulnerability SLAs, change, exceptions and access reviews run without you.","lever":"Start with the vulnerability SLA and the exception register."},{"id":"tech","label":"Technology and architecture","short":"Technology","hint":"The basics deployed and used: EDR, MFA, patching, logging. Tools tuned, not shelfware.","lever":"Run the tool value check: switch on what you already pay for."},{"id":"detect","label":"Detection and response","short":"Detect","hint":"Alerts watched round the clock, playbooks tested, time to respond falling.","lever":"Run one tabletop this quarter and fix what it finds."},{"id":"resil","label":"Resilience and recovery","short":"Recover","hint":"Offline backups restored in a drill; BCP and DR tested; the crisis team rehearsed.","lever":"Restore one critical system from the offline copy, and time it."},{"id":"stake","label":"Stakeholders and Board","short":"Board","hint":"Business leaders call security early; the Board gets a clear, honest picture.","lever":"Meet two business heads this month and ask what worries them."},{"id":"self","label":"You: energy and growth","short":"You","hint":"Sleep, focus, learning, time away. A tired CISO makes slow decisions.","lever":"Protect one morning a week for thinking."}]},"cadence":{"intro":"The reviews that keep a programme honest. Anything due or late rises to Today by itself.","items":[{"id":"w-risk","name":"Monday risk and priority review","every":"week","first":1,"weight":5,"why":"Thirty minutes that stop surprises.","cmd":"./securax cockpit","checklist":["Top risks: did any move? Is any high risk without an owner or a date?","Critical and high findings past SLA: who closes which this week?","Exceptions expiring in the next 30 days","Last week's incidents and near misses: one lesson each","Set the week's three priorities"]},{"id":"w-wins","name":"Friday wins and lessons","every":"week","first":5,"why":"Wins collected weekly make the monthly update write itself.","checklist":["Write the week's three wins","One lesson, and what we change","Thank one person by name","Empty the inbox: decide every item"]},{"id":"f-team","name":"One-to-ones with direct reports","every":"fortnight","first":7,"why":"People stay for a leader who knows what blocks them.","checklist":["Their goals and blockers","One skill to grow: a course, a certification or a range exercise","Recognise something specific"]},{"id":"m-exco","name":"Management security update","every":"month","first":10,"weight":4,"why":"One page a month keeps management with you.","cmd":"./securax govern board --out board.md","checklist":["KPIs and KRIs updated","Top five risks, each with owner and date","What was done and what it bought: risk reduced, money saved","The one ask of management","Send it as one page"]},{"id":"m-tools","name":"Tool value check","every":"month","first":14,"why":"Paid features left switched off are money spent on no protection.","checklist":["For each major tool: is every licensed feature that matters switched on?","Are its alerts watched by someone, and tuned?","What share of assets does it really cover?","Did the vendor meet its SLA and support terms?","Anything paid for and unused goes on the renewal list"]},{"id":"m-vuln","name":"Vulnerability and patch SLA review","every":"month","first":12,"why":"Old criticals on internet-facing systems are how most breaches start.","checklist":["SLA compliance by severity","The oldest open criticals, with owners","Internet-facing assets first","Repeat findings: fix the root cause, not the instance"]},{"id":"m-access","name":"Privileged access sample review","every":"month","first":20,"why":"Admin rights outlive the people who needed them.","checklist":["Sample admin accounts: is each still needed?","Leavers removed within a working day?","Shared or generic accounts: owner named, password vaulted"]},{"id":"q-board","name":"Board or committee report","every":"quarter","first":30,"weight":4,"why":"The Board funds what it understands.","cmd":"./securax govern board --out board.md","checklist":["Fill the 40,000-ft table (Govern template 12)","Maturity and the plan from ./securax govern","Anything outside the risk appetite?","Decisions and support needed from the Board","Record the decisions in the decision log"]},{"id":"q-okr","name":"Quarter reset: goals and wheel","every":"quarter","first":3,"why":"Honest grading beats optimistic plans.","checklist":["Grade last quarter's goals honestly","Re-score the programme wheel","Set at most three goals, starting with the lowest area"]},{"id":"q-drill","name":"Drill or tabletop exercise","every":"quarter","first":45,"why":"A plan never rehearsed fails when it is needed.","cmd":"./securax continuity tabletop","checklist":["Pick a scenario: ransomware, DDoS, insider, vendor breach","Run it with the crisis team (60 to 90 minutes)","Check the reporting clocks with ./securax incident","Log each lesson with an owner and a date"]},{"id":"q-tprm","name":"Third-party risk refresh","every":"quarter","first":40,"why":"Many breaches arrive through a supplier.","checklist":["Re-tier the critical vendors","Chase overdue assessments","Contracts: right to audit, breach notice, data location"]},{"id":"q-budget","name":"Budget against plan","every":"quarter","first":50,"why":"Show savings before you ask for more.","checklist":["Spend against plan","Savings from tools retired or right-sized","Next asks with their 5W1H and cost band (./securax govern)"]},{"id":"h-restore","name":"Restore test of critical backups","every":"half","first":30,"why":"A backup is only real once it has been restored.","cmd":"./securax continuity","checklist":["Restore one critical system from the offline copy","Time it against the recovery time objective","Keep the result as audit evidence"]},{"id":"y-policy","name":"Policy review and approval","every":"year","first":60,"why":"Policies drift from practice and from regulation.","checklist":["Review the information security and cyber policies (Govern templates 01-08)","Check them against current regulations and standards","Approval by the Board or its committee recorded","Users re-acknowledge the acceptable use policy"]},{"id":"y-strategy","name":"Strategy and budget refresh","every":"year","first":75,"why":"Land the plan before the budget cycle closes.","checklist":["Re-run ./securax govern and refresh the one-page strategy (template 10)","Prepare the asks before the budget cycle opens","Agree the scorecard targets for the year"]},{"id":"y-bcp","name":"Full BCP and DR test","every":"year","first":90,"why":"Proves the organisation, not only IT, can keep going.","checklist":["Business-led scenario with real switchover where safe","Measure recovery times against targets","Fix the gaps; update the plan"]},{"id":"y-audit","name":"Certification and regulatory self-assessment","every":"year","first":100,"why":"Evidence gathered all year makes audit week calm.","cmd":"./securax comply","checklist":["Obligations mapped to controls","Evidence current for each control","Last audit's points closed or dated"]},{"id":"y-insure","name":"Cyber insurance review","every":"year","first":120,"why":"Know what is covered before you need it.","checklist":["Cover against the top risks","Exclusions and the insurer's panel for incident response","Controls the insurer requires are really in place"]},{"id":"y-train","name":"Awareness and skills plan","every":"year","first":110,"why":"People are the first line; skills are the second.","checklist":["Awareness topics and phishing simulations for the year","Each team member's certification or course","Range exercises for the response team (./securax exercise)"]}]},"registers":[{"id":"risks","label":"Top risks","item":"risk","title":"risk","intro":"The few risks that could really hurt, scored likelihood times impact (1-25). High risks without a date rise to Today.","score":["likelihood","impact"],"bands":[[15,"high"],[8,"medium"],[0,"low"]],"due":"due","status":{"field":"status","closed":["Closed"]},"list":["owner","treatment","area"],"weight":5,"next_verb":"Treat","fields":[{"id":"risk","label":"The risk, in business words","type":"text","required":true,"placeholder":"e.g. Ransomware stops core systems for three days"},{"id":"area","label":"Area","type":"select","options":["Governance and strategy","Risk and compliance","People and skills","Process and operations","Technology and architecture","Detection and response","Resilience and recovery","Stakeholders and Board"]},{"id":"likelihood","label":"Likelihood","type":"scale","max":5,"default":3,"hint":"1 rare, 3 possible, 5 almost certain this year"},{"id":"impact","label":"Impact","type":"scale","max":5,"default":3,"hint":"1 minor, 3 serious, 5 could end the organisation"},{"id":"owner","label":"Owner (a business role, not security)","type":"text"},{"id":"treatment","label":"Treatment","type":"select","options":["Reduce","Transfer","Avoid","Accept"]},{"id":"due","label":"Treatment due","type":"date"},{"id":"status","label":"Status","type":"select","required":true,"options":["Open","In progress","Accepted","Closed"]},{"id":"notes","label":"Notes","type":"long"}],"guide":["Write each risk as cause, event and business effect.","The owner is the business head who loses if it happens.","Accepted risks keep a review date and a named approver.","Keep the list short: the top ten to twenty, not everything."]},{"id":"decisions","label":"Decision log","item":"decision","title":"decision","intro <script>
/* OS kit core: the parts every edition shares.
   An edition (kit/editions/<id>.json) names the app, its words and its content; the modules do the work.
   Storage: every key is "osk:<edition>:<name>" so two apps on one address never touch each other's data.
   Keys starting with "~" stay on this device (undo, sync settings, device id) and never sync. */
(function () {
  "use strict";
  var ED = window.OSK_EDITION || {};
  var PFX = "osk:" + (ED.id || "app") + ":";
  var MEM = {};
  var K = window.OSK = { ed: ED, pfx: PFX, mods: {}, acts: {}, tab: null };

  /* ── storage ─────────────────────────────────────────────────────── */
  function raw(k) { try { return localStorage.getItem(PFX + k); } catch (e) { return MEM[k] === undefined ? null : MEM[k]; } }
  function put(k, s) { try { localStorage.setItem(PFX + k, s); } catch (e) { MEM[k] = s; } }
  K.get = function (k, d) { var s = raw(k); if (s === null) return d; try { return JSON.parse(s); } catch (e) { return d; } };
  // Every write stamps the key's time (the sync merge rule: newer wins) and keeps the old value for Undo.
  K.set = function (k, v, opt) {
    var old = raw(k), s = JSON.stringify(v);
    if (old === s) return;
    put(k, s);
    if (k.charAt(0) === "~") return;
    var m = K.get("~meta", {}); m[k] = Date.now(); put("~meta", JSON.stringify(m));
    if (!(opt && opt.noUndo)) {
      var u = K.get("~undo", []); u.push({ k: k, v: old, t: Date.now(), w: (opt && opt.what) || "" });
      put("~undo", JSON.stringify(u.slice(-30)));
    }
    K.syncSoon();
  };
  K.undo = function () {
    var u = K.get("~undo", []), e = u.pop();
    if (!e) { K.toast("Nothing to undo."); return; }
    put("~undo", JSON.stringify(u));
    if (e.v === null) { try { localStorage.removeItem(PFX + e.k); } catch (x) { delete MEM[e.k]; } } else put(e.k, e.v);
    var m = K.get("~meta", {}); m[e.k] = Date.now(); put("~meta", JSON.stringify(m));
    K.syncSoon(); K.render(); K.toast("Undone" + (e.w ? ": " + e.w : "") + ".");
  };
  K.keys = function () {
    var out = [];
    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(PFX) === 0) out.push(k.slice(PFX.length)); } }
    catch (e) { out = Object.keys(MEM); }
    return out;
  };

  /* ── small helpers ───────────────────────────────────────────────── */
  K.esc = function (s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); };
  K.ymd = function (d) { d = d || new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); };
  K.days = function (a, b) { return Math.round((Date.parse(b || K.ymd()) - Date.parse(a)) / 864e5); };   // whole days from a to b
  K.addDays = function (d, n) { var x = new Date(Date.parse(d) + n * 864e5); return K.ymd(x); };
  K.uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); };
  K.quarter = function (d) { d = d || new Date(); return d.getFullYear() + "-Q" + (Math.floor(d.getMonth() / 3) + 1); };
  // The edition's own word for a thing ("goals" -> "Security OKRs"); the module's default otherwise.
  K.term = function (k, d) { return (ED.terms && ED.terms[k]) || d || k; };
  K.cfg = function (mod) { return (ED.modules && ED.modules[mod]) || null; };
  K.val = function (id) { var e = document.getElementById(id); return e ? String(e.value || "").trim() : ""; };
  K.toast = function (msg) {
    var t = document.getElementById("oskToast"); if (!t) return;
    t.innerHTML = K.esc(msg) + (K.get("~undo", []).length ? ' <button data-a="undo">Undo</button>' : "");
    t.className = "on"; clearTimeout(K._tt); K._tt = setTimeout(function () { t.className = ""; }, 5000);
  };
  K.card = function (title, body, extra) { return '<section class="card' + (extra ? " " + extra : "") + '">' + (title ? "<h3>" + title + "</h3>" : "") + body + "</section>"; };
  K.bar = function (pct) { pct = Math.max(0, Math.min(100, Math.round(pct))); return '<div class="bar" role="img" aria-label="' + pct + ' percent"><i style="width:' + Math.max(pct, 2) + '%"></i></div>'; };

  /* ── modules ─────────────────────────────────────────────────────── */
  // A module: { id, label, icon, render(arg) -> html, next() -> {score, text, go} | null, week() -> [{n, what}] }
  K.module = function (m) { K.mods[m.id] = m; if (m.acts) Object.keys(m.acts).forEach(function (a) { K.acts[a] = m.acts[a]; }); };
  K.on = function (id) { return !!K.cfg(id) && !!K.mods[id]; };
  K.tabs = function () {
    var t = [];
    (ED.nav || []).forEach(function (id) {
      var base = id.split(":")[0], m = K.mods[base];
      if (!m || !K.cfg(base)) return;
      t.push({ id: id, label: m.label(id.split(":")[1]), icon: m.icon || "" });
    });
    return t;
  };
  K.go = function (id) { K.tab = id; try { history.replaceState(null, "", "#" + id); } catch (e) {} K.render(); window.scrollTo(0, 0); };
  K.render = function () {
    var tabs = K.tabs();
    if (!K.tab || !tabs.some(function (t) { return t.id === K.tab; })) K.tab = tabs.length ? tabs[0].id : null;
    var parts = (K.tab || "").split(":"), m = K.mods[parts[0]];
    var main = document.getElementById("oskMain");
    try { main.innerHTML = m ? m.render(parts[1]) : "<p>No modules are switched on in this edition.</p>"; }
    catch (e) { main.innerHTML = K.card("This screen hit a problem", "<p>" + K.esc(e.message) + "</p><p>Your data is safe. Try another screen, or Undo the last change.</p>"); if (window.console) console.error(e); }
    navRender(tabs);
    var h = document.getElementById("oskWho"); if (h) h.textContent = K.get("profile", {}).name || "";
  };
  function navRender(tabs) {
    var nav = document.getElementById("oskNav"), more = document.getElementById("oskMore");
    var n = ED.nav_main || 4, h = "", s = "";
    tabs.forEach(function (t, i) {
      var on = t.id === K.tab ? ' class="on" aria-current="page"' : "";
      var lab = (ED.nav_short && ED.nav_short[t.id]) || t.label;   // the bottom menu has room for a short word
      var b = '<button data-a="go" data-x="' + K.esc(t.id) + '"' + on + (lab !== t.label ? ' aria-label="' + K.esc(t.label) + '"' : "") + '>' + K.esc(lab) + '</button>';
      if (i < n) h += b; else s += b;
    });
    var inMore = tabs.slice(n).some(function (t) { return t.id === K.tab; });
    if (s) h += '<button data-a="more"' + (inMore ? ' class="on"' : "") + ' aria-haspopup="true">More</button>';
    nav.innerHTML = h; more.innerHTML = '<div class="sheet" role="menu">' + s + "</div>";
  }

  /* ── one click handler for the whole app ─────────────────────────── */
  // Buttons carry data-a (action) and data-x (argument), never inline code: an id can never break out into script.
  K.acts.go = function (x) { document.getElementById("oskMore").className = ""; K.go(x); };
  K.acts.more = function () { var m = document.getElementById("oskMore"); m.className = m.className ? "" : "on"; };
  K.acts.undo = function () { K.undo(); };
  K.acts.theme = function () {
    var t = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t); K.set("~theme", t);
  };
  document.addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("[data-a]") : null;
    if (!el) { var mo = document.getElementById("oskMore"); if (mo && ev.target === mo) mo.className = ""; return; }
    var f = K.acts[el.getAttribute("data-a")];
    if (!f) return;
    ev.preventDefault();
    try { f(el.getAttribute("data-x"), el); } catch (e) { K.toast("That did not work: " + e.message); if (window.console) console.error(e); }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target; if (!el.getAttribute) return;
    var f = K.acts[el.getAttribute("data-c")];
    if (f) f(el.getAttribute("data-x"), el);
  });

  /* ── export and import: the backup that always works ─────────────── */
  K.dump = function () {
    var o = { app: ED.id, version: 1, at: new Date().toISOString(), data: {}, meta: K.get("~meta", {}) };
    K.keys().forEach(function (k) { if (k.charAt(0) !== "~") o.data[k] = raw(k); });
    return o;
  };
  K.load = function (o) {
    if (!o || o.app !== ED.id || typeof o.data !== "object") throw new Error("this file is not a backup of " + (ED.name || "this app"));
    Object.keys(o.data).forEach(function (k) { if (k.charAt(0) !== "~" && typeof o.data[k] === "string") put(k, o.data[k]); });
    var m = K.get("~meta", {}), now = Date.now(); Object.keys(o.data).forEach(function (k) { m[k] = now; }); put("~meta", JSON.stringify(m));
    K.set("lastImport", K.ymd(), { noUndo: true });
  };

  /* ── sync: the same estate sync the Life OS uses, own keys only ──── */
  // Uses the Life OS pairing on this address (gm_sync_cfg) or this app's own (~sync). The sync service merges per key on its side,
  // so this app sends only its own keys and never overwrites the Life OS's. Newer wins; a tie goes to the larger value, as on the server.
  function syncCfg() {
    var own = K.get("~sync", null); if (own && own.url && (own.key || own.access)) return own;
    try { var g = JSON.parse(localStorage.getItem("gm_sync_cfg") || "null"); if (g && g.url && (g.key || g.access)) return g; } catch (e) {}
    return null;
  }
  K.syncCfg = syncCfg;
  function hdrs(c) { return c.access ? { "Content-Type": "application/json" } : { "Content-Type": "application/json", "Authorization": "Bearer " + c.key }; }
  function stateURL(c) { return String(c.url).replace(/\/+$/, "") + "/state?user=" + encodeURIComponent(c.user || ""); }
  function cpAfter(a, b) {
    var i = 0, j = 0;
    while (i < a.length && j < b.length) { var x = a.codePointAt(i), y = b.codePointAt(j); if (x !== y) return x > y; i += x > 0xFFFF ? 2 : 1; j += y > 0xFFFF ? 2 : 1; }
    return a.length - i > b.length - j;
  }
  K.merge = function (payload, rmeta) {
    var m = K.get("~meta", {}), changed = 0, mine = K.keys().filter(function (k) { return k.charAt(0) !== "~"; }).length, theirs = 0;
    Object.keys(payload).forEach(function (fk) { if (fk.indexOf(PFX) === 0 && fk.charAt(PFX.length) !== "~") theirs++; });
    // A remote copy with far fewer of our keys than we hold is a wrong or damaged row, not a real state: refuse it.
    if (mine > 10 && theirs < mine / 2) { K.set("~syncNote", K.ymd() + ": the estate copy had " + theirs + " items against " + mine + " here; not merged."); return -1; }

        a.splice(i, 1); K._regEdit = null; save(r, a, "delete"); K.render(); K.toast("Deleted.");
      }
    }
  });
})();
/* Scorecard: the few numbers that show whether things are getting better (KPIs) or riskier (KRIs).
   Each has a start, a target and a direction; one tap logs today's value and the trend shows itself.
   A number not updated within its cadence is raised on Today: a stale scorecard is worse than none. */
(function () {
  var K = window.OSK;
  function metrics() { return (K.cfg("scorecard") || {}).metrics || []; }
  function hist() { return K.get("score", {}); }
  function last(id) { var h = hist()[id] || []; return h[h.length - 1] || null; }
  // Progress counts from YOUR first logged value (your real start), not the edition's example start.
  function base(m) { var h = hist()[m.id]; return h && h.length ? h[0].v : m.base; }
  K.metricPct = function (m, v) {
    if (v == null) return 0;
    var b = base(m), r = m.goal - b;
    if (!r) return v === m.goal ? 100 : 0;
    return Math.max(0, Math.min(100, Math.round((v - b) / r * 100)));
  };
  function rag(p) { return p >= 70 ? "on" : p >= 40 ? "medium" : "high"; }
  function spark(id) {
    var h = (hist()[id] || []).slice(-12); if (h.length < 2) return "";
    var vs = h.map(function (e) { return e.v; }), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs), span = hi - lo || 1;
    var pts = h.map(function (e, i) { return (i * 100 / (h.length - 1)).toFixed(1) + "," + (28 - (e.v - lo) / span * 24).toFixed(1); }).join(" ");
    return '<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '"/></svg>';
  }
  K.module({
    id: "scorecard", label: function () { return K.term("scorecard", "Scorecard"); },
    render: function () {
      var c = K.cfg("scorecard") || {}, h = "<h2>" + K.esc(K.term("scorecard", "Scorecard")) + "</h2>" + (c.intro ? '<p class="muted">' + K.esc(c.intro) + "</p>" : "");
      var groups = {}; metrics().forEach(function (m) { (groups[m.kind || "KPI"] = groups[m.kind || "KPI"] || []).push(m); });
      Object.keys(groups).forEach(function (g) {
        h += K.card(K.esc(g === "KRI" ? "Risk indicators (KRI)" : g === "KPI" ? "Performance indicators (KPI)" : g), "<ul class='list'>" + groups[g].map(function (m) {
          var l = last(m.id), p = l ? K.metricPct(m, l.v) : 0, stale = !l || K.days(l.d) > (m.every || 31);
          return '<li class="row"><div class="grow"><b>' + K.esc(m.name) + "</b>" + (l ? ' <span class="tag ' + rag(p) + '">' + K.esc(l.v) + (m.unit ? " " + K.esc(m.unit) : "") + "</span>" : "")
            + (stale ? ' <span class="tag due">' + (l ? "update" : "no value yet") + "</span>" : "")
            + '<div class="muted">from ' + base(m) + " to " + m.goal + (m.unit ? " " + K.esc(m.unit) : "") + (l ? " · " + p + "% of the way · " + K.esc(l.d) : "") + "</div>" + (m.why ? '<div class="muted">' + K.esc(m.why) + "</div>" : "") + spark(m.id) + "</div>"
            + '<label class="sr" for="sc_' + K.esc(m.id) + '">' + K.esc(m.name) + ' today</label><input class="num" id="sc_' + K.esc(m.id) + '" type="number" step="any" placeholder="today" data-c="scSet" data-x="' + K.esc(m.id) + '"></li>';
        }).join("") + "</ul>");
      });
      return h;
    },
    next: function () {
      var stale = metrics().filter(function (m) { var l = last(m.id); return !l || K.days(l.d) > (m.every || 31); });
      if (!stale.length) return null;
      return { score: hist() && Object.keys(hist()).length ? 32 : 18, text: "Update " + stale.length + " " + K.term("scorecard", "scorecard") + " number(s), starting with " + stale[0].name, why: "A number you have not looked at is a risk you have not looked at.", go: "scorecard" };
    },
    week: function (from) {
      var n = 0, better = 0, H = hist();
      metrics().forEach(function (m) { var h = H[m.id] || []; h.forEach(function (e, i) { if (e.d >= from) { n++; if (i && K.metricPct(m, e.v) > K.metricPct(m, h[i - 1].v)) better++; } }); });
      var out = []; if (n) out.push({ n: n, what: "number(s) logged" }); if (better) out.push({ n: better, what: "number(s) moved the right way" }); return out;
    },
    onTarget: function () { var M = metrics(), n = 0, on = 0; M.forEach(function (m) { var l = last(m.id); if (l) { n++; if (K.metricPct(m, l.v) >= 70) on++; } }); return n ? on / n : null; },
    acts: {
      scSet: function (id, el) {
        var v = parseFloat(el.value); if (isNaN(v)) return;
        var H = hist(), h = H[id] || (H[id] = []), d = K.ymd();
        if (h.length && h[h.length - 1].d === d) h[h.length - 1].v = v; else h.push({ d: d, v: v });
        H[id] = h.slice(-60); K.set("score", H, { what: "number" }); K.render(); K.toast("Logged.");
      }
    }
  });
})();
/* Playbooks: the edition's know-how as short, tickable steps ("when this happens, do this, in this order").
   Ticks are kept per playbook, so a long one (the first 90 days) can be worked through over weeks; Reset starts it again. */
(function () {
  var K = window.OSK;
  function list() { return (K.cfg("playbooks") || {}).items || []; }
  function ticks() { return K.get("pb", {}); }
  K.module({
    id: "playbooks", label: function () { return K.term("playbooks", "Playbooks"); },
    render: function () {
      var c = K.cfg("playbooks") || {}, t = ticks(), open = K._pb, h = "<h2>" + K.esc(K.term("playbooks", "Playbooks")) + "</h2>";
      if (c.intro) h += '<p class="muted">' + K.esc(c.intro) + "</p>";
      list().forEach(function (p) {
        var done = (t[p.id] || []).length, n = (p.steps || []).length, isOpen = open === p.id;
        var body = (p.when ? '<p class="muted">When: ' + K.esc(p.when) + "</p>" : "") + K.bar(n ? done / n * 100 : 0);
        if (isOpen) {
          body += "<ol class='list'>" + p.steps.map(function (s, i) {
            var on = (t[p.id] || []).indexOf(i) >= 0;
            return '<li class="row tick' + (on ? " done" : "") + '"><button class="check" data-a="pbTick" data-x="' + K.esc(p.id + "|" + i) + '" aria-pressed="' + on + '" aria-label="Step ' + (i + 1) + '">' + (on ? "✓" : "") + '</button><div class="grow">' + K.esc(s) + "</div></li>";
          }).join("") + "</ol>";
          if (p.cmd) body += '<p class="muted">On the estate: <code>' + K.esc(p.cmd) + "</code></p>";
          if (p.template) body += '<p class="muted">Template: <code>' + K.esc(p.template) + "</code></p>";
          body += '<div class="btns"><button data-a="pbOpen" data-x="">Close</button>' + (done ? '<button class="ghost" data-a="pbReset" data-x="' + K.esc(p.id) + '">Reset</button>' : "") + "</div>";
        } else body += '<button data-a="pbOpen" data-x="' + K.esc(p.id) + '">' + (done ? "Continue (" + done + "/" + n + ")" : "Open") + "</button>";
        h += K.card(K.esc(p.title), body);
      });
      return h;
    },
    // a playbook started and left half-done for two weeks deserves a nudge
    next: function () {
      var t = ticks(), at = K.get("pbAt", {}), out = [];
      list().forEach(function (p) { var d = (t[p.id] || []).length; if (d && d < p.steps.length && at[p.id] && K.days(at[p.id]) >= 14) out.push({ score: 22, text: "Continue the playbook “" + p.title + "” (" + d + "/" + p.steps.length + ")", why: "Half-done for " + K.days(at[p.id]) + " days.", go: "playbooks" }); });
      return out;
    },
    week: function (from) { var at = K.get("pbAt", {}), n = Object.keys(at).filter(function (k) { return at[k] >= from; }).length; return n ? [{ n: n, what: "playbook(s) worked on" }] : []; },
    acts: {
      pbOpen: function (id) { K._pb = id || null; K.render(); },
      pbTick: function (x) {
        var p = String(x).split("|"), t = ticks(), a = t[p[0]] || (t[p[0]] = []), i = +p[1], j = a.indexOf(i);
        if (j >= 0) a.splice(j, 1); else a.push(i);
        var at = K.get("pbAt", {}); at[p[0]] = K.ymd();
        K.set("pb", t, { what: "step" }); K.set("pbAt", at, { noUndo: true }); K.render();
      },
      pbReset: function (id) { var t = ticks(); delete t[id]; K.set("pb", t, { what: "reset playbook" }); K.render(); }
    }
  });
})();
/* Progress: the north star made visible. What got better this week (from every module's own count), the streak of
   weeks with a win, and a resilience index that only rises with real practice: rhythm kept, numbers on target,
   lessons turned into changes, and the riskiest items owned and dated. Every part says where it comes from. */
(function () {
  var K = window.OSK;
  function weekStart() { var d = new Date(), wd = (d.getDay() + 6) % 7; return K.addDays(K.ymd(), -wd); }   // Monday
  K.weekWins = function (from) {
    var out = [];
    Object.keys(K.mods).forEach(function (id) { var m = K.mods[id]; if (m.week && K.cfg(id)) { try { out = out.concat(m.week(from) || []); } catch (e) {} } });
    return out;
  };
  // 0-100, from parts the person can see and change; a part with no data yet is left out, never counted as zero or full.
  K.resilience = function () {
    var parts = [], c = K.cfg("progress") || {};
    if (K.mods.cadence && K.cfg("cadence")) { var t = K.mods.cadence.onTime(); if (t != null) parts.push({ n: "Rhythm kept (90 days)", v: t }); }
    if (K.mods.scorecard && K.cfg("scorecard")) { var s = K.mods.scorecard.onTarget(); if (s != null) parts.push({ n: "Numbers on target", v: s }); }
    if (c.lessons && K.mods.registers) {
      var ok = c.lessons_done || ["Changed"], L = K.get("reg." + c.lessons, []), done = L.filter(function (x) { return ok.indexOf(x.status) >= 0; }).length;
      if (L.length) parts.push({ n: "Lessons turned into a change", v: done / L.length });
    }
    if (c.risks && K.mods.registers) {
      var R = (K.get("reg." + c.risks, []) || []).filter(function (x) { return (c.risks_closed || ["Closed"]).indexOf(x.status) < 0; });
      var rc = (K.cfg("registers") || []).filter(function (r) { return r.id === c.risks; })[0] || {};
      var hi = R.filter(function (x) { return K.regScore(rc, x) >= (c.risk_high || 12); });
      if (hi.length) parts.push({ n: "Top risks owned and dated", v: hi.filter(function (x) { return x.owner && x.due; }).length / hi.length });
    }
    var score = parts.length ? Math.round(parts.reduce(function (a, p) { return a + p.v; }, 0) / parts.length * 100) : null;
    return { score: score, parts: parts };
  };
  function sum(a) { return a.reduce(function (x, w) { return x + w.n; }, 0); }
  // the counters look forward from a date, so one week's wins are "since its Monday" less "since the next Monday"
  function inWeek(w) { return sum(K.weekWins(w)) - sum(K.weekWins(K.addDays(w, 7))); }
  function streak() {
    var n = 0, w = weekStart();
    if (inWeek(w) <= 0) w = K.addDays(w, -7);   // this week may not have its first win yet
    for (var i = 0; i < 52 && inWeek(w) > 0; i++) { n++; w = K.addDays(w, -7); }
    return n;
  }
  K.module({
    id: "progress", label: function () { return K.term("progress", "Progress"); },
    weekCard: function () {
      var W = K.weekWins(weekStart()), R = K.resilience();
      var h = W.length ? "<ul class='wins'>" + W.map(function (w) { return "<li><b>" + w.n + "</b> " + K.esc(w.what) + "</li>"; }).join("") + "</ul>" : "<p>No wins logged this week yet. One ritual or one decision is enough to start.</p>";
      if (R.score != null) h += '<p class="muted">' + K.esc(K.term("resilience", "Resilience index")) + ": <b>" + R.score + "</b>/100 · " + '<a href="#" data-a="go" data-x="progress">why</a></p>';
      return K.card("This week", h);
    },
    render: function () {
      var R = K.resilience(), s = streak(), h = "<h2>" + K.esc(K.term("progress", "Progress")) + "</h2>";
      if (K.ed.north_star) h += '<p class="north">' + K.esc(K.ed.north_star) + "</p>";
      h += this.weekCard();
      h += K.card("Weeks in a row with a win", '<p class="big">' + s + "</p>");
      h += K.card(K.esc(K.term("resilience", "Resilience index")), R.score == null ? "<p>It appears once there is something to measure: a review done, a number logged, a lesson recorded.</p>"
        : '<p class="big">' + R.score + "/100</p><ul class='list'>" + R.parts.map(function (p) { return "<li>" + K.esc(p.n) + ": " + Math.round(p.v * 100) + "%" + K.bar(p.v * 100) + "</li>"; }).join("") + "</ul><p class='muted'>Only practice moves it. It falls when the rhythm slips, so it cannot be gamed by typing.</p>");
      h += K.card("Last week", "<p>" + inWeek(K.addDays(weekStart(), -7)) + " thing(s) done last week.</p>");
      return h;
    }
  });
})();
/* Feeds: read-only numbers the estate already knows, shown where the person looks every day.
   Each feed is a same-address JSON file the estate writes (for example ./securax govern writes portal/govern-state.json).
   No feed file, no card: the app never depends on it, and never calls another site. */
(function () {
  var K = window.OSK;
  var cache = {};
  function feeds() { return (K.cfg("feeds") || {}).items || []; }
  function fetchAll() {
    if (!window.fetch || location.protocol.indexOf("http") !== 0) return;
    feeds().forEach(function (f) {
      if (!/^(\.\.\/|\/)?[a-z0-9_\-\/]+\.json$/i.test(f.url)) return;   // same address only
      fetch(f.url, { cache: "no-cache", credentials: "same-origin" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { if (j) { cache[f.id] = j; K.set("~feed." + f.id, j); K.render(); } })
        .catch(function () {});
    });
  }
  // A view per feed kind; a kind the kit does not know is skipped.
  var VIEWS = {
    govern: function (j, f) {
      var tiers = j.coverage || {}, recs = (j.top || []).slice(0, f.top || 3);
      var h = '<p><b>Maturity ' + K.esc(j.maturity) + "/5</b> · " + Object.keys(tiers).map(function (t) { return K.esc(t) + " " + K.esc(tiers[t]) + "%"; }).join(" · ") + "</p>";
      if (j.budget) h += '<p class="muted">To close the gaps: ' + K.esc(j.budget) + "</p>";
      if (recs.length) h += "<ol class='list'>" + recs.map(function (r) { return "<li><b>" + K.esc(r.what) + '</b><div class="muted">' + K.esc([r.who, r.when, r.how_much].filter(Boolean).join(" · ")) + "</div></li>"; }).join("") + "</ol>";
      h += '<p class="muted">From <code>./securax govern</code>' + (j.at ? ", " + K.esc(j.at) : "") + ".</p>";
      return h;
    }
  };
  function view(f) {
    var j = cache[f.id] || K.get("~feed." + f.id, null), v = VIEWS[f.kind];
    if (!j || !v) return "";
    try { return K.card(K.esc(f.title || f.id), v(j, f)); } catch (e) { return ""; }
  }
  K.module({
    id: "feeds", label: function () { return K.term("feeds", "From the estate"); },
    todayCard: function () { return feeds().filter(function (f) { return f.today; }).map(view).join(""); },
    render: function () {
      var h = feeds().map(view).join("");
      return "<h2>" + K.esc(K.term("feeds", "From the estate")) + "</h2>" + (h || "<p>Nothing from the estate yet. On the estate machine run <code>./securax govern</code> once; this screen then fills itself.</p>");
    }
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fetchAll); else setTimeout(fetchAll, 0);
})();
/* Settings: who it is for, the principles behind it, backup (export and import), sync with your own estate, theme, Undo.
   Backup is a plain JSON file: it always works, with or without the estate. */
(function () {
  var K = window.OSK;
  function syncBlock() {
    var c = K.syncCfg(), own = K.get("~sync", null), f = K.get("~syncFails", 0), last = K.get("~synced", null), note = K.get("~syncNote", null);
    var h = c ? "<p>Synced with your estate" + (last ? ", last at " + K.esc(last) : "") + (own ? "" : " (using the Life OS pairing on this address)") + ".</p>" + (f > 2 ? '<p class="tag late">The last ' + f + " tries failed. Your data is safe here; it will catch up.</p>" : "")
      : "<p>Not synced: your data lives on this device only. Export a backup now and then, or pair with your estate below.</p>";
    if (note) h += '<p class="muted">' + K.esc(note) + "</p>";
    h += '<details><summary>Pair this app by itself</summary><label for="syU">Sync address (in a phone app from a store, your estate\'s full address ending in /sync)</label><input id="syU" placeholder="/sync" value="' + K.esc((own && own.url) || "") + '">'
      + '<label for="syN">Your user name on the estate</label><input id="syN" value="' + K.esc((own && own.user) || "") + '">'
      + '<label for="syK">Device key</label><input id="syK" type="password" autocomplete="off">'
      + '<div class="btns"><button data-a="syncSave">Pair</button>' + (own ? '<button class="ghost" data-a="syncForget">Forget this pairing</button>' : "") + "</div></details>";
    return h + (c ? '<button data-a="syncNow">Sync now</button>' : "");
  }
  K.module({
    id: "settings", label: function () { return K.term("settings", "Settings"); },
    render: function () {
      var p = K.get("profile", {}), ed = K.ed, h = "<h2>" + K.esc(K.term("settings", "Settings")) + "</h2>";
      h += K.card("About " + K.esc(ed.name), "<p>" + K.esc(ed.tagline || "") + "</p>" + (ed.audience ? '<p class="muted">For: ' + K.esc(ed.audience) + "</p>" : "")
        + ((ed.principles || []).length ? "<ul class='list'>" + ed.principles.map(function (x) { return "<li><b>" + K.esc(x.name) + "</b>" + (x.core ? ' <span class="tag">core</span>' : "") + ": " + K.esc(x.text) + "</li>"; }).join("") + "</ul>"
          + '<p class="muted">Core principles come from the estate\'s one shared list, so every app carries them and gets their improvements.</p>' : ""));
      if ((ed.whatsnew || []).length) h += K.card("What's new", "<ul class='list'>" + ed.whatsnew.slice().reverse().map(function (n) { return "<li>" + K.esc(n.text) + ' <span class="muted">' + K.esc(n.date) + "</span></li>"; }).join("") + "</ul>");
      h += K.card("You", '<label for="pfName">First name</label><input id="pfName" value="' + K.esc(p.name || "") + '"><label for="pfOrg">Organisation</label><input id="pfOrg" value="' + K.esc(p.org || "") + '"><button data-a="profileSave">Save</button>');
      h += K.card("Backup", '<p>Your data stays on this device. A backup is one file you can keep anywhere.</p><div class="btns"><button class="primary" data-a="exportNow">Export a backup</button>'
        + '<label class="file">Import a backup<input type="file" id="impFile" accept="application/json" data-c="importFile"></label></div>'
        + (K.get("lastExport", null) ? '<p class="muted">Last export ' + K.esc(K.get("lastExport")) + "</p>" : ""));
      h += K.card("Sync", syncBlock());
      h += K.card("Look and undo", '<div class="btns"><button data-a="theme">Light or dark</button><button data-a="undo">Undo the last change</button></div>');
      return h;
    },
    next: function () {
      if (K.syncCfg()) return null;
      var le = K.get("lastExport", null), st = K.get("started", K.ymd());
      if ((le && K.days(le) > 30) || (!le && K.days(st) > 7 && K.keys().length > 5)) return { score: 28, text: "Export a backup (one tap)", why: le ? "Last backup " + le + "." : "Nothing is synced and there is no backup yet.", go: "settings" };
      return null;
    },
    acts: {
      exportNow: function () {
        K.set("lastExport", K.ymd(), { noUndo: true });
        var blob = new Blob([JSON.stringify(K.dump(), null, 1)], { type: "application/json" });
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (K.ed.id || "app") + "-backup-" + K.ymd() + ".json";
        document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        K.toast("Backup saved to your downloads.");
      },
      importFile: function (_x, el) {
        var f = el.files && el.files[0]; if (!f) return;
        var r = new FileReader();
        r.onload = function () { try { K.load(JSON.parse(r.result)); K.render(); K.toast("Backup restored."); } catch (e) { K.toast("Not restored: " + e.message); } };
        r.readAsText(f);
      },
      syncSave: function () {
        var u = K.val("syU"), n = K.val("syN"), k = K.val("syK");
        if (!u || !n || !k) { K.toast("All three are needed: address, user name and key."); return; }
        K.set("~sync", { url: u, user: n, key: k }); K.pull().then(function () { K.render(); }); K.toast("Paired. Syncing now.");
      },
      syncForget: function () { K.set("~sync", null); K.render(); },
      syncNow: function () { K.pull().then(function () { K.render(); K.toast(K.get("~syncFails", 0) ? "Could not reach the estate. Your data is safe here." : "Synced."); }); }
    }
  });
})();
OSK.start();
</script>
</body>
