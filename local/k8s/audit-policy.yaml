apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: ["RequestReceived"]
rules:
  # High value: secrets and exec are logged with full request/response (ATLAS recon/credential access)
  - level: RequestResponse
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "pods/exec", "pods/attach"]
  - level: Metadata
    resources:
      - group: ""
        resources: ["pods", "services"]
  - level: None
    users: ["system:kube-proxy"]
  - level: Metadata
