# Overlay that puts the whole estate behind one TLS edge. Enabled by `./securax tls on` (it sets COMPOSE_FILE in .env);
# `./securax tls off` removes it. Nothing here changes the services themselves, only how the host reaches them.
services:
  tls-edge:
    image: nginx:1.27-alpine
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    security_opt: ["no-new-privileges:true"]
    volumes:
      # generated by `./securax tls render` (also on every `up`) from governance/tls.py: one server block per service name
      - ./tls-edge.generated.conf:/etc/nginx/conf.d/default.conf:ro
      # ONLY the server certificate and key go in. The CA key stays in ~/.securax/tls and never enters a container.
      - ${TLS_DIR:?run ./securax tls on first}/server.crt:/etc/tls/server.crt:ro
      - ${TLS_DIR:?run ./securax tls on first}/server.key:/etc/tls/server.key:ro
    # ONE name-routed HTTPS port (+ port 80 that only redirects). No other port is published for the web UIs.
    ports:
      - "${BIND_HOST:-127.0.0.1}:443:443"
      - "${BIND_HOST:-127.0.0.1}:80:80"
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # The plain-HTTP web ports are no longer published on the host: the only way in is HTTPS.
  guiding-map: { ports: !override [] }
  open-webui:  { ports: !override [] }
  anythingllm: { ports: !override [] }
  n8n:         { ports: !override [] }
  estate-sync: { ports: !override [] }
  # The gateway keeps ONE plain port, bound to this machine only, because the CLI's own health checks use it
  # (phase 2 moves the CLI to HTTPS). Nothing remote can reach it.
  gateway:     { ports: !override ["127.0.0.1:8080:8080"] }
