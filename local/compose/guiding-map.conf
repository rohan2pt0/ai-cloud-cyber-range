# nginx config for the Guiding Map container.
# WHY THIS FILE EXISTS: we must NOT bind-mount the `portal` dir *inside* the read-only
# `guiding-map` mount (Docker can't create the nested mountpoint on a read-only fs — it fails
# hard on Docker Desktop / WSL2 with "read-only file system"). Instead `portal` is mounted at
# a SIBLING path (/srv/portal) and served here via an alias. Portable to Windows, macOS, Linux.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate (cheap: the ETag answers 304). Without this a browser keeps an old hub.html for hours by heuristic caching
    # (it uses a fraction of the file's age), so a fixed Command Center looked unchanged after an update.
    add_header Cache-Control "no-cache" always;

    # the Guiding Map PWA at the root
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Command Center lives in the SAME mount as the PWA (/usr/share/nginx/html),
    # so it is served directly at /hub.html with no second mount and no alias — the
    # most robust path (this mount has worked since the first PWA deploy). Memorable
    # short URLs point here; the old /portal/hub.html path is redirected so existing
    # bookmarks keep working after the move.
    location = /hub           { return 302 /hub.html; }
    location = /apps          { return 302 /hub.html; }
    location = /portal/hub.html { return 302 /hub.html; }

    # the self-documenting portal (explainer etc.), mounted separately (no nested bind mount)
    location /portal/ {
        alias /srv/portal/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }
}
