# nginx config for the Guiding Map container.
# WHY THIS FILE EXISTS: we must NOT bind-mount the `portal` dir *inside* the read-only
# `guiding-map` mount (Docker can't create the nested mountpoint on a read-only fs — it fails
# hard on Docker Desktop / WSL2 with "read-only file system"). Instead `portal` is mounted at
# a SIBLING path (/srv/portal) and served here via an alias. Portable to Windows, macOS, Linux.
# WebSocket upgrade only when the client asks for it (live sync); plain requests keep a normal Connection header.
map $http_upgrade $gm_conn { default upgrade; '' ''; }
# Online (doc 86): a request that came through your Cloudflare Access gate and sent no key of its own goes to the AI gateway as the
# signed-in person (the gateway verifies the token, then applies that person's AI allowance). A key the caller sent always wins.
map "$http_authorization|$http_cf_access_jwt_assertion" $gm_auth {
    "~^\|(?<jwt>[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+)$"  "Bearer $jwt";
    default                                                              $http_authorization;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate (cheap: the ETag answers 304). Without this a browser keeps an old hub.html for hours by heuristic caching
    # (it uses a fraction of the file's age), so a fixed Command Center looked unchanged after an update.
    add_header Cache-Control "no-cache" always;
    # Security headers (doc 87, OWASP secure headers): no other site may frame these pages (clickjacking), the browser must not guess
    # file types, links do not leak this address, and powerful device features stay off. Scripts are not restricted further here
    # because the Life OS is one file with inline code; frame-ancestors / object-src / base-uri carry the protection that matters.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # the Guiding Map PWA at the root
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The Command Center lives in the SAME mount as the PWA (/usr/share/nginx/html),
    # so it is served directly at /hub.html with no second mount and no alias — the
    # most robust path (this mount has worked since the first PWA deploy). Memorable
    # short URLs point here; the old /portal/hub.html path is redirected so existing
    # bookmarks keep working after the move.
    location = /hub           { return 302 /hub.html; }
    location = /apps          { return 302 /hub.html; }
    location = /portal/hub.html { return 302 /hub.html; }

    # ONE address for phones and tablets (Tailscale serves only this port, doc 58): the AI gateway and the sync
    # service ride the SAME origin as the app, so the browser needs no cross-origin permission and nothing else
    # is published. Names are resolved per request, so the app still loads while either service is stopped.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /v1/ {
        set $gm_gw http://gateway:8080;
        proxy_pass $gm_gw;
        proxy_set_header Authorization $gm_auth;
        proxy_set_header X-Forwarded-Host $http_host;   # the address the browser used: the gateway's cross-site check compares it
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 8m;
    }
    location = /healthz {
        set $gm_gw http://gateway:8080;
        proxy_pass $gm_gw;
    }
    location = /version {
        set $gm_gw http://gateway:8080;
        proxy_pass $gm_gw;
    }
    location /sync {
        set $gm_sy http://estate-sync:8089;
        proxy_pass $gm_sy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gm_conn;
        # the address this proxy saw, OVERWRITING any the client sent (doc 87: refused sign-ins are counted per client, not per proxy)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        client_max_body_size 8m;
    }

    # Same-origin status probes so the Command Center shows the REAL status of each service on this plain address too
    # (not only behind the HTTPS edge): /_up/<name> proxies to that service and returns ITS status — a 502 means "not
    # running". Without this, a browser's cross-origin no-cors fetch cannot read a status, so a stopped service used to
    # look "running" (a false green). The upstreams mirror the HTTPS edge (governance/tls.py). The resolver above lets
    # nginx start even while a service is down (the name is resolved per request; a down service returns 502, not a
    # config error).
    location = /_up/chat  { set $gm_up http://open-webui:8080; rewrite ^ / break; proxy_pass $gm_up; }
    location = /_up/docs  { set $gm_up http://anythingllm:3001; rewrite ^ / break; proxy_pass $gm_up; }
    location = /_up/flows { set $gm_up http://n8n:5678; rewrite ^ / break; proxy_pass $gm_up; }
    location = /_up/studio { set $gm_up http://studio:8080; rewrite ^ / break; proxy_pass $gm_up; }

    # Code Studio (doc 119, `./securax studio`): the VS Code + Cline GUI, reached BY NAME at /studio/ (never a raw port).
    # Lazy-resolved like the probes above, so this nginx still starts when Studio is off (a down service returns 502). The
    # editor needs WebSockets and large uploads. The /studio/ prefix is preserved so code-server serves its assets under it.
    # The single add_header below deliberately REPLACES the server's restrictive headers for this path only (nginx drops
    # inherited add_headers when a location sets its own), so code-server can send its own CSP that its webviews need.
    location /studio/ {
        set $gm_st http://studio:8080;
        proxy_pass $gm_st;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gm_conn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        client_max_body_size 256m;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # the self-documenting portal (explainer etc.), mounted separately (no nested bind mount)
    location /portal/ {
        alias /srv/portal/;
        index index.html;
        add_header Cache-Control "no-cache" always;
        # a location with its own add_header drops the server's, so the security headers are repeated here
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }
}
