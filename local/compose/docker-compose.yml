# VulnBank AI Range - local plane (runs on the HP Spectre x360, ~6-8 GB RAM).
# Brings up: guardrail gateway -> LiteLLM router -> Ollama (local SLM) with a full
# DevSecOps + observability side-car so the range looks like a real enterprise estate.
#
#   docker compose --profile core up -d          # gateway + model router + db
#   docker compose --profile security up -d       # + Wazuh-style SIEM-lite + Trivy
#   docker compose --profile ai up -d             # + Ollama + Llama Guard
#
# START IT WITH  ./securax up  (or .\securax.cmd up on Windows): it first generates litellm-config.generated.yaml
# from your .env. Running `docker compose` directly needs:  python3 gen_litellm_config.py --write   once.
#
# Secrets come from .env (never committed). See local/compose/.env.example.
name: vulnbank-range

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  edge:       # client-facing
  modelplane: # gateway <-> router <-> models. NOT internal: LiteLLM needs egress to reach cloud
              # models (Gemini etc.) and Ollama needs it to pull models on first run. No model
              # container publishes a host port, so they are still not reachable from outside;
              # only the gateway (:8080) is the published front door. Output rails catch exfil.
  data:
    internal: true   # Postgres never needs the internet — kept fully isolated.

volumes:
  pgdata:
  ollama:
  loki:
  grafana:
  openwebui:    # Open WebUI chat history & settings (per-viewer, local)
  anythingllm:  # AnythingLLM workspaces & vector index (private RAG)
  n8n:          # n8n automation workflows & credentials
  estatesync:   # sovereign cross-device life-OS state (SQLite, your box only)
  passwords:    # the password manager (Vaultwarden): your vault, encrypted on your devices before it is stored
  gatewaystate: # the gateway's AI allowance ledger (tokens spent per caller today / this month)

services:
  gateway:
    build: ../../apps/llm-gateway
    image: vulnbank/llm-gateway:dev
    mem_limit: 256m
    cpus: 0.5
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      GUARDRAIL_MODE: ${GUARDRAIL_MODE:-enforce}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://litellm:4000/v1}
      UPSTREAM_API_KEY: ${LITELLM_MASTER_KEY:-sk-range-dev}
      LLAMA_GUARD_URL: ${LLAMA_GUARD_URL:-}
      FAIL_MODE: ${FAIL_MODE:-closed}
      RATE_LIMIT_PER_MIN: "30"
      # Identity (apps/llm-gateway/app/identity.py). Off by default on a laptop; `./securax gateway-auth enable` turns it on.
      AUTH_MODE: ${AUTH_MODE:-off}
      GATEWAY_API_KEYS_B64: ${GATEWAY_API_KEYS_B64:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_JWKS_JSON: ${OIDC_JWKS_JSON:-}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM:-roles}
      AUTH_ROLE_MAP: ${AUTH_ROLE_MAP:-}
      AUTH_MFA_ROLES: ${AUTH_MFA_ROLES:-admin,auditor}
      AUTH_MFA_ACR: ${AUTH_MFA_ACR:-}
      # Data residency (apps/llm-gateway/app/residency.py). Off by default; `./securax residency enable --jurisdiction IN` turns it on.
      RESIDENCY_MODE: ${RESIDENCY_MODE:-off}
      RESIDENCY_ACTION: ${RESIDENCY_ACTION:-reroute}
      RESIDENCY_POLICY_B64: ${RESIDENCY_POLICY_B64:-}
      SYSTEM_PROMPT_CANARIES: ${SYSTEM_PROMPT_CANARY:-CANARY-7f3a9c}
      TOOL_POLICY_FILE: ${TOOL_POLICY_FILE:-}
      SECURAX_VERSION: ${SECURAX_VERSION:-}   # ./securax up exports this from the VERSION file
      GIT_COMMIT: ${GIT_COMMIT:-}
      SECURAX_BUILD: ${SECURAX_BUILD:-}   # the build label (governance/buildinfo.py): changes with every commit
      # Human-in-command (RBI MRM draft): `./securax ai stop|resume` writes this file; the gateway re-reads it on change, no restart.
      AI_CONTROL_FILE: /etc/securax/controls/ai-control.json
      # AI allowance per caller (doc 69): daily and monthly tokens on cloud models, warning at 80%, stop at 100%, extend with
      # ./securax ai budget extend. 2M a day / 20M a month is about US$15 a month on a Flash-class model; 0 switches a limit off.
      AI_BUDGET_DAY_TOKENS: ${AI_BUDGET_DAY_TOKENS:-2000000}
      AI_BUDGET_MONTH_TOKENS: ${AI_BUDGET_MONTH_TOKENS:-20000000}
      AI_BUDGET_COUNT_LOCAL: ${AI_BUDGET_COUNT_LOCAL:-0}
      SECURAX_DOMAIN: ${SECURAX_DOMAIN:-securax.localhost}   # the estate's own HTTPS names may call this API from a browser (CORS)
    volumes:
      - ./controls:/etc/securax/controls:ro      # the AI kill switch (read-only: nothing inside the gateway can switch AI back on)
      - gatewaystate:/var/lib/securax            # AI allowance spend (so a restart does not reset the month)
    ports: ["${BIND_HOST:-127.0.0.1}:8080:8080"]   # loopback unless you opened the estate to your devices (BIND_HOST)
    networks: [edge, modelplane]
    logging: *default-logging
    # Start only once the model router is READY, and report healthy only while it is. (`depends_on: [x]`
    # alone waits for the container to START, which left a window where the gateway was "up" but every
    # chat failed and the model list was partial.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 5s
    depends_on:
      litellm: { condition: service_healthy }

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-range-dev}
      # EVERY provider key the generated litellm-config.generated.yaml may reference as os.environ/<NAME> must be
      # listed here (least privilege: we do NOT pass the whole .env into this container). A key missing
      # from this list silently resolves to nothing and that provider fails with an auth error.
      # Enforced by local/compose/tests/test_gen_litellm_config.py.
      # Sovereign + offline-first: never let the router fetch tokenizers from huggingface.co (found by the
      # sandbox: it did, on EVERY request, retrying for seconds when offline). LiteLLM falls back to its
      # bundled tokenizer for token counting.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      E2E_TIR_API_KEY: ${E2E_TIR_API_KEY:-}
      E2E_TIR_API_BASE: ${E2E_TIR_API_BASE:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      PERPLEXITYAI_API_KEY: ${PERPLEXITYAI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_REGION_NAME: ${AWS_REGION:-ap-south-1}
    volumes: ["./litellm-config.generated.yaml:/etc/litellm/config.yaml:ro"]
    networks: [modelplane]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  ollama:
    image: ollama/ollama:0.40.4
    # Sized to YOUR machine by `./securax profile` (writes OLLAMA_MEM / OLLAMA_CPUS to .env).
    mem_limit: ${OLLAMA_MEM:-5g}
    cpus: ${OLLAMA_CPUS:-3.0}
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # CPU-only laptop tuning: keep the model warm (reloading it is the slowest part), and never run
      # two models / two requests at once (that is how a 16 GB box starts swapping and crawls).
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Context memory at half price (doc 57): the conversation cache in 8-bit instead of 16-bit, which needs flash attention. A model
      # that cannot use it falls back to the default by itself. Set OLLAMA_KV_CACHE_TYPE=f16 to switch back.
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # The context window every local model gets. Coding agents (OpenCode, Aider) need room for files; 16K fits a 16 GB laptop with the
      # 8-bit cache above. The OpenCode config declares the same number (gen_opencode_config.py LOCAL_LIMIT), so it never overfills it.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes: ["ollama:/root/.ollama"]
    networks: [modelplane]
    # To load models after up:  docker exec -it <ollama> ollama pull qwen2.5:1.5b && ollama pull llama-guard3:1b
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: range
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: range
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # ---- observability / SIEM-lite (maps to Wazuh+Sentinel+Chronicle in the cloud) ----
  loki:
    image: grafana/loki:3.3.2
    profiles: ["security"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["loki:/loki"]
    networks: [edge]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["security"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["${BIND_HOST:-127.0.0.1}:3000:3000"]
    volumes: ["grafana:/var/lib/grafana"]
    networks: [edge]
    logging: *default-logging

  # ---- on-demand DevSecOps scanners (run once, then exit) ----
  trivy:
    image: aquasec/trivy:0.58.1
    profiles: ["security"]
    entrypoint: ["sh", "-c", "trivy image --scanners vuln,secret,misconfig --exit-code 0 vulnbank/llm-gateway:dev || true; sleep infinity"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [edge]
    logging: *default-logging

  # ---- Pillar 3: SENTINEL hybrid-AI daily driver (profile: ai) --------------------
  # Unified chat UI. All traffic is pointed at the GUARDRAIL GATEWAY (not LiteLLM
  # directly), so every prompt/response passes the Red/Yellow/Green rails first.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.12.2
    # 1.5 GB: document search embeds INSIDE this container (local model, nothing leaves the box), which needs about
    # 0.5 GB on its own; at 1 GB uploading your handbooks could kill it. Doing it in Ollama instead would evict your chat
    # model (OLLAMA_MAX_LOADED_MODELS=1 keeps CPU laptops from swapping) and reload it on every document question.
    mem_limit: ${OPENWEBUI_MEM:-1536m}
    cpus: 1.0
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # Gateway speaks the OpenAI API; it forwards to LiteLLM -> Ollama/cloud.
      OPENAI_API_BASE_URL: http://gateway:8080/v1
      OPENAI_API_KEY: ${WEBUI_GATEWAY_KEY:-${LITELLM_MASTER_KEY:-sk-range-dev}}   # a gateway service key once `gateway-auth enable` is on
      WEBUI_AUTH: "true"            # local account; stays on your machine
      # Online (doc 85): sign in to Chat with the same Cloudflare Access sign-in. Set only by `./securax online setup`, which also binds
      # every port to 127.0.0.1, so this header can come only through the tunnel. Empty = off.
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: ${OWUI_TRUSTED_EMAIL_HEADER:-}
      ENABLE_OLLAMA_API: "false"    # force traffic through the gateway, not raw Ollama
      # Default new chats to the FREE/sovereign path (Gemini free-tier -> local fallback), never a
      # paid provider. Pick another model from the dropdown any time; this is just the safe default.
      DEFAULT_MODELS: ${DEFAULT_MODELS:-bank-assistant}
      # Open WebUI stores its FIRST-RUN settings in its database and then ignores env changes, so a
      # later default (like the line above) never reached existing installs. Make this file authoritative.
      ENABLE_PERSISTENT_CONFIG: "false"
      AIOHTTP_CLIENT_TIMEOUT: "600"          # CPU-only answers can take minutes; the default 300s cut them off
      # The built-in "Arena Model" picks a RANDOM model per message (could be a paid/unexpected one) — off.
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      # ---- The Twin (doc 53). Set here, not in Admin screens: with persistent config off those are lost on restart.
      # One sign-in key kept in .env (`up` creates it). Without it Open WebUI makes a new one whenever the container is
      # recreated (every `./securax update`): you were signed out and tool tokens broke.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      JWT_EXPIRES_IN: ${OWUI_JWT_EXPIRES_IN:-7d}            # without Redis, signing out does not end a session: keep it short
      ENABLE_PROFILE_IMAGE_URL_FORWARDING: "false"          # avatars never fetched from outside sites (would leak your IP)
      ENABLE_WEB_SEARCH: ${OWUI_WEB_SEARCH:-true}           # the globe toggle in a chat; off per chat until you click it
      WEB_SEARCH_ENGINE: ${OWUI_WEB_SEARCH_ENGINE:-duckduckgo}   # free, no key; the search text goes to DuckDuckGo
      WEB_SEARCH_RESULT_COUNT: ${OWUI_WEB_SEARCH_RESULTS:-5}
      ENABLE_MEMORIES: "true"                               # Settings → Personalization → Memory: facts it keeps about you
      ENABLE_NOTES: "true"
      ENABLE_FOLDERS: "true"                                # folders = projects (own instructions + knowledge)
      ENABLE_CODE_INTERPRETER: "true"                       # runs Python in YOUR browser (Pyodide), not on the server
    ports: ["${BIND_HOST:-127.0.0.1}:3000:8080"]   # BIND_HOST=0.0.0.0 or your Tailscale IP to reach from phone/iPad
    volumes: ["openwebui:/app/backend/data"]
    networks: [edge, modelplane]
    depends_on:
      gateway: { condition: service_healthy }
    logging: *default-logging

  # Private document chat (Retrieval-Augmented Generation) for RED-TIER data.
  # Talks straight to local Ollama; nothing leaves the laptop.
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    mem_limit: 2g
    cpus: 1.5
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ${LOCAL_MODEL:-qwen2.5:1.5b}
      EMBEDDING_ENGINE: native      # local embeddings; no cloud call
      VECTOR_DB: lancedb            # bundled local vector DB
      STORAGE_DIR: /app/server/storage
    ports: ["${BIND_HOST:-127.0.0.1}:3001:3001"]
    volumes: ["anythingllm:/app/server/storage"]
    networks: [edge, modelplane]
    depends_on: [ollama]
    logging: *default-logging

  # The password manager (doc 84): Vaultwarden, a small server for the Bitwarden apps (browser extension, phone, desktop). Your vault is
  # encrypted on your own device before it reaches this server. Off until `./securax start passwords`; sign-ups close after your account.
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:1.37.4
    mem_limit: 128m
    cpus: 0.5
    profiles: ["passwords"]
    restart: unless-stopped
    environment:
      DOMAIN: ${PASSWORDS_URL:-http://localhost:8222}
      SIGNUPS_ALLOWED: ${PASSWORDS_SIGNUPS:-true}
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      WEBSOCKET_ENABLED: "true"
      LOG_LEVEL: warn
    ports: ["${BIND_HOST:-127.0.0.1}:8222:80"]
    volumes: ["passwords:/data"]
    networks: [edge]
    logging: *default-logging

  # Online (doc 85, ./securax online setup): an outbound-only Cloudflare Tunnel to hub.<domain> and chat.<domain>, behind Cloudflare
  # Access (your sign-in). No port is published and nothing listens on the internet; it starts only when CF_TUNNEL_TOKEN is set.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    mem_limit: 128m
    cpus: 0.25
    profiles: ["online"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    logging: *default-logging

  # Automation engine (the "glue"): morning brief, email triage, data-tier router, etc.
  # Call the gateway at http://gateway:8080/v1/chat/completions from any workflow.
  n8n:
    image: n8nio/n8n:1.74.1
    mem_limit: 768m
    cpus: 1.0
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"    # ok for localhost-only binding
      GENERIC_TIMEZONE: Asia/Kolkata
    ports: ["${BIND_HOST:-127.0.0.1}:5678:5678"]
    volumes: ["n8n:/home/node/.n8n"]
    networks: [edge, modelplane]
    logging: *default-logging

  # ---- Sovereign cross-device sync (replaces the old cloud SaaS) ---------------
  # The Guiding Map PWA pushes/pulls its state here over Tailscale. Data lives in a
  # SQLite file on the `estatesync` volume — your box only, no third party.
  # SECURE DEFAULT: bound to localhost. To let your phone/other laptop reach it,
  # set SYNC_BIND to this host's Tailscale IP (100.x.y.z) — NOT 0.0.0.0 unless you
  # mean to expose it on your LAN (it is Bearer-token gated either way).
  estate-sync:
    build: ../../apps/estate-sync
    image: securax/estate-sync:dev
    mem_limit: 128m
    cpus: 0.25
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Optional feature: empty by default so the estate ALWAYS starts. With no token the
      # service is fail-closed (every sync request gets 503 until you set SYNC_TOKENS in .env),
      # so it is never an open store and never blocks the rest of the stack from coming up.
      SYNC_TOKENS: ${SYNC_TOKENS:-}
      SYNC_DB_PATH: /data/estate-sync.db
      # Online (doc 85): a device signed in through Cloudflare Access syncs with no token; the signed token is checked here.
      SYNC_ACCESS_TEAM: ${SYNC_ACCESS_TEAM:-}
      SYNC_ACCESS_AUD: ${SYNC_ACCESS_AUD:-}
      SYNC_ACCESS_EMAILS: ${SYNC_ACCESS_EMAILS:-}
    volumes: ["estatesync:/data"]
    ports: ["${SYNC_BIND:-127.0.0.1}:8089:8089"]
    networks: [edge]
    logging: *default-logging

  # ---- Guiding Map PWA (your local-first life OS) — tiny, always-on, private ----
  guiding-map:
    image: nginx:1.27-alpine
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    mem_limit: 48m
    cpus: 0.25
    volumes:
      # NOTE: do NOT nest the portal mount inside the html mount — Docker Desktop/WSL2 cannot
      # create a mountpoint on a read-only bind mount. Mount portal at a sibling path and alias
      # it in nginx (see guiding-map.conf). This is portable across Windows/macOS/Linux.
      - ../../guiding-map:/usr/share/nginx/html:ro
      - ../../portal:/srv/portal:ro
      - ./guiding-map.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${BIND_HOST:-127.0.0.1}:8088:80"]
    networks: [edge]
    logging: *default-logging
