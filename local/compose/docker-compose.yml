# VulnBank AI Range - local plane (runs on the HP Spectre x360, ~6-8 GB RAM).
# Brings up: guardrail gateway -> LiteLLM router -> Ollama (local SLM) with a full
# DevSecOps + observability side-car so the range looks like a real enterprise estate.
#
#   docker compose --profile core up -d          # gateway + model router + db
#   docker compose --profile security up -d       # + Wazuh-style SIEM-lite + Trivy
#   docker compose --profile ai up -d             # + Ollama + Llama Guard
#
# Secrets come from .env (never committed). See local/compose/.env.example.
name: vulnbank-range

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  edge:       # client-facing
  modelplane: # gateway <-> router <-> models. NOT internal: LiteLLM needs egress to reach cloud
              # models (Gemini etc.) and Ollama needs it to pull models on first run. No model
              # container publishes a host port, so they are still not reachable from outside;
              # only the gateway (:8080) is the published front door. Output rails catch exfil.
  data:
    internal: true   # Postgres never needs the internet — kept fully isolated.

volumes:
  pgdata:
  ollama:
  loki:
  grafana:
  openwebui:    # Open WebUI chat history & settings (per-viewer, local)
  anythingllm:  # AnythingLLM workspaces & vector index (private RAG)
  n8n:          # n8n automation workflows & credentials
  estatesync:   # sovereign cross-device life-OS state (SQLite, your box only)

services:
  gateway:
    build: ../../apps/llm-gateway
    image: vulnbank/llm-gateway:dev
    mem_limit: 256m
    cpus: 0.5
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      GUARDRAIL_MODE: ${GUARDRAIL_MODE:-enforce}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://litellm:4000/v1}
      UPSTREAM_API_KEY: ${LITELLM_MASTER_KEY:-sk-range-dev}
      LLAMA_GUARD_URL: ${LLAMA_GUARD_URL:-}
      FAIL_MODE: ${FAIL_MODE:-closed}
      RATE_LIMIT_PER_MIN: "30"
      SYSTEM_PROMPT_CANARIES: ${SYSTEM_PROMPT_CANARY:-CANARY-7f3a9c}
      SECURAX_VERSION: ${SECURAX_VERSION:-}   # ./securax up exports this from the VERSION file
      GIT_COMMIT: ${GIT_COMMIT:-}
    ports: ["8080:8080"]
    networks: [edge, modelplane]
    logging: *default-logging
    depends_on: [litellm]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-range-dev}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AWS_REGION_NAME: ${AWS_REGION:-ap-south-1}
    volumes: ["./litellm-config.yaml:/etc/litellm/config.yaml:ro"]
    networks: [modelplane]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  ollama:
    image: ollama/ollama:0.5.7
    mem_limit: 5g
    cpus: 3.0
    profiles: ["ai"]
    restart: unless-stopped
    volumes: ["ollama:/root/.ollama"]
    networks: [modelplane]
    # To load models after up:  docker exec -it <ollama> ollama pull qwen2.5:1.5b && ollama pull llama-guard3:1b
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: range
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: range
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # ---- observability / SIEM-lite (maps to Wazuh+Sentinel+Chronicle in the cloud) ----
  loki:
    image: grafana/loki:3.3.2
    profiles: ["security"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: ["loki:/loki"]
    networks: [edge]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["security"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3000:3000"]
    volumes: ["grafana:/var/lib/grafana"]
    networks: [edge]
    logging: *default-logging

  # ---- on-demand DevSecOps scanners (run once, then exit) ----
  trivy:
    image: aquasec/trivy:0.58.1
    profiles: ["security"]
    entrypoint: ["sh", "-c", "trivy image --scanners vuln,secret,misconfig --exit-code 0 vulnbank/llm-gateway:dev || true; sleep infinity"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [edge]
    logging: *default-logging

  # ---- Pillar 3: SENTINEL hybrid-AI daily driver (profile: ai) --------------------
  # Unified chat UI. All traffic is pointed at the GUARDRAIL GATEWAY (not LiteLLM
  # directly), so every prompt/response passes the Red/Yellow/Green rails first.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.5.20
    mem_limit: 1g
    cpus: 1.0
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      # Gateway speaks the OpenAI API; it forwards to LiteLLM -> Ollama/cloud.
      OPENAI_API_BASE_URL: http://gateway:8080/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:-sk-range-dev}
      WEBUI_AUTH: "true"            # local account; stays on your machine
      ENABLE_OLLAMA_API: "false"    # force traffic through the gateway, not raw Ollama
    ports: ["${BIND_HOST:-127.0.0.1}:3000:8080"]   # BIND_HOST=0.0.0.0 or your Tailscale IP to reach from phone/iPad
    volumes: ["openwebui:/app/backend/data"]
    networks: [edge, modelplane]
    depends_on: [gateway]
    logging: *default-logging

  # Private document chat (Retrieval-Augmented Generation) for RED-TIER data.
  # Talks straight to local Ollama; nothing leaves the laptop.
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    mem_limit: 2g
    cpus: 1.5
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_PATH: http://ollama:11434
      OLLAMA_MODEL_PREF: ${LOCAL_MODEL:-qwen2.5:1.5b}
      EMBEDDING_ENGINE: native      # local embeddings; no cloud call
      VECTOR_DB: lancedb            # bundled local vector DB
      STORAGE_DIR: /app/server/storage
    ports: ["${BIND_HOST:-127.0.0.1}:3001:3001"]
    volumes: ["anythingllm:/app/server/storage"]
    networks: [edge, modelplane]
    depends_on: [ollama]
    logging: *default-logging

  # Automation engine (the "glue"): morning brief, email triage, data-tier router, etc.
  # Call the gateway at http://gateway:8080/v1/chat/completions from any workflow.
  n8n:
    image: n8nio/n8n:1.74.1
    mem_limit: 768m
    cpus: 1.0
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_SECURE_COOKIE: "false"    # ok for localhost-only binding
      GENERIC_TIMEZONE: Asia/Kolkata
    ports: ["${BIND_HOST:-127.0.0.1}:5678:5678"]
    volumes: ["n8n:/home/node/.n8n"]
    networks: [edge, modelplane]
    logging: *default-logging

  # ---- Sovereign cross-device sync (replaces the old cloud SaaS) ---------------
  # The Guiding Map PWA pushes/pulls its state here over Tailscale. Data lives in a
  # SQLite file on the `estatesync` volume — your box only, no third party.
  # SECURE DEFAULT: bound to localhost. To let your phone/other laptop reach it,
  # set SYNC_BIND to this host's Tailscale IP (100.x.y.z) — NOT 0.0.0.0 unless you
  # mean to expose it on your LAN (it is Bearer-token gated either way).
  estate-sync:
    build: ../../apps/estate-sync
    image: securax/estate-sync:dev
    mem_limit: 128m
    cpus: 0.25
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      # Optional feature: empty by default so the estate ALWAYS starts. With no token the
      # service is fail-closed (every sync request gets 503 until you set SYNC_TOKENS in .env),
      # so it is never an open store and never blocks the rest of the stack from coming up.
      SYNC_TOKENS: ${SYNC_TOKENS:-}
      SYNC_DB_PATH: /data/estate-sync.db
    volumes: ["estatesync:/data"]
    ports: ["${SYNC_BIND:-127.0.0.1}:8089:8089"]
    networks: [edge]
    logging: *default-logging

  # ---- Guiding Map PWA (your local-first life OS) — tiny, always-on, private ----
  guiding-map:
    image: nginx:1.27-alpine
    profiles: ["core", "security", "ai"]
    restart: unless-stopped
    mem_limit: 48m
    cpus: 0.25
    volumes:
      # NOTE: do NOT nest the portal mount inside the html mount — Docker Desktop/WSL2 cannot
      # create a mountpoint on a read-only bind mount. Mount portal at a sibling path and alias
      # it in nginx (see guiding-map.conf). This is portable across Windows/macOS/Linux.
      - ../../guiding-map:/usr/share/nginx/html:ro
      - ../../portal:/srv/portal:ro
      - ./guiding-map.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${BIND_HOST:-127.0.0.1}:8088:80"]
    networks: [edge]
    logging: *default-logging
